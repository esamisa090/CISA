,"User preference"],1,"MAC is enforced centrally by labels; DAC lets owners decide."],[5,"How should passwords be stored in a system?",["In plain text","Encrypted with a key stored beside them","As salted hashes","In a spreadsheet"],2,"Salted hashes resist recovery and rainbow tables."],[5,"In a public cloud where customers share infrastructure, which risk is MOST specific to this setup?",["Higher hardware cost","Slower typing","Easier backups","Data exposure between tenants through weak isolation"],3,"Multi-tenancy depends on strong isolation."]]},"3":{"title":"Quiz 3: 150 focus questions","desc":"New questions weighted toward the most tested domains, Operations and Protection of Information Assets.","raw":[[1,"A high-risk system goes live midyear. How should the audit function respond to its annual plan?",["Ignore the plan until next year","Update the plan based on a fresh risk assessment","Cancel all other audits","Wait for a management request"],1,"Audit plans must flex as risk changes."],[1,"An audit engagement letter or terms of reference should MAINLY document:",["The auditor's personal opinions","Technical test results","The agreed scope, objectives, responsibilities and timing","The final recommendations"],2,"It sets expectations before work starts."],[1,"A preliminary survey at the start of an audit is MAINLY used to:",["Issue the final report","Test every control","Gain an understanding of the area in order to plan the audit","Decide disciplinary action"],2,"Understanding the area comes before detailed planning."],[1,"Which of these is a control OBJECTIVE rather than a control?",["Only authorized transactions are processed","Purchase orders require manager approval","A daily exception report is reviewed","Passwords expire every 90 days"],0,"An objective states the goal; controls are the means."],[1,"Audit evidence contradicts what management told the auditor. What should the auditor do?",["Obtain additional evidence to resolve the contradiction","Accept management's version","Drop the issue","Report it immediately as fraud"],0,"Resolve conflicting evidence before concluding."],[1,"The auditor wants to estimate the total dollar amount of errors in an account balance. Which method fits BEST?",["Attribute sampling","Discovery sampling","Variable sampling","A walkthrough"],2,"Variable sampling estimates monetary values."],[1,"An audit report should be addressed to:",["The staff who did the work","Those with authority to act, such as senior management or the audit committee","The vendor","The public"],1,"Reports go to people who can act on them."],[1,"The auditor finds a minor issue that does not warrant a formal finding. What is the BEST handling?",["Ignore it","Escalate it to the board","Tell management informally and document it in the workpapers","Present it as a critical finding"],2,"Minor items are communicated and recorded, not ignored."],[1,"Follow-up of audit findings should be scheduled based on:",["The auditor's convenience","Alphabetical order","The risk and severity of the findings","The auditee's preference"],2,"Higher-risk items get earlier follow-up."],[1,"Professional skepticism means the auditor:",["Distrusts everyone","Accepts management's statements","Avoids documentation","Keeps a questioning mind and critically assesses evidence"],3,"It is a critical attitude, not hostility."],[1,"An auditor signs off a conclusion with little evidence behind it. Which principle was MOST clearly breached?",["Segregation of duties","Business continuity","Due professional care","Data classification"],2,"Conclusions must rest on sufficient evidence."],[1,"An audit that checks adherence to laws, regulations and contract terms is a:",["Compliance audit","Forensic audit","Operational audit","Financial audit"],0,"Compliance audits test adherence to requirements."],[1,"Which technique BEST tests whether all authorized payroll inputs were processed?",["Review the vendor brochure","Reconcile source documents to processed output totals","Interview staff only","Check screen colors"],1,"Reconciliation shows completeness."],[1,"An integrated test facility (ITF) lets the auditor:",["Replace all controls","Test live processing using dummy entities without disrupting operations","Delete production data","Review only paper files"],1,"Test transactions must be reversed so production data stays clean."],[1,"Which CAAT use is MOST helpful for finding missing check numbers in a series?",["Screen capture","Gap or sequence analysis","Color coding","Spell check"],1,"Gap analysis finds breaks in sequences."],[1,"The snapshot technique helps an auditor by:",["Encrypting data","Deleting logs","Capturing a transaction's state at points along its processing path","Raising the budget"],2,"It shows how a transaction was processed."],[1,"The auditor reviews a key financial model built in a spreadsheet. The GREATEST concern is:",["Font choice","Lack of version control, access control and formula validation","Sheet color","File size"],1,"Spreadsheets drive decisions but are often uncontrolled."],[1,"The auditor wants to rely on last year's control testing. This is MOST acceptable when:",["Always","Never","The control is unchanged and low risk, and procedures confirm it still works","The auditee asks"],2,"Reliance needs evidence the control is unchanged."],[1,"An external auditor wants to rely on the internal audit department's work. What should be assessed FIRST?",["Its budget","Its office","Its size","Its competence and objectivity"],3,"Reliance depends on competence and objectivity."],[1,"A qualitative risk assessment is MOST appropriate when:",["Precise financial data is not available and judgment is needed","Exact probabilities are known","No judgment is needed","Only dollars matter"],0,"Qualitative methods use ratings and judgment."],[1,"Compared with low-risk areas, higher-risk areas should be audited:",["Less often","Never","More often","At the same rate"],2,"Audit frequency follows risk."],[1,"Results of a judgmental sample:",["Can be statistically projected to the population","Cannot be statistically projected because selection was not random","Are always invalid","Are always more accurate"],1,"Only statistical samples support projection."],[1,"During business process reengineering, the auditor should MOST focus on whether:",["Logos are updated","Controls are kept or replaced as the process changes","Staff are cut","Costs are hidden"],1,"Redesign can remove controls without anyone noticing."],[1,"Audit workpapers should be retained:",["Indefinitely by the auditee","Only until the report is issued","For a period set by policy and law, and kept confidential","Shared publicly"],2,"Retention follows policy and regulation."],[2,"Several IT projects are late and over budget. What should the board expect FIRST?",["Steering committee oversight with regular reporting on status and value","Detailed code reviews","More hardware","Fewer meetings"],0,"The board oversees through committees and reporting."],[2,"In COBIT, which group of objectives covers evaluating, directing and monitoring, that is governance?",["BAI","EDM","DSS","APO"],1,"EDM is Evaluate, Direct and Monitor; the others are management objectives."],[2,"An operational level agreement (OLA) is an agreement:",["Between internal teams that support delivery of a service","Between IT and a regulator","Between auditors","With a software vendor only"],0,"OLAs support SLAs inside the organization."],[2,"Which activity BEST supports continual improvement of an information security management system?",["Skipping audits","Fixed budgets","Periodic management review of performance and results","Longer passwords"],2,"Management review drives improvement."],[2,"Risk assessments should be repeated:",["Never","Only after incidents","Periodically and whenever significant change occurs","Every decade"],2,"Risk changes with the business and threats."],[2,"A risk has low likelihood but very high impact, such as a major fire. Which treatment is MOST suitable?",["Transfer part of it through insurance and prepare continuity plans","Accept it with no action","Ignore it","Increase its likelihood"],0,"Rare, severe events suit insurance plus continuity planning."],[2,"An asset is worth 100,000. An event would destroy 40% of it and is expected once every two years. What is the annual loss expectancy?",["40,000","80,000","100,000","20,000"],3,"SLE is 40,000. ARO is 0.5. ALE = 40,000 x 0.5 = 20,000."],[2,"A control costs 80,000 a year and reduces expected annual loss by 30,000. What should management conclude?",["The control is cost-justified","The control costs more than the loss it prevents, so reconsider the treatment","Always implement it","Double the control"],1,"Controls should be cost-effective relative to the risk reduction."],[2,"A vendor subcontracts part of its service without telling the customer. Which contract term would have BEST prevented this?",["A requirement for customer approval of subcontractors, with the same security obligations","A longer contract","A bigger logo","Free training"],0,"Flow-down and approval terms control fourth parties."],[2,"An SLA says the service will be 'fast and reliable.' What should the auditor recommend?",["Accept it","Cancel the SLA","Remove monitoring","Define measurable metrics and targets"],3,"SLAs need measurable, verifiable terms."],[2,"In a small team where duties cannot be separated, the BEST compensating control is:",["No control","More meetings","More management supervision and review of transactions","More desks"],2,"Review compensates for missing segregation."],[2,"A security policy has not been reviewed in years and no longer matches practice. What should the auditor recommend?",["Delete it","Ignore it","Let each user decide","Review and update it regularly, with senior management approval"],3,"Policies need periodic review and approval."],[2,"An information security steering committee should include:",["Only IT staff","Only auditors","Only vendors","Representatives from key business functions as well as IT"],3,"Security is a business issue, not only an IT one."],[2,"Which task belongs to the information security manager rather than the data owner?",["Deciding who may access business data","Classifying business data","Approving access requests","Developing the security strategy and monitoring compliance"],3,"Owners decide access and classification."],[2,"A key goal indicator (KGI) differs from a key performance indicator (KPI) because it:",["Shows whether the goal or outcome was achieved","Measures how well a process performs","Replaces all metrics","Measures cost only"],0,"KGIs measure results; KPIs measure how well the process is performing."],[2,"A business case was approved, but nobody measures benefits after go-live. This is a gap in:",["Data entry","Backups","Printing","Benefits realization"],3,"Benefits must be tracked after delivery."],[2,"The main governance benefit of an IT chargeback model is that it:",["Makes business units accountable for the IT services they consume","Hides IT costs","Reduces staff","Removes budgets"],0,"Chargeback links usage to cost."],[2,"Which situation BEST suggests IT is treated as a strategic partner?",["IT reports to a clerk","IT is not consulted on plans","The CIO sits on the executive committee","IT has no plan"],2,"Executive representation signals a strategic role."],[2,"An organization has no target enterprise architecture. The likely result is:",["Standardized systems","Siloed, inconsistent systems and higher cost","Lower risk","Faster integration"],1,"Architecture guides consistent design."],[2,"A cloud contract is governed by foreign law. What should the organization do?",["Sign without review","Ignore it","Ban all cloud use","Obtain legal review of jurisdiction, data protection and dispute terms"],3,"Legal review addresses jurisdiction risks."],[2,"Who should be informed of business continuity test results and gaps?",["Only the help desk","Only the vendor","Senior management and, where appropriate, the board","Nobody"],2,"Management owns continuity and must know the gaps."],[2,"An anonymous ethics hotline MAINLY helps by:",["Replacing audits","Reducing hardware","Speeding backups","Letting staff report suspected fraud or misconduct without fear"],3,"Reports from staff are a major way fraud is found."],[2,"Succession planning for key IT staff reduces:",["Cable length","Key-person dependency","Disk usage","Patch volume"],1,"It protects continuity of critical skills."],[2,"Training for IT staff should be planned from:",["Random selection","A training needs analysis based on roles and skill gaps","Vendor brochures","Seniority only"],1,"Training follows identified needs."],[3,"At which SDLC stage is it MOST cost-effective for the auditor to recommend control improvements?",["After go-live","During retirement","During design, before the system is built","After the first incident"],2,"Controls are cheapest to add early."],[3,"A requirements traceability matrix helps ensure that:",["Code is shorter","Staff are happier","Every requirement is carried through design and testing","Hardware is cheaper"],2,"It links requirements to design and test cases."],[3,"Program changes should be tested by:",["The same developer only","Someone independent of the developer, with user involvement","No one","The vendor's marketing team"],1,"Independent testing reduces bias."],[3,"Data conversion testing shows unexplained discrepancies a week before go-live. What should the project do?",["Investigate and resolve them, or formally accept the risk, before go-live","Go live anyway","Delete the old data","Skip reconciliation"],0,"Unexplained differences must be resolved or formally accepted."],[3,"User training before go-live MAINLY reduces the risk that:",["Users make errors or misuse the system","Hardware fails","Networks slow","Licenses expire"],0,"Untrained users cause errors."],[3,"The purpose of a rollback plan is to:",["Return to the previous state if the implementation fails","Speed up coding","Remove testing","Reduce users"],0,"Rollback limits the damage of a failed release."],[3,"Which test checks that a system performs acceptably under its expected user volume?",["Unit testing","Code review","Regression testing","Load testing"],3,"Load testing applies expected volume."],[3,"A check digit is MOST effective at detecting:",["Network failures","Malware","Transposition and keying errors in identifiers","Fraud by management"],2,"It validates identifiers such as account numbers."],[3,"Which control BEST ensures EDI transactions come only from authorized trading partners?",["Larger disks","Faster printers","Authentication of partners, with acknowledgments and audit trails","Fewer users"],2,"EDI relies on authenticated, logged exchanges."],[3,"Requirements are likely to change often during the project. Which approach copes BEST?",["Waterfall","Agile with short iterations and user feedback","Big bang","Parallel run"],1,"Agile accommodates change."],[3,"Which is MOST relevant when assessing a software vendor's long-term viability?",["Financial stability, references and support capability","Office decoration","Logo","Staff photos"],0,"Viability depends on stability and support."],[3,"Which combination BEST detects if records were dropped from a batch?",["Color coding","Record counts and hash totals","Longer passwords","Cable checks"],1,"Counts and totals confirm completeness."],[4,"Which database property ensures that a transaction is either fully completed or not applied at all?",["Isolation","Atomicity","Normalization","Replication"],1,"Atomicity means all or nothing."],[4,"Which tool describes the definitions, structure and relationships of data in a database?",["Data dictionary","Firewall","Backup log","Router table"],0,"The data dictionary holds metadata about the data."],[4,"Users with SQL tools can query database tables directly, bypassing the application. What is the BEST control?",["Allow it for convenience","Restrict direct access to those with a business need and log it","Remove logging","Share the database password"],1,"Direct access bypasses application controls, so limit and log it."],[4,"Privileged system utilities that can bypass normal access rules should be:",["Available to all users","Hidden from the menu only","Used without logging","Restricted to authorized staff and monitored"],3,"They are powerful and must be controlled and monitored."],[4,"The MAIN purpose of preventive hardware maintenance is to:",["Increase licenses","Reduce the likelihood of unplanned downtime","Hide faults","Raise the budget"],1,"Planned maintenance prevents failures."],[4,"An audit finds more software installations than licenses purchased. What is the main risk?",["Legal and financial penalties for non-compliance","Faster performance","Lower cost","Better security"],0,"License overuse breaches contracts and law."],[4,"In a star network topology, which failure has the GREATEST impact?",["One user's cable","One PC","One printer","The central hub or switch"],3,"A star depends on its central device."],[4,"Which service automatically assigns IP addresses to devices on a network?",["DNS","DHCP","SMTP","FTP"],1,"DHCP hands out addresses dynamically."],[4,"A protocol analyzer is MOST useful to:",["Encrypt files","Back up data","Capture and examine network packets for troubleshooting or analysis","Schedule jobs"],2,"It inspects traffic at packet level."],[4,"Which approach BEST detects unauthorized devices connected to the network?",["Longer cables","Larger switches","Annual surveys only","Regular network scans compared with the asset inventory"],3,"Comparing scans to the inventory exposes unknown devices."],[4,"Voice over IP (VoIP) introduces which risk that traditional phones largely do not?",["Paper jams","Power failure only","Slower typing","Eavesdropping and denial of service over the data network"],3,"VoIP shares the data network and its threats."],[4,"Hiding the wireless network name (SSID) is:",["A strong security control","Required by law","A replacement for encryption","Only a minor obstacle, not real security"],3,"The name is easy to discover; use strong authentication and encryption."],[4,"Computer operators should NOT have:",["Access to run jobs","Access to console messages","Access to modify application programs and source code","Access to the job schedule"],2,"Operators and programmers must be separated."],[4,"Console logs of operator activity should be:",["Reviewed regularly by an independent supervisor","Deleted daily","Never kept","Reviewed by the operators themselves"],0,"Independent review detects unauthorized actions."],[4,"Which control BEST protects backup media in a media library?",["Open shelves","No records","Shared keys","Inventory, labeling and controlled check-out"],3,"Track and control every item."],[4,"A service desk ticket cannot be resolved at first level. What should happen?",["Close it","Delete it","Ask the user to retry later","Escalate it through defined procedures to higher support"],3,"Escalation procedures keep incidents moving."],[4,"Incident priority should be based mainly on:",["The caller's seniority","Business impact and urgency","Alphabetical order","Time of day"],1,"Priority reflects impact and urgency."],[4,"A known error database helps the service desk by:",["Deleting tickets","Encrypting data","Recording known problems and workarounds for faster resolution","Scheduling backups"],2,"Known errors speed up repeat resolutions."],[4,"A configuration management database (CMDB) is used to:",["Record IT assets and their relationships","Store passwords","Encrypt mail","Print reports"],0,"The CMDB tracks configuration items and how they connect."],[4,"Each production change should have a back-out plan because it:",["Allows recovery to the previous state if the change fails","Speeds approval","Removes the need for testing","Lowers licensing cost"],0,"A back-out plan limits damage from a failed change."],[4,"Which body typically reviews and approves significant changes?",["Help desk","Vendor","Change advisory board (CAB)","End users alone"],2,"The CAB assesses risk and approves changes."],[4,"To confirm that ALL production changes were authorized, the auditor should start from:",["Change requests, then trace forward","A manager's statement","The system-generated list of changes found in production, then trace back to approvals","The vendor invoice"],2,"Starting from what actually changed tests completeness; starting from approvals only shows approved changes."],[4,"A business continuity plan should cover:",["Only IT systems","Only the data center","Only one department","All critical business processes, not just IT"],3,"Continuity is a business matter, not just an IT one."],[4,"Who should decide to activate the business continuity plan?",["Any employee","Designated management or the crisis team, as set out in the plan","The vendor","A customer"],1,"Activation authority is defined in advance."],[4,"Copies of the business continuity plan should be:",["Kept only in the data center","Kept by one person","Stored offsite and available to key personnel","Kept secret from staff"],2,"A plan locked in the affected site is useless."],[4,"The business impact analysis should involve:",["Business process owners","Only IT","Only auditors","Only vendors"],0,"Owners know the impact of downtime."],[4,"When choosing a recovery strategy, management should balance:",["Logo against color","The cost of downtime against the cost of the recovery option","Staff age","Printer cost"],1,"The right strategy balances loss from downtime against recovery cost."],[4,"In a disaster recovery plan, systems should be restored:",["Alphabetically","Smallest first","Newest first","In order of business criticality set by the BIA"],3,"Recovery order follows business priority."],[4,"Which replication method gives near-zero data loss but needs sites close enough to avoid latency?",["Synchronous replication","Weekly tape backup","Asynchronous batch","Monthly archive"],0,"Synchronous replication writes to both sites before confirming."],[4,"Remote journaling MAINLY improves recovery by:",["Deleting logs","Stopping backups","Encrypting passwords","Sending transaction logs to the recovery site frequently"],3,"Frequent log transfer reduces data loss."],[4,"The MOST important output of a business continuity test is:",["A thicker plan","Documented lessons learned and plan updates","A longer meeting","A new logo"],1,"Tests exist to find and fix gaps."],[4,"Insurance is:",["Part of risk treatment but not a replacement for continuity planning","A substitute for a continuity plan","Required for every risk","Useless"],0,"Insurance pays losses; it does not restore operations."],[4,"A hot site will not help if its equipment is:",["Incompatible with the production environment","Newer","Faster","Cleaner"],0,"Compatibility must be verified and tested."],[4,"A load balancer MAINLY improves:",["Password strength","Backup speed","Availability and performance by distributing traffic","Policy approval"],2,"It spreads load across servers."],[4,"Backup retention periods should be set according to:",["Legal, regulatory and business requirements","Disk color","Vendor preference","Random choice"],0,"Retention follows requirements."],[4,"The grandfather-father-son backup rotation:",["Deletes all backups","Keeps multiple generations of backups in a rotating cycle","Uses one tape forever","Is an encryption method"],1,"It rotates daily, weekly and monthly sets."],[4,"Before moving to a cloud provider, an exit strategy should address:",["Logo","Data portability and return or deletion of data at contract end","Office lease","Parking"],1,"Exit planning prevents lock-in and data loss."],[4,"Users report response times getting worse as user numbers grow. Which process should respond?",["Printing","Capacity management","Training","Furniture procurement"],1,"Capacity management plans for growth."],[4,"Automated monitoring with thresholds MAINLY helps operations by:",["Replacing staff","Eliminating backups","Alerting staff to problems before they become outages","Hiding errors"],2,"Early warning prevents outages."],[4,"A service with 99.9% availability allows roughly how much downtime in a year?",["About 8.8 hours","About 9 minutes","About 3.6 days","About 36 days"],0,"0.1% of 8,760 hours is about 8.8 hours."],[4,"Mean time between failures (MTBF) measures:",["Repair time","Backup size","Reliability, as the average time a system runs before failing","User count"],2,"MTBF is a reliability measure; MTTR is repair time."],[4,"Reviewing logs of failed login attempts is what type of control?",["Detective","Preventive","Corrective","Compensating"],0,"It finds events after they happen."],[4,"End-user spreadsheets that drive key decisions need:",["No control","Colors","Inventory, access control, version control and validation","Passwords on every cell only"],2,"End-user computing carries real risk."],[4,"Which control BEST ensures sensitive printed reports reach only authorized recipients?",["Controlled distribution with logs and sign-off","Leaving them on a table","Emailing to everyone","Printing in bold"],0,"Output distribution must be controlled and recorded."],[4,"Fault-tolerant systems differ from merely highly available systems because they:",["Need no maintenance","Cost less","Never use redundancy","Continue operating without interruption when a component fails"],3,"Fault tolerance means no interruption on failure."],[5,"A message is encrypted with the sender's private key. What does this provide?",["Confidentiality only","Availability","Faster delivery","Authentication of the sender, but not confidentiality"],3,"Anyone with the sender's public key can decrypt it."],[5,"Which method gives a message BOTH confidentiality and sender authentication?",["Encrypt with only the recipient's public key","Encrypt with only a shared password","Encrypt with the sender's private key, then with the recipient's public key","Send it unencrypted with a signature line"],2,"The private key authenticates; the recipient's public key protects confidentiality."],[5,"A digital envelope is:",["A paper form","A firewall rule","A symmetric session key that is itself encrypted with the recipient's public key","A backup tape"],2,"It combines fast symmetric encryption with secure key delivery."],[5,"Steganography is the technique of:",["Hiding data inside another file such as an image","Encrypting a hard drive","Blocking spam","Scanning ports"],0,"It conceals the very existence of a message."],[5,"A longer encryption key generally:",["Increases resistance to brute force attacks but needs more processing","Weakens security","Removes the need for key management","Has no effect"],0,"Longer keys are harder to break."],[5,"A supplier denies having sent a purchase order. Which control BEST prevents such denial?",["Longer file names","Larger mailboxes","Faster networks","Digital signatures backed by a PKI"],3,"Signatures provide non-repudiation."],[5,"In a firewall rule set, rules should be ordered so that:",["General allow rules come first","Specific rules come before general ones, ending with a default deny","Order does not matter","Deny rules are removed"],1,"Rules are processed in order, so order matters."],[5,"A weakness of simple packet-filtering firewalls is that they:",["Are too secure","Do not inspect packet contents and can be fooled by spoofed addresses","Inspect application data","Need no rules"],1,"They look only at headers."],[5,"A proxy server can help security by:",["Encrypting backups","Hiding internal addresses and filtering content on behalf of users","Replacing antivirus","Removing passwords"],1,"Proxies act as an intermediary."],[5,"Network address translation (NAT) helps security mainly by:",["Encrypting traffic","Blocking all malware","Hiding internal IP addresses from external networks","Removing the need for firewalls"],2,"NAT conceals the internal addressing scheme."],[5,"An inline IPS that is poorly tuned can:",["Never block anything","Block legitimate traffic through false positives","Improve all performance","Remove the need for logging"],1,"Inline prevention can disrupt normal traffic."],[5,"A host-based IDS is BEST suited to detect:",["Traffic across the whole network","Power failures","Printer faults","Changes and suspicious activity on a specific server"],3,"HIDS watches a single host."],[5,"An attacker sends packets with a forged source address to appear trusted. This is:",["Backup","Patching","Normalization","Spoofing"],3,"Spoofing falsifies identity or address."],[5,"Which control BEST reduces the risk of network sniffing capturing sensitive data?",["Encrypting the traffic","Longer cables","Bigger monitors","More switches"],0,"Encrypted data is useless to a sniffer."],[5,"A dictionary attack tries to:",["Overload a server","Guess passwords using lists of common words","Steal hardware","Copy a database file"],1,"Complex passwords and lockout counter it."],[5,"A botnet is:",["A backup network","A firewall type","A cloud service","A network of infected computers controlled remotely by an attacker"],3,"Botnets are used for attacks such as DoS and spam."],[5,"A keylogger is a threat because it:",["Deletes files","Slows the network","Overheats servers","Records what users type, including passwords"],3,"It captures credentials and other input."],[5,"A zero-day vulnerability is one that:",["Has been patched for years","Is exploited before the vendor has issued a fix","Is harmless","Only affects printers"],1,"No patch exists yet."],[5,"Privacy screens on laptops mainly reduce the risk of:",["Shoulder surfing","Malware","Power loss","SQL injection"],0,"They limit viewing angles."],[5,"Reviewing access control lists (ACLs) helps the auditor confirm that:",["Servers are fast","Backups are encrypted","Permissions match job needs and approvals","Fans work"],2,"ACLs define who can do what."],[5,"Access to a business application should be approved by:",["The data or system owner","Any colleague","The vendor","The help desk alone"],0,"Owners decide who needs access."],[5,"New network devices are found still using vendor default accounts. The BEST action is to:",["Leave them","Share them","Print them","Change or disable default credentials before use"],3,"Default credentials are publicly known."],[5,"Automatic session logoff after inactivity MAINLY reduces the risk of:",["Disk failure","Unauthorized use of an unattended session","Malware","Backups failing"],1,"Unattended sessions can be misused."],[5,"Dormant user accounts should be:",["Left active forever","Shared","Given more rights","Disabled after a defined period of inactivity"],3,"Unused accounts are an easy target."],[5,"Administrators should use separate accounts for administration and everyday work because it:",["Limits exposure of privileged rights and improves accountability","Saves licenses","Speeds up logins","Is required by every vendor"],0,"Daily use of a privileged account increases risk."],[5,"Kerberos is MAINLY used to:",["Encrypt backups","Scan for malware","Route packets","Provide ticket-based authentication, supporting single sign-on"],3,"Kerberos issues tickets after a single authentication."],[5,"A central directory service helps security by:",["Managing identities and authentication in one place","Replacing firewalls","Encrypting every file","Removing audits"],0,"Central management simplifies control and review."],[5,"For a web application, input validation should be enforced:",["Only in the browser","Nowhere","On the server side, because client-side checks can be bypassed","By the user"],2,"Never trust the client."],[5,"Encrypting sensitive columns in a database helps protect data from:",["Disk failure","Users or administrators who can read the tables but should not see the values","Network congestion","Power surges"],1,"Column encryption limits who can see sensitive values."],[5,"Data masking is used in test environments to:",["Slow testing","Delete data","Protect real personal data while keeping the data realistic","Increase storage"],2,"Masked data supports testing without exposing real data."],[5,"Labeling information as public, internal, confidential or restricted supports:",["Faster typing","Cheaper hardware","Fewer users","Applying controls that match each level of sensitivity"],3,"Classification drives protection."],[5,"A legal hold requires an organization to:",["Preserve relevant records even if the normal retention period has ended","Delete records early","Encrypt everything","Archive nothing"],0,"Legal holds override routine deletion."],[5,"A jailbroken or rooted mobile device is a risk because it:",["Runs faster","Bypasses built-in security controls","Uses less power","Is cheaper"],1,"Built-in protections are removed."],[5,"In cloud encryption, keeping the keys under the customer's control (bring your own key) helps:",["Remove all risk","Speed up access","Limit the provider's ability to read the data","Cancel audits"],2,"Customer-held keys reduce provider access."],[5,"Virtual machine sprawl is a risk because unmanaged VMs:",["May stay unpatched and unmonitored","Use no resources","Are always secure","Cannot be copied"],0,"Forgotten VMs become weak points."],[5,"In a data center, very low humidity mainly increases the risk of:",["Static electricity damaging equipment","Condensation","Flooding","Overheating only"],0,"Dry air raises static discharge; high humidity causes condensation."],[5,"Halon fire suppression has largely been replaced mainly because:",["It is too cheap","It harms the ozone layer","It is too slow","It is too quiet"],1,"Environmental rules phased it out."],[5,"CCTV in a facility mainly acts as a:",["Corrective control","Preventive firewall","Backup tool","Detective and deterrent control"],3,"Cameras discourage and record."],[5,"Which sequence reflects the usual phases of a penetration test?",["Reporting, attack, discovery, planning","Attack, planning, reporting, discovery","Discovery, reporting, planning, attack","Planning, discovery, attack, reporting"],3,"Plan and authorize first, report last."],[5,"A computer security incident response team (CSIRT) should include:",["Members from IT, security, legal, communications and management as needed","Only developers","Only auditors","Only vendors"],0,"Incidents need cross-functional response."],[5,"Incident classification and escalation criteria are defined so that:",["All incidents are ignored","Only IT sees incidents","Serious incidents reach the right decision makers quickly","Reports are shorter"],2,"Severity drives escalation."],[5,"For digital evidence to be admissible it should be:",["Edited for clarity","Relevant, authentic and with its integrity preserved","Copied by anyone","Stored on a personal phone"],1,"Courts need reliable, unaltered evidence."],[5,"Which is a useful key risk indicator for vulnerability management?",["The number of printers","Office temperature","Parking spaces","The number of critical vulnerabilities left unpatched past the target time"],3,"It shows exposure that is not being fixed in time."],[5,"Periodic review of the firewall rule base is important because:",["Rules never change","Firewalls fix themselves","Reviews slow the network","Rules become outdated, redundant or too permissive over time"],3,"Rule sets drift without review."],[5,"S/MIME is used to:",["Scan ports","Route traffic","Back up mailboxes","Sign and encrypt email messages"],3,"S/MIME gives email confidentiality and authentication."]]},"4":{"title":"Quiz 4: 150 best-answer questions","desc":"Exam-style questions where several options look reasonable and you choose the best one. Weighted like the real exam.","raw":[[1,"Management asks to postpone the audit of a critical application until after a system upgrade, citing resource constraints. What should the IS audit manager do FIRST?",["Assess the risk of postponing and obtain audit committee approval for any plan change","Agree to postpone the audit because management knows best which resources are available","Perform the audit on the current version so the schedule is kept and findings can be updated later","Swap it for a lower-risk application so the number of completed audits is unchanged"],0,"Plan changes should be risk-based and approved by those who approved the plan."],[1,"An IS auditor advised on the selection of a vendor system as a consultant 18 months ago and is now assigned to audit it. What is the BEST course of action?",["Proceed with the audit, since 18 months is a sufficient cooling-off period under audit standards","Disclose the prior involvement to audit management so independence can be assessed","Proceed but exclude the vendor selection process from scope to avoid reviewing earlier advice","Perform the audit and describe the earlier consulting work in the final report for transparency"],1,"Possible impairment must be disclosed before the work, so management can protect independence."],[1,"In a follow-up review, the auditor finds that management implemented a different control from the one recommended. What should the auditor do?",["Report the finding as not remediated because the specific recommendation was not implemented","Close the finding because management is responsible for choosing how to address risk","Evaluate whether the alternative control adequately mitigates the risk","Require management to replace the control with the one the audit report originally recommended"],2,"The objective is risk mitigation, not adopting the auditor's specific solution."],[1,"A population of purchase orders has a few very large orders and many small ones. Which sampling approach is MOST effective?",["Simple random sampling so every order has the same chance of being selected","Systematic sampling at a fixed interval to ensure an even spread through the list","Attribute sampling focused on the smallest orders, where controls are usually weakest","Stratified sampling that gives higher-value orders greater coverage"],3,"Stratifying lets the auditor concentrate on the items that matter most financially."],[1,"To support a monthly access review, the auditee provides screenshots showing completed approvals. What should the auditor do?",["Accept the screenshots because they originate from the production system","Obtain a written representation from the reviewer that the approvals were completed","Obtain system-generated evidence or observe the review directly","Reduce further testing because the auditee has proactively provided supporting evidence"],2,"Evidence supplied by the auditee needs corroboration for authenticity and completeness."],[1,"Which factor MOST increases the inherent risk of a financial application?",["High transaction volumes, complex calculations and frequent manual intervention","A stable development team with low staff turnover over several years","An automated reconciliation to the general ledger performed at each period end","Comprehensive user documentation that is reviewed and updated annually"],0,"Volume, complexity and manual intervention raise the likelihood of error before any controls."],[1,"Management's response to a high-risk finding says it 'will be addressed in due course', with no owner or date. What should the auditor do?",["Accept the response and treat the finding as addressed since management has replied","Lower the risk rating to reflect management's commitment to take action","Request a specific action plan with an owner and target date","Remove the finding from the report and track it informally until the next audit cycle"],2,"Responses must be specific and time-bound to be actionable."],[1,"A control gap is partly offset by an effective compensating control. How should the auditor report it?",["Report the gap, recognize the compensating control and rate the finding accordingly","Omit the finding from the report because the compensating control covers the risk","Report it as high risk because the primary control is missing regardless of other controls","Raise it verbally with management and exclude it from the written report to reduce noise"],0,"The report should reflect the real residual risk."],[1,"To confirm that recorded transactions are supported by valid source documents, which approach should the auditor use?",["Select source documents and trace them forward to confirm they were recorded","Select items from the accounting records and trace them back to source documents","Compare account balances with the prior period to identify unusual movements","Interview the accountant about how transactions are supported and approved"],1,"Starting from the records tests validity; starting from source documents tests completeness."],[1,"A CAAT extract of the general ledger will be used for testing. What should the auditor do FIRST?",["Run the planned analytics straight away since the extract was generated by IT","Ask the database administrator to confirm in writing that the extract is accurate","Reconcile the extract's record count and control totals to the source system","Test a small number of records in detail to see whether the extract looks reasonable"],2,"Completeness and integrity of the data come before any analysis."],[1,"An unplanned regulatory request needs audit resources midyear. What should the head of audit do?",["Decline the request in order to protect the audit plan approved by the committee","Cancel the lowest-rated audits and use their resources for the regulatory request","Delay the regulatory work until it can be included in the next annual plan","Reassess priorities using the risk assessment and inform the audit committee"],3,"The plan is dynamic, but changes should be risk-based and transparent."],[1,"An employee alleges that an IT manager has committed fraud. What should the auditor do FIRST?",["Follow the fraud response procedure and preserve the evidence","Interview the IT manager to hear their explanation before taking further steps","Review the manager's email privately to confirm the allegation is credible","Inform the manager's supervisor so that management can deal with the issue"],0,"Fraud is handled through defined procedures. Do not alert or confront the suspect."],[1,"Which is the BEST indicator of a strong control environment?",["A comprehensive set of documented policies approved by senior management","Few audit findings reported in the most recent audit cycle","Management consistently enforces policies and acts on audit findings","A security budget that is above the industry average"],2,"Tone at the top shows in enforcement and follow-through."],[1,"Why is a risk-based audit approach preferable to a fixed cyclical approach?",["It reduces the number of auditors required because fewer areas are reviewed","It ensures every auditable area is covered on a regular annual cycle","It removes the need for a formal risk assessment by relying on auditor judgment","It directs resources to the highest-risk areas and adapts as risks change"],3,"Risk-based planning focuses effort where it adds most value."],[1,"The auditor cannot exercise a right to audit at a critical service provider. What is the BEST alternative?",["Accept the provider's own written assurance that its controls are effective","Rely on an independent assurance report after assessing scope, period and exceptions","Rely on the provider's marketing statements about its security certifications","Exclude the provider from scope and document the limitation in the audit plan"],1,"Independent reports can substitute if their coverage fits the risk."],[1,"Data analytics shows some vendor bank accounts match employee bank accounts. What should the auditor do?",["Investigate the matches and report potential conflicts through the proper channel","Assume a data error and ask the vendor master team to cleanse the records","Ask the employees concerned to explain the matches before any escalation","Suppress the exceptions because some overlap occurs for legitimate reasons"],0,"Investigate through proper channels. Do not dismiss or confront."],[1,"The auditor finds non-compliance with a regulation, but management says the regulator has never enforced it. What should the auditor do?",["Omit the issue because the likelihood of enforcement action is low","Report the non-compliance and the potential legal and reputational exposure","Ask the regulator informally whether it intends to enforce the requirement","Classify the issue as informational since there has been no penalty to date"],1,"Compliance risk exists regardless of past enforcement."],[1,"After the report is issued, the auditor learns of facts that existed during the audit and would have changed the conclusion. What should the auditor do?",["Wait for the next audit to address the matter in the normal course","Inform the auditee only, since the report has already been distributed","Take no action because the report is final and has been formally accepted","Assess the effect and communicate with management and the audit committee"],3,"Material facts discovered later must be evaluated and communicated."],[1,"Which input is MOST important when developing a risk-based audit plan?",["The prior year's audit plan adjusted for staff availability","The audit coverage requested by the auditees' management","The organization's objectives and a current risk assessment","The results of the external auditor's most recent report"],2,"Priorities follow business objectives and risk."],[1,"General IT controls are tested and found effective. How does this affect testing of automated application controls?",["Fewer instances may be tested because automated controls operate consistently","No testing is needed because automated controls cannot fail once implemented","More instances must be tested because automation can hide systematic errors","Only the manual controls around the application need to be tested"],0,"Effective general controls support reliance on automated controls with a reduced sample."],[1,"Which approach is BEST to find segregation of duties conflicts in an ERP system?",["Interview a sample of users about the duties they perform","Review job descriptions for conflicting responsibilities","Review the ERP vendor's security guide for recommended role designs","Compare users' access rights with a role conflict matrix using analytics"],3,"Comparing actual access to a conflict matrix is objective and complete."],[1,"An audit report contains details of security weaknesses. What is the BEST way to distribute it?",["Post it on the intranet so all staff can see how issues are being addressed","Restrict it to those who need it and limit exploitable technical detail","Send it to all IT staff so that they can help remediate the weaknesses","Distribute the full report to all department heads so each can learn from the issues"],1,"Sensitive findings need need-to-know distribution."],[1,"The auditor wants to confirm that a control operated throughout the year. Which approach is BEST?",["Test occurrences spread across the whole period","Test only year-end occurrences, which are the most recent evidence","Test the most recent month and extrapolate to the full year","Rely on management's assertion that the control operated all year"],0,"Sampling across the period supports a conclusion about the period."],[1,"A management representation letter is MAINLY used to:",["Replace the need for substantive testing of the balances covered","Document management's assertions and responsibilities, supplementing other evidence","Transfer responsibility for the audit conclusion from the auditor to management","Satisfy the sample size requirement for the controls covered"],1,"It supplements other evidence and never replaces it."],[1,"When should an IS auditor report suspected illegal acts to authorities outside the organization?",["Immediately in every case, since the auditor has a duty to the public","Never, because audit confidentiality always overrides reporting duties","Only after the external auditor has agreed that the act is illegal","Only when required by law, otherwise to the audit committee and senior management"],3,"Confidentiality applies unless the law requires disclosure."],[1,"A reviewer finds that staff workpapers are not signed off or reviewed. What is the main concern?",["Staff may be unable to locate the workpapers during later audits","Lack of supervision undermines audit quality and support for conclusions","The audit file may not meet the formatting standard of the audit methodology","The auditee may challenge findings that are not supported by signed documents"],1,"Supervisory review is a core quality control."],[1,"For a random sample, the auditor should:",["Choose items that appear unusual or risky based on experience","Take the first items in the list to avoid selection delays","Give every item in the population an equal chance of selection","Let the auditee select items to ensure they are representative"],2,"Random selection avoids bias."],[2,"How should IT risk be BEST managed within the enterprise?",["Integrated with enterprise risk management so IT risks are prioritized with business risks","Managed within IT using its own separate risk register, rating scale and escalation path","Reviewed once a year by internal audit and reported to the audit committee","Transferred through cyber insurance so that the residual exposure is kept to a minimum level"],0,"Integration enables consistent prioritization across the organization."],[2,"Senior management accepts a significant residual risk verbally. What should the auditor recommend?",["Accept the verbal decision, since senior management owns the risk","Formally document the acceptance at the appropriate level, within risk appetite","Remove the risk from the register because management has accepted it","Escalate the matter to the regulator because the risk is significant"],1,"Risk acceptance must be documented, authorized and within appetite."],[2,"Minutes of the IT steering committee show decisions that are never followed up. What is the BEST recommendation?",["Maintain an action log with owners and deadlines reviewed at each meeting","Reduce the number of meetings so that decisions are made less often","Delegate decisions to the IT manager so they can be implemented faster","Replace the committee with an emailed monthly status report"],0,"Follow-up discipline turns decisions into results."],[2,"Which is the BEST way for management to ensure the quality of outsourced services over time?",["Monitor independently verified SLA metrics and hold regular governance reviews","Rely on the provider's monthly self-reported service results, supported by an annual management certificate","Review the contract in full only when it comes up for renewal, adjusting terms as needed","Pay invoices only after a user satisfaction survey is completed"],0,"Independent verification plus regular governance keeps oversight effective."],[2,"Before ending an outsourcing contract, management should MOST ensure that:",["An exit plan covering data return, knowledge transfer and continuity of service","The provider confirms it will delete all organizational data immediately","Notice is issued at the last permitted date to keep the contract price","Provider staff are transferred to the organization as part of the termination"],0,"Exit planning prevents disruption and data loss."],[2,"Which BEST supports approval of a major new technology investment?",["A business case showing costs, benefits and risks aligned to strategy","A vendor demonstration of the technology's features and capabilities","A strong recommendation from the CIO supported by the IT team","Evidence that competitors have adopted the same technology"],0,"Investments are justified through a business case."],[2,"A key aim of IT governance is to ensure that IT:",["Operates at the lowest possible cost across all services","Is run independently of business management to avoid bias","Delivers value, manages risk and supports business objectives","Adopts the most advanced technology available in the market"],2,"Governance balances value, risk and resources."],[2,"An organization achieves ISO/IEC 27001 certification. What does this indicate?",["All security controls were tested and found to be operating effectively throughout the certification year","The organization has been independently verified as protected against all known cyber threats","Regulators have reviewed the certification evidence and approved its security controls","Its security management system meets the standard, not that all risks are eliminated"],3,"Certification covers the management system, not guarantees."],[2,"A business unit buys a SaaS tool without IT involvement. Which governance response is BEST?",["Ban SaaS applications unless purchased by IT","Allow each business unit to accept the risks of its own purchases","Ask IT to take over support for the tool after it has been bought","Establish a central approval and assessment process for technology purchases"],3,"A process addresses shadow IT without blocking the business."],[2,"Which BEST shows that IT performance measurement is effective?",["A large number of metrics are collected and published monthly","System uptime is reported and reviewed against targets each month","IT cost per user is benchmarked against similar organizations","Metrics are linked to business goals and reviewed by management"],3,"Metrics matter when tied to objectives and acted on."],[2,"In a balanced scorecard, the learning and growth perspective addresses:",["Revenue growth and profitability targets","Staff skills, culture and capability","Customer satisfaction and retention","Process efficiency and cycle times"],1,"It looks at the capabilities needed for the future."],[2,"High turnover in critical IT roles creates key-person dependency. Which is the BEST mitigation?",["Closer monitoring of staff activity in the affected roles","Documentation, cross-training and retention planning","An additional approval layer for changes made by the remaining staff","A larger internal audit team to review IT operations more often"],1,"Reduce reliance on individuals."],[2,"Contractors will receive privileged access. Which combination BEST limits risk?",["A shared administrator account protected by a strong password that is rotated each quarter","Screening, confidentiality agreements and time-limited, monitored least-privilege access","Permanent access that is reviewed by the contract manager once a year","A verbal agreement of confidentiality supported by the vendor's reputation"],1,"Layered controls fit privileged external access."],[2,"IT operations staff both implement changes and approve them. What should the auditor recommend?",["Increase the post-implementation review of changes made by operations","Add more staff to operations so changes are completed faster","Accept the practice because the staff involved are experienced","Separate the approval of changes from their implementation"],3,"Segregation of duties is the preventive control."],[2,"Which BEST demonstrates strategic alignment of IT?",["A long list of approved IT projects with assigned budgets and named project managers","An IT budget that is below the industry average for the sector","High system availability and user satisfaction reported against agreed service levels","A mapping of IT initiatives to business objectives that is regularly reviewed"],3,"Alignment is shown by traceability to business objectives."],[2,"A maturity assessment shows level 2 against a target of level 4. What should management do NEXT?",["Lower the target to level 2 to reflect the current capability","Develop a roadmap prioritized by risk and value","Report the target as achieved based on the planned initiatives","Defer action until the next maturity assessment is performed"],1,"Gaps need a prioritized plan."],[2,"A procedure conflicts with the approved policy. What should happen?",["The policy prevails and the procedure should be corrected","The procedure prevails because it is more specific to the activity","Both documents are suspended until audit has completed a review","The policy is rewritten to match the practice described in the procedure"],0,"Procedures implement policy, not the other way round."],[2,"Management accepted an audit recommendation but says there is no budget. What is the BEST step?",["Close the finding because management has agreed with the recommendation","Ask the audit function to fund the remediation from its own budget","Permanently downgrade the finding because funding is not available","Escalate to senior management for a funding or risk acceptance decision"],3,"Funding versus risk acceptance is management's decision."],[2,"A compliance monitoring function should:",["Report to the head of the area it monitors for efficiency","Be staffed by operations employees on rotation to share knowledge","Be independent of the operations it monitors","Be outsourced to the vendor that operates the monitored systems"],2,"Independence is essential for credible monitoring."],[2,"Which role is BEST suited to oversee privacy compliance?",["The IT help desk manager, who handles access requests and data issues","The head of application development, who knows how data is processed","A marketing manager, who understands how customer data is used","A privacy officer with independence and access to senior management"],3,"The role needs independence and authority."],[2,"How should vendors be assessed for risk?",["Apply the same detailed assessment to every vendor each year to ensure consistent treatment","Tier vendors by criticality and data sensitivity, with deeper assessment for higher tiers","Assess only the vendors with the largest annual spend, since they are assumed to carry most risk","Assess vendors reactively, after an incident or complaint has shown that a problem exists"],1,"Risk-based tiering focuses effort."],[2,"A vendor relies on subcontractors (fourth parties). What should the customer do?",["Require visibility, flow-down of obligations and approval of critical subcontractors","Assume the vendor manages its subcontractors adequately under the existing contract terms","Prohibit subcontracting entirely in all circumstances to remove fourth-party risk","Audit every subcontractor each year regardless of the service provided"],0,"Control fourth-party risk through contract and oversight."],[2,"Reports to the board on IT risk are MOST useful when they:",["Summarize key risks, trends and decisions needed against risk appetite","Include detailed technical logs so the board can verify the facts","List every incident in chronological order with full technical details","Focus on project status and budget variances only"],0,"Boards need concise, decision-oriented information."],[2,"Too many projects compete for limited resources. What is the BEST governance response?",["Start all projects and allow teams to compete for resources","Fund projects in the order in which they were requested","Prioritize the portfolio by value, risk and resource capacity","Cancel projects at random until demand fits capacity"],2,"Portfolio management allocates scarce resources."],[2,"After a major IT investment, what BEST confirms it was worthwhile?",["A staff satisfaction survey about the new solution","A post-investment review comparing results with the business case","Formal closure of the project budget with no overspend","A performance report supplied by the vendor"],1,"Outcomes are compared with expected benefits."],[2,"Which policy area MOST directly addresses staff sharing confidential data on personal messaging apps?",["The backup policy, which defines where data copies are stored","The change management policy, which controls how modifications to systems are approved","An acceptable use and information handling policy with training and enforcement","The patch management policy, which governs how updates are applied to devices and servers"],2,"It sets the rules for handling information."],[2,"Which BEST reduces the risk that IT staff bypass security controls under delivery pressure?",["Clear accountability, management support and measurement of compliance","Longer project deadlines applied to all projects","More detailed technical standards for developers","Penalties for staff who report that deadlines are unrealistic"],0,"Culture and accountability make controls stick."],[3,"A project reaches the design phase with incomplete requirements. What should the auditor recommend?",["Continue the design and clarify the missing requirements during testing","Complete the requirements and obtain user sign-off before proceeding","Allow the developers to decide on the missing requirements","Proceed and rely on formal change requests to fill the gaps later"],1,"Weak requirements cause rework and failure."],[3,"Which BEST ensures a developed system processes transactions as intended?",["Comprehensive testing with user participation and documented results","A developer's written assurance that unit testing was completed successfully","A review of the vendor's technical documentation and design specifications","A code walkthrough led by the project manager and senior developers"],0,"Testing with users, with evidence, is the proof."],[3,"Developers test their own code with no independent review. What is the BEST recommendation?",["Increase the time developers spend on testing their own code","Require peer comments in the code before it is tested","Introduce independent quality assurance testing","Perform testing only after the release has gone live"],2,"Independence reduces blind spots."],[3,"Reconciliation after data migration shows exceptions. What is the BEST response?",["Accept the migration if the large majority of records match and the variances are immaterial","Investigate root causes, correct the data and repeat the reconciliation","Delete the exception records after logging them so that the totals agree","Fix exceptions after go-live as users report them through the help desk"],1,"Resolve exceptions before acceptance."],[3,"An external developer delivers custom code. Which BEST reduces the risk of malicious code?",["Reliance on the developer's reputation, references and prior delivery record","Limiting the developer's access to production data and production credentials","Acceptance of the code once it compiles and passes the developer's own test cases","Code review or security testing combined with contractual security requirements"],3,"Verify rather than just trust."],[3,"A vendor releases an update to packaged software. Before production, the organization should:",["Apply it immediately because it comes from a trusted vendor and fixes known problems","Wait until other customers have reported problems before deciding to apply it","Test it in a non-production environment and approve it through change management","Apply it to a pilot group of production users first and monitor for incidents"],2,"Updates are changes and need testing and approval."],[3,"Project scope grows but schedule and budget stay the same. Which control is MOST lacking?",["More frequent project status meetings with the steering committee","Formal change control with impact assessment and approval","Additional testers to cover the extra scope","A more detailed project risk register updated weekly"],1,"Scope changes need approval and impact review."],[3,"In agile development, who prioritizes the backlog based on business value?",["The scrum master","The lead developer","The product owner","The project auditor"],2,"The product owner represents the business."],[3,"A post-implementation review finds that benefits were never measured. What is the BEST recommendation?",["Define benefit measures and owners and track results against the business case","Stop performing post-implementation reviews because project closure already confirms delivery","Estimate benefits using the project's actual cost as the benchmark for value","Rely on user satisfaction surveys as the main measure of benefits realized"],0,"Benefits need owners and measures."],[3,"In a CI/CD pipeline, which control BEST maintains change integrity?",["Developers deploy directly after local testing to speed delivery","Manual deployment by the most senior developer","Automated testing, required approvals and deployment logging","A monthly review of the deployment tool's licensing"],2,"Automate the controls and keep evidence."],[3,"Two systems exchange data through an interface. Which control BEST ensures data is not lost or altered?",["Visual inspection of sample screens in both systems","Encryption of the interface connection","A daily call between the two system owners","Reconcile record counts and control totals between the systems"],3,"Interfaces need reconciliation."],[3,"When should audit trail requirements be defined?",["After go-live, when auditors or regulators request them","During testing, once the system functions are stable enough to review","When the first incident of fraud is discovered and logs are needed","During requirements and design, so the system records who did what"],3,"Build controls in early."],[3,"When should role definitions for user access be established?",["After go-live, based on access requests submitted by users and their managers","In the requirements phase, based on business functions and segregation of duties","By the vendor during installation using the default roles shipped with the product","During the post-implementation review once real usage patterns are known"],1,"Access design starts early."],[3,"A big bang cutover is planned, and the rollback has never been tested. What should the auditor recommend?",["Document the rollback steps and test them after go-live","Switch to a parallel run without any further testing","Accept the risk because rollback is rarely needed","Test the rollback procedure before go-live"],3,"An untested rollback is not a control."],[3,"Lack of system documentation MOST increases the risk of:",["Slower adoption of the system by end users after go-live","Difficulty maintaining the system, with key-person dependency","Higher licensing costs over the system's expected lifetime","Reduced useful life of the underlying hardware platform"],1,"Documentation supports maintenance and continuity."],[3,"Before adopting a SaaS application, which review is MOST relevant?",["A comparison of the application's user interface with alternatives","A review of the vendor's marketing materials and case studies","A price comparison across vendors","A security and compliance assessment including independent assurance reports"],3,"Security and compliance come first."],[3,"After applying a patch to an application, which testing is MOST important?",["Stress testing of the production environment under peak load","Unit testing of the patched component by the developer only","Regression testing to confirm existing functions still work","Penetration testing of the application by an external specialist"],2,"Check that nothing else broke."],[3,"Who should sign off that a system meets business requirements before go-live?",["The lead programmer after final unit testing","The database administrator after data validation","The internal auditor after reviewing the test plan","The business process owner after user acceptance testing"],3,"The business accepts the system."],[4,"The BIA sets an RTO of 2 hours for the order system, but tests show recovery takes 6 hours. What should the auditor recommend?",["That the RTO be changed to match the recovery time that was actually achieved in testing","That management evaluate the gap and improve recovery or formally revise the objective","That more frequent tabletop exercises be performed to improve the team's readiness for recovery","That the recovery test be repeated until the 2-hour target is eventually met"],1,"A gap is a management decision, not something to adjust silently."],[4,"Which DR test gives good assurance without disrupting production?",["A desk check of the plan by the continuity team","A parallel test at the recovery site","A full interruption test of production systems","A walkthrough of the plan with key staff"],1,"Parallel tests run recovery alongside production."],[4,"Backup tapes are stored at an executive's home. What is the GREATEST concern?",["The cost of regularly transporting the tapes between the data center and the executive's home","The distance between the executive's home and the main data center in a regional disaster","The labeling and rotation scheme used for the tapes stored at the residence","Security, environmental protection and availability of the backups when needed"],3,"Offsite storage must be secure and accessible."],[4,"After the business impact analysis is complete, what is the NEXT step in continuity planning?",["Conduct a full interruption test of the recovery site","Develop recovery strategies and plans","Train all staff in recovery procedures","Contract with a recovery site vendor"],1,"Strategies follow the BIA and come before detailed plans and tests."],[4,"A business continuity plan should be updated when:",["Every ten years as part of the organization's long-term strategic planning cycle","Only after a real disaster has exposed weaknesses in the existing plan","Significant changes occur in the business or systems, and after tests","When the external auditor requests it as part of the annual audit"],2,"Plans must remain current."],[4,"Which factor MOST influences the effectiveness of a business continuity plan?",["The detail and length of the plan documentation","The recovery software selected for the plan","The number of staff assigned to the recovery team","Senior management commitment and ownership"],3,"Commitment ensures resources, testing and priority."],[4,"During a disaster, how can staff be notified quickly?",["A maintained call tree or automated notification system","A company-wide memo distributed to staff at the start of each year","An announcement posted on the company intranet by the communications team","Staff checking their work email from home during the disaster"],0,"Notification must work when normal systems are down."],[4,"The DR plan relies on a cloud provider. What should the auditor verify?",["That the provider is a large, well-known organization with a good market reputation","That the provider's recovery commitments meet the RTO and RPO and have been tested","That the contract price is competitive with alternative recovery solutions","That the provider holds a general quality certification covering its data centers"],1,"Commitments must match requirements."],[4,"What is the BEST evidence that backups are reliable?",["Backup job completion logs for the past quarter","A tape inventory showing all media accounted for","A vendor statement about the backup tool's reliability","Records of periodic successful restore tests"],3,"A backup is proven by restoring it."],[4,"Backup job failures are logged but nobody follows up. What is the main concern?",["Log files will grow too large to review effectively","Operators may not understand the format of the logs","Data may be unrecoverable and the RPO may not be met","Tape replacement costs may increase over time"],2,"Failures leave data unprotected."],[4,"An urgent change must go live tonight before the change board meets. Which is the BEST compensating control?",["Approval by the developer who built the change, with documentation completed after the next quarterly review","Deployment under the system administrator's authority with an email to the change board afterwards","Emergency approval by a designated authority with a post-implementation review","Postponing the change until the next scheduled meeting of the change board"],2,"Emergency changes still need authorization and review."],[4,"A release went to production with no test evidence. What should the auditor recommend?",["Increase the frequency of releases so that problems are found sooner","Rely on post-release user feedback to confirm the release works","Require documented test results and approval before any release","Allow developers to certify their own releases when under time pressure"],2,"Evidence of testing is a release gate."],[4,"Which information is MOST important when logging an incident?",["Impact, classification, affected service and actions taken","The name of the user's manager and department","The purchase date and warranty status of the affected server","The contact details of the vendor's account manager"],0,"That information supports prioritization and resolution."],[4,"Which indicator BEST shows problem management is effective?",["A decline in repeat incidents with the same root cause","An increase in the number of tickets closed each month","A shorter average handling time for incidents","A larger library of documented workarounds"],0,"Fixing root causes reduces repeats."],[4,"Capacity forecasting is MOST effective when it uses:",["The most recent month's peak usage","Sizing guidance provided by the hardware vendor","Historical trends combined with planned business growth","User complaints about slow performance"],2,"Trends plus business plans give the best forecast."],[4,"An SLA includes a penalty clause. What does this primarily provide?",["A guarantee that service failures will not occur","An incentive for the provider to meet agreed service levels","A substitute for independent monitoring of service levels","Relief from the provider's accountability for outages"],1,"A penalty is an incentive, not a guarantee."],[4,"A database server crashes midway through a transaction. Which feature restores a consistent state?",["Encryption of data files on the database server","Transaction logging with rollback and commit","Referential integrity constraints between related tables","Regular index rebuilds to maintain performance"],1,"Logs and rollback keep transactions all-or-nothing."],[4,"Which control BEST detects unauthorized direct changes to sensitive database tables?",["Stronger password requirements for application users","Approval screens within the application for sensitive changes","Database activity monitoring or audit logging reviewed independently","Regular database backups with offsite storage"],2,"Direct changes bypass application controls."],[4,"In a data warehouse load, which control BEST ensures completeness?",["Reconcile record counts and totals between source and target after each load","Visual review of a sample of loaded records by the data owner","Faster load processing to reduce the risk of time-outs during the load window","Encryption of the staging area before data is loaded into the warehouse"],0,"Reconciliation shows completeness."],[4,"The data center has a single network path to the internet. What is the BEST recommendation?",["Increase the bandwidth of the existing link","Add redundant links and devices","Add monitoring and alerting on the single link","Install an additional firewall on the same link"],1,"Remove the single point of failure."],[4,"Guest wireless users should be:",["Given the same access as employees for convenience","Placed on the internal network with limited privileges","Required to use the employee wireless password","Placed on a separate segment with no access to internal systems"],3,"Untrusted users must be segregated."],[4,"Which control BEST secures remote access for employees?",["A shared VPN password changed monthly","A remote desktop port opened to the internet with strong passwords","VPN with multi-factor authentication","Web access to email from personal devices only"],2,"Encrypted tunnel plus strong authentication."],[4,"Network monitoring is MOST useful when it establishes:",["A list of all users and devices connected to the network each day","A monthly report of bandwidth costs by department and location","A record of every packet captured and kept indefinitely for later analysis","A baseline so abnormal traffic or degradation can be detected"],3,"Baselines make anomalies visible."],[4,"Which hardware disposal practice is BEST?",["Verified data sanitization with certificates of destruction","Deleting all files before the hardware is disposed of","Reformatting the disks before donating them","Selling the hardware as is to a reputable recycler"],0,"Deleting or reformatting leaves recoverable data."],[4,"How can the accuracy of an IT asset inventory BEST be verified?",["Email confirmation from asset owners","Review of purchase orders for the period","Physical verification compared with inventory records","Comparison with the previous year's inventory"],2,"Physical checks confirm existence."],[4,"Automating job scheduling mainly reduces the risk of:",["Hardware failure of the batch processing servers during peak processing periods","Unauthorized external access to the network from remote locations","Errors from manual intervention and inconsistent job execution","Breaches of software licensing terms by batch processing tools"],2,"Automation reduces manual errors."],[4,"Which review BEST detects unauthorized batch jobs?",["Reviewing user access rights to the scheduling tool","Comparing job execution logs with the approved schedule","Reviewing operator training records","Reading the operations procedures manual"],1,"Actual versus approved reveals deviations."],[4,"Virtual machine images and snapshots should be:",["Kept indefinitely to give the business flexibility","Controlled, protected and removed when no longer needed","Stored on any available server with spare capacity","Shared freely among administrators to speed up deployment"],1,"They can contain sensitive data and stale systems."],[4,"In a platform-as-a-service model, the customer is MOSTLY responsible for:",["The physical servers and storage","Its applications and data","The hypervisor and virtualization layer","The underlying network infrastructure"],1,"The provider manages the platform."],[4,"Cloud data residency concerns MOST directly relate to:",["System response times for users in different regions","Hardware costs in the provider's data centers","The frequency of the provider's backups","Compliance with laws on where data may be stored and accessed"],3,"Location determines which laws apply."],[4,"A SaaS provider fails. Which contract provision would help MOST?",["A longer initial contract term","Free user training for the replacement service","Data export and transition assistance rights","A high uptime guarantee with service credits"],2,"You need to retrieve your data and move."],[4,"To limit the impact of an availability zone outage, a cloud application should:",["Be deployed across multiple zones with automatic failover","Be deployed in a single, larger zone with more capacity","Rely on nightly backups to restore service after an outage","Rely on manual recovery procedures by the operations team"],0,"Zone redundancy keeps service running."],[4,"Software license audits MAINLY help the organization:",["Increase system performance by removing unused software","Improve user training on licensed products","Avoid legal and financial penalties by ensuring compliance","Reduce hardware spending by consolidating servers"],2,"They confirm compliance with license terms."],[4,"End-of-life hardware in production is a concern mainly because:",["It consumes more power and generates more heat than modern hardware","Spare parts and support may be unavailable, raising outage risk","It is harder to document accurately in the asset register","It cannot be backed up using the organization's current backup tools"],1,"Without support, outages last longer."],[4,"A knowledge base at the service desk helps:",["Resolve common issues faster and more consistently","Reduce the need to log incidents","Replace the need for root cause analysis","Eliminate repeat incidents"],0,"It supports consistent first-line resolution."],[4,"Log retention for operations should b

e based on:",["Available disk space on the log server","The internal auditor's preference","The default setting provided by the vendor","Business, legal and investigation needs"],3,"Needs, not convenience, drive retention."],[4,"A telecom provider outage isolates a site. What is the BEST mitigation?",["A secondary connection through a different provider and physical route","A second line from the same provider, installed through the same duct as the primary line","More bandwidth and a higher service tier on the primary connection","A service credit clause in the telecom contract for outages exceeding four hours"],0,"Diverse providers and routes remove the common failure."],[4,"Which BEST indicates the change management process is working?",["Few changes are requested by the business","Few unauthorized changes and low failed-change rates","A high proportion of changes are implemented as emergencies","All requested changes are approved by the board"],1,"Quality outcomes show the process works."],[4,"Which metric BEST gives early warning of an impending storage outage?",["Storage utilization trends against thresholds","The number of backup jobs run each night","The volume of help desk tickets","The number of user logins per day"],0,"Trend against threshold gives lead time."],[5,"A digital certificate binds:",["A public key to the identity of its owner","A password to a specific user account","A hash value to a particular file","A session key to a network address"],0,"A certificate authority signs the binding of a public key and an identity."],[5,"Which gives the strongest assurance of both message integrity and origin?",["A digital signature over a hash of the message","A checksum appended to the message","Encryption of the message with a shared secret key","A password-protected archive file"],0,"Hash plus a private key signature shows integrity and origin."],[5,"An organization encrypts laptop disks. Which key management issue is MOST critical?",["Recovery of keys when users forget credentials or leave","Using the longest key length the software allows","Storing the keys on each laptop for convenience","Changing keys weekly regardless of risk"],0,"Without key recovery, the data is lost."],[5,"Which architecture BEST protects the internal network while hosting a public web server?",["Place the server on the internal network behind a single firewall with restrictive inbound rules","Place the server outside the firewall with hardened settings and regular patching","Place the server in a DMZ separated from the internal network by firewall rules","Use a single flat network with strong server passwords and host-based firewalls"],2,"A DMZ limits exposure of the internal network."],[5,"Which BEST helps an IDS detect relevant threats?",["Installation with default settings and annual review","Disabling low-priority alerts to reduce noise","Regular tuning and signature updates suited to the environment","Placing sensors only outside the firewall"],2,"Tuning and updates keep detection relevant."],[5,"Which approach BEST addresses unauthorized wireless access points plugged in by staff?",["A policy memo prohibiting staff from connecting unauthorized devices","Network access control with regular scanning for rogue devices","Hiding the corporate network name and changing it regularly","Annual walk-through inspections by security staff"],1,"Detect and block technically, not only by policy."],[5,"Which combination BEST reduces the impact of ransomware?",["Antivirus software installed on all endpoints","A policy of paying promptly to restore service","Longer password requirements for all users","Offline, tested backups with patching and user awareness"],3,"Layered defense with recoverable backups."],[5,"The PRIMARY purpose of an incident response plan is to:",["Assign personal responsibility and accountability for each security incident","Prevent all security incidents from occurring across the organization","Enable a timely, coordinated response that limits damage and restores service","Replace the need for a separate disaster recovery plan for IT services"],2,"It limits harm and speeds recovery."],[5,"Evidence is needed from a laptop in a forensic investigation. What is BEST?",["Create a forensic image, analyze the copy and document chain of custody","Run antivirus on the original machine and review the results for infections","Analyze the original system in place to save time and avoid copying errors","Reboot the machine and copy the relevant files manually to external media"],0,"Preserve the original and work from a copy."],[5,"Which BEST ensures sensitive information is not emailed outside the organization?",["A policy reminder displayed each time users log in to the email system","Larger mailbox quotas and retention for sensitive departments","Quarterly review of a sample of sent items by department managers","Data loss prevention rules that inspect and block outbound messages"],3,"Technical enforcement beats reminders and after-the-fact review."],[5,"Which BEST detects after-hours unauthorized entry to a data center?",["A sign stating that entry is restricted","A clean desk policy for staff","An annual physical inventory of equipment","Access logs, CCTV and alarms reviewed regularly"],3,"Detective controls need monitoring and review."],[5,"Water detection sensors under a raised floor primarily provide:",["Additional cooling for equipment racks","Fire suppression in the equipment room","Reduction of humidity levels under the floor","Early warning of leaks before equipment is damaged"],3,"They detect water early."],[5,"Which BEST helps staff recognize phishing?",["Awareness training with simulated phishing and easy reporting of suspicious email","An annual policy acknowledgment signed by all staff and refreshed at hire","Larger spam filter quotas and stricter blocking rules on the email gateway","A warning banner on all external email with a link to the security policy"],0,"Practice and reporting build real skill."],[5,"A user reports clicking a phishing link. What should happen FIRST?",["Delete the email and continue working after running a quick antivirus scan","Reinstall the operating system on the device before returning to work","Report it to the incident response team so they can contain and investigate","Change the password immediately and take no further action unless problems occur"],2,"Report for containment and investigation."],[5,"Which authentication option is MOST resistant to credential theft?",["A long and complex password that is changed every 90 days","Security questions with unique answers known only to the user","One-time codes sent by text message to the registered mobile number","A hardware token or other phishing-resistant multi-factor method"],3,"Phishing-resistant methods cannot be replayed by an attacker."],[5,"Which BEST ensures privileged access is controlled?",["Permanent administrator rights granted to senior staff based on their seniority","A shared privileged account with a strong password stored in a secure vault","Time-limited privileged access with approval, session recording and review","Annual review of the list of administrator names by the system owner"],2,"Privileged access should be approved, limited, recorded and reviewed."],[5,"A leaver's access was disabled late. Which BEST addresses the root cause?",["Remind managers to notify IT promptly when staff leave","Review all user accounts once a year","Integrate HR offboarding with the access management workflow","Disable accounts only when requested by the manager"],2,"Automating the trigger removes reliance on manual notice."],[5,"Which log would BEST help identify a compromised user account?",["Backup completion and exception logs from the previous week","Printer and print server usage logs by department","Authentication logs showing unusual locations, times or repeated failures","Power and cooling usage logs from the data center"],2,"Authentication logs reveal anomalous sign-ins."],[5,"Which control BEST protects data on a lost USB drive?",["A physical label with the owner's contact details","Encryption of the device","A cable lock to secure the device","An inventory of all issued devices"],1,"Encryption protects the data itself."],[5,"Sensitive data is sent to a third-party processor. What is the BEST approach?",["Sending the full data set for convenience, with a note about confidentiality","Relying on the processor's reputation and its published privacy statement","Emailing a password-protected file after a verbal agreement","Contractual security and privacy obligations, minimal data and secure transfer"],3,"Contract, minimization and secure transfer work together."],[5,"Which practice BEST supports data minimization?",["Collect extra data in case it proves useful for future business needs","Archive all data indefinitely so that it is available for audit purposes","Share data widely across departments to maximize its business value","Collect only the data needed for the stated purpose and delete it afterwards"],3,"Collect and keep only what is needed."],[5,"A mobile device management solution BEST helps by:",["Enforcing encryption, passcodes and remote wipe on enrolled devices","Increasing the performance and battery life of mobile devices","Providing company-owned devices to all staff who travel","Blocking connections to all public Wi-Fi networks"],0,"It gives central control over device security."],[5,"Which BEST supports investigation of incidents in cloud services?",["Provider-managed logs that may be overwritten after a few days","Local logs kept on each virtual machine and reviewed by administrators","Logs retained only after an incident has been declared","Centralized, protected logging with retention aligned to investigation needs"],3,"Centralized, protected logs keep evidence available."],[5,"Which vulnerability management practice is BEST?",["Annual scanning with equal priority given to all findings","Scanning only after a security incident or a regulatory request","Regular scanning with risk-based prioritization and tracked remediation","Fixing the oldest findings first until all findings are closed"],2,"Prioritize by risk and track to closure."],[5,"A penetration test finds a serious flaw. What is the BEST next step?",["Assign an owner, remediate based on risk and retest","Accept the risk because the test was authorized","Wait for the next scheduled test to confirm it","Document the finding without further action"],0,"Fix it and verify the fix."],[5,"Which BEST ensures external testers act within agreed limits?",["Written rules of engagement defining scope, timing and authorization","A verbal briefing for the testers before testing begins","A confidentiality agreement signed by the testing firm","Monitoring and review of the testers' activity logs after the test"],0,"Written scope protects both parties."],[5,"Which approach BEST ensures data is protected appropriately?",["IT staff classify all data on behalf of the business owners","Users choose the protection they consider appropriate for their own data","Internal audit sets classification levels during reviews","Owners classify data and apply controls according to the classification"],3,"The owner decides the classification."],[5,"Developers repeatedly introduce the same security flaws. What is the BEST response?",["More penetration testing before each release only","Secure coding standards, training and automated code scanning","Stricter penalties for developers who introduce flaws","Outsourcing testing to an independent firm"],1,"Fix the root cause, not only the symptoms."],[5,"Firewall rule changes should be:",["Requested, approved and tested through change management with a business justification","Made by the network team as needed and documented afterwards in the firewall log","Approved verbally by the information security officer and recorded by email","Reviewed only during the annual internal and external audits"],0,"Firewall rules are changes and need the same discipline."],[5,"Which protocol BEST secures remote administration of servers?",["Telnet restricted to the internal network","SSH with key-based or multi-factor authentication","Remote desktop without encryption","An HTTP-based administration console"],1,"SSH encrypts the session and credentials."],[5,"Which is the MOST secure way to transfer files with a partner?",["FTP with a strong password and IP address restrictions","SFTP or another encrypted transfer with authenticated endpoints","Email attachments protected by a separately communicated password","Encrypted USB drives sent by tracked courier"],1,"Encrypted and authenticated transfer."],[5,"Which combination BEST reduces the risk of insider data theft?",["Background checks performed at hiring","Strong perimeter firewalls and intrusion prevention","Annual policy training for all staff","Least privilege, activity monitoring and data loss prevention"],3,"Layered controls address insiders."],[5,"A security awareness program is BEST measured by:",["Attendance rates at the scheduled training sessions","The number of awareness posters and newsletters distributed","The number and length of training videos produced","Behavior changes such as lower phishing click rates and higher reporting"],3,"Behavior change is the real outcome."],[5,"Which situation BEST shows effective incident response?",["No incidents are reported to management during the year","Incidents are detected quickly, contained and reviewed to improve controls","Incidents are closed quickly without detailed analysis","Incidents are attributed to user error and closed within the target time"],1,"Detect, contain and learn."],[5,"Which BEST describes defense in depth?",["Multiple layers of preventive, detective and corrective controls","One very strong perimeter firewall supported by regular rule reviews","Strong encryption applied to all data at rest and in transit","Complex passwords required for all users and changed regularly"],0,"No single control is relied on."],[5,"Which BEST ensures availability of authentication services?",["A single high-capacity directory server","Local accounts configured on each system only","Redundant authentication servers with failover","More complex password requirements"],2,"Redundancy removes the single point of failure."],[5,"Which control BEST prevents unauthorized software installation?",["Application whitelisting and restricted administrator rights","A policy forbidding unauthorized software installation, signed by all users","Weekly antivirus scans of all endpoints with reports to management","A periodic software inventory compared with the approved list"],0,"A preventive technical control."],[5,"Systems that cannot be patched remain in use. Which is the BEST compensating approach?",["Accept the risk with no further action because the systems are old","Isolate them and add compensating controls such as segmentation and monitoring","Apply the vendor patches anyway without testing to remove the vulnerabilities","Move them onto the same network segment as other legacy systems"],1,"Isolate and monitor what cannot be fixed."],[5,"Why should security logs be sent to a central, protected system?",["To reduce disk usage and administration effort on each server","To improve the performance of application servers and shorten backups","So attackers cannot easily alter them and events can be correlated","To make log review optional for administrators and security staff"],2,"Integrity and correlation."]]},"5":{"title":"Quiz 5: 150 more best-answer questions","desc":"New exam-style questions at the same level as Quiz 4, with plausible options and a short explanation for each answer.","raw":[[1,"The audit committee asks for assurance on a cloud migration that is already under way, but little documentation exists. What should the IS auditor do FIRST?",["Begin testing controls at the cloud provider so the committee's request is not delayed","Perform a risk assessment of the migration to define the scope and objectives of the review","Decline the engagement until the project team has produced complete documentation","Rely on the project manager's status reports to form an initial conclusion on risk"],1,"Planning starts with risk, scope and objectives, even when documentation is thin."],[1,"Testing finds weaknesses in change management general controls. How does this affect reliance on automated application controls?",["Reliance is reduced, because the controls may have been altered, so more direct testing is needed","Reliance is unaffected, because automated controls operate the same way each time they are executed in production","Reliance increases, because weak change management usually means that few changes have actually been made to the system","Reliance depends only on the vendor's assurance about the application's design and on its published release notes"],0,"Automated controls are reliable only if the environment prevents uncontrolled change."],[1,"To evaluate an automated three-way match control, which evidence is MOST reliable?",["Re-performing the match with test transactions that include deliberate mismatches","A walkthrough in which the accounts payable clerk describes how the match works","A copy of the vendor's functional specification showing the matching logic","A report of last month's matched invoices supplied by the process owner"],0,"Re-performance with exceptions shows the control actually works."],[1,"A control operates quarterly, and there were four occurrences during the period. What is the BEST approach to testing it?",["Select one occurrence at random and extrapolate the result to the other quarters","Test only the most recent occurrence since it best reflects current practice","Test all four occurrences because the population is too small to sample meaningfully","Apply attribute sampling with a 95 percent confidence level to the four occurrences"],2,"Very small populations are tested in full."],[1,"When external confirmations are used, how should the auditor protect the reliability of the evidence?",["Ask the auditee to distribute the requests and forward the replies to save time","Accept replies by email from addresses that the auditee supplies","Send the requests and receive the replies directly, without the auditee handling them","Phone the auditee afterwards to confirm that the replies are genuine"],2,"Control over the confirmation process preserves independence."],[1,"Management asks that a significant finding be left out of the version of the report sent to the audit committee. What should the auditor do?",["Retain the finding and ensure the audit committee receives the complete report","Remove the finding and raise it in a separate management letter for later follow-up","Rewrite the finding in softer language that management is willing to accept","Delay the report until management and the auditor agree on its content"],0,"Report integrity and independence are not negotiable."],[1,"Log retention gaps mean the auditor cannot obtain evidence for part of the audit period. What is the BEST course of action?",["Extrapolate the available evidence to the missing period without further comment","Consider the effect of the limitation on the conclusion and disclose it in the report","Cancel the audit until the missing logs can be recovered from backups","Ask management to confirm in writing that no issues occurred in that period"],1,"Limitations affect the conclusion and must be disclosed."],[1,"The plan has time for one more review: a stable, low-risk process last audited two years ago, or a newly implemented high-risk system. Which should be chosen?",["The stable process, because audit standards require every area to be audited on a regular cycle","The stable process, because it can be completed with fewer resources and less effort","The new system, because its risk rating is higher and it has no assurance coverage yet","Neither, until management formally requests an audit of one of them"],2,"Risk drives audit priorities."],[1,"What is the MAIN purpose of a closing meeting with the auditees?",["To obtain management's agreement with the overall audit opinion before it is issued","To negotiate the risk ratings of the findings with the process owners","To confirm the factual accuracy of findings and discuss management's planned responses","To give management an opportunity to remove findings that they dispute"],2,"Facts are confirmed; conclusions are not negotiated."],[1,"Which objective is MOST appropriate for an application review?",["Determine whether the application uses the most current technology available in the market for its type","Determine whether transactions are processed completely, accurately and with authorization","Determine whether the application costs less to run than comparable alternative systems on the market","Determine whether the application has the highest number of active users across the organization"],1,"Application audits focus on completeness, accuracy and authorization."],[1,"Prior-year results are used in planning this year's audit of a system. What must the auditor do?",["Reuse the same scope and test steps so that results can be compared reliably from year to year","Assume controls still work unless management reports a problem with them during the year","Reduce testing on every control that passed last year, since those controls were found to be effective","Update the assessment for changes in the system, the environment and the risks since the last audit"],3,"Prior results help, but changes must be considered."],[1,"Why should the auditor evaluate a control's design before testing its operating effectiveness?",["Design reviews are faster and can usually replace operating effectiveness tests in most audit situations","A poorly designed control cannot be effective, so operating tests would add no assurance","Auditee staff are generally more cooperative during design discussions than during operating tests","Audit standards require design reviews to be completed within a fixed time before testing can start"],1,"Design comes first."],[1,"A control operates effectively but is not documented. How should the auditor report this?",["Report the documentation weakness and note that the control itself was effective","Do not report it, because the control works in practice","Report the control as ineffective because of the missing documentation","Mention it verbally to the process owner and leave it out of the written report"],0,"Report accurately: the control works and the documentation is weak."],[1,"The auditor wants to rely on testing performed by the compliance (second line) function. What should be assessed FIRST?",["The size of the compliance team compared with the internal audit team","Whether the compliance function reports directly to the chief executive","Whether compliance uses the same testing software as internal audit","The compliance function's competence, objectivity and the quality of its work"],3,"Reliance on others requires assessing competence and objectivity."],[1,"A merger has just been completed. What should the head of audit do with the audit universe?",["Leave it unchanged until the next annual planning cycle begins and the plan is reviewed","Remove the acquired entities until their processes have been integrated","Update it with the acquired entities and reassess risks and priorities in the audit plan","Ask the acquired company's management to rate the risk of its own processes"],2,"Major change triggers an update of the universe and plan."],[1,"When interviewing staff to understand a control, how can the auditor increase the reliability of the information?",["Interview only the most senior person responsible for the area","Corroborate it with documents, observation or system evidence","Use closed questions to limit the range of possible answers","Record the interview and ask the interviewee to sign the notes"],1,"Interview evidence is weak unless it is corroborated."],[1,"The auditor observes a control being performed while staff know they are being watched. Why may this evidence be limited?",["People may perform differently when observed, so it may not show normal practice","Observation is never acceptable as audit evidence under audit standards","Staff may refuse to perform the control while it is being observed","The auditor cannot document what was observed without the auditee's signature"],0,"Observation shows only the moment observed."],[1,"Management asks why the control failures found in an audit occurred. Which addition BEST improves the report?",["A longer description of the technical symptoms that were observed","A root cause analysis explaining why the control failed","A comparison of the results with industry averages","A list of the staff members involved in each failure"],1,"Root cause supports lasting fixes."],[1,"Management says a finding is implemented, but the auditor finds it only partly done. What should the follow-up report say?",["That the finding is closed because the main action has been completed","That the finding is open and unchanged since the original report","That the finding is withdrawn in recognition of management's effort","That the finding is partially implemented, and what remains outstanding"],3,"Report what is true."],[1,"When should the audit supervisor review the workpapers?",["After the report is issued, as a quality check on completed work","Before the report is finalized, so conclusions are supported and gaps can be fixed","Only if the auditee disputes one of the findings or challenges the audit conclusion","At year end for all audits together, to save time and keep the review consistent"],1,"Review before reporting."],[1,"The auditor wants to concentrate on high-risk items when sampling transactions. Which approach supports this?",["Stratify the population and give high-value or high-risk strata greater coverage","Use simple random sampling across the entire population so that every item has an equal chance","Use systematic sampling with a random starting point to obtain an even spread of items","Test a sample drawn only from the smallest items, where errors are most likely to remain"],0,"Stratification focuses effort on risk."],[1,"Before relying on an analytics script written by the audit team, what should be done?",["Validate the script's logic against known data and expected results","Have the author confirm that the script works as intended","Run the script once on production data and review the output","Compare the script with the one used in the previous audit"],0,"Test the tool before relying on its output."],[1,"Audit samples contain customers' personal data. What should the auditor do?",["Share the full sample freely within the audit team and with other departments","Copy the sample to personal devices to make fieldwork more convenient","Delete it immediately after testing, even if retention is required","Limit access, mask data where possible and retain it only as long as required"],3,"Personal data in workpapers must be protected."],[1,"A regulator asks the audit function for copies of its workpapers. What should the head of audit do?",["Consult senior management and legal counsel before releasing any workpapers","Provide the workpapers immediately since regulators are entitled to them","Refuse all requests from external parties as a matter of policy","Ask the auditee to provide its own copies of the supporting documents instead"],0,"Release needs authorization and legal advice."],[1,"An overall conclusion rests on a sample that did not include any high-risk items. What is the main concern?",["The sample size will be larger than necessary","The conclusion may not reflect the risks that matter most","The auditee may object to the way the sample was selected","The workpapers will be harder to file and retrieve"],1,"Samples must reflect risk."],[1,"Using automated audit tools instead of manual testing mainly allows the auditor to:",["Remove the need for professional judgment in forming audit conclusions from the results","Avoid documenting the procedures performed because the tool keeps its own logs","Test larger volumes more consistently, provided the data and logic are validated","Rely on the results without understanding the underlying data"],2,"Tools help but still need validation and judgment."],[1,"The expected error rate used to plan a sample is set far too low. What is the likely result?",["The sample is too large and wastes audit effort without improving the conclusion","The sample is too small and may fail to detect the real level of error","The confidence level automatically increases to compensate","The tolerable error rate is raised to match the results"],1,"Understating expected error understates sample size."],[2,"An organization decides to adopt a recognized IT governance framework. What should be done FIRST?",["Assess the current state and align the framework to business objectives and risks","Purchase tools that support the framework's processes and automate its reporting","Train all IT staff to certification level in the framework before any assessment","Replicate the framework's processes exactly as written, without tailoring them to the organization"],0,"Adoption starts with understanding needs and current practice."],[2,"Which information would BEST help the audit committee oversee IT?",["Regular reporting on IT risks, major projects and the status of audit findings","Detailed system logs and incident tickets for the whole reporting period, provided monthly","Source code of the critical applications with documentation of recent changes","Timesheets for staff working on IT projects, with a breakdown of hours by task"],0,"Committees need risk-focused summaries."],[2,"Which situation BEST indicates a weak risk culture?",["Staff avoid reporting incidents because they fear blame","Risk reports are submitted to management every quarter","The risk register includes both IT and business risks","Managers attend annual risk management training"],0,"Fear of blame hides problems."],[2,"A key risk indicator exceeds its agreed threshold. What should happen NEXT?",["The threshold is raised so that the indicator is back within range and no action is needed","The indicator is reviewed at the next scheduled quarterly meeting with the other metrics","The indicator is removed from the dashboard until its data source has been validated","It is escalated to the risk owner and management for action under the defined process"],3,"Thresholds exist to trigger escalation."],[2,"Who should be assigned ownership of an IT policy?",["A senior manager accountable for its content and periodic review","The IT help desk, which answers staff questions about the policy","The external auditor, who reviews compliance with the policy","The most recently hired member of the team, to ensure fresh thinking"],0,"Policies need accountable owners."],[2,"A key outsourced provider shows signs of financial difficulty. What is the BEST step for management?",["Terminate the contract immediately to avoid any exposure","Prepay the provider to support its cash flow","Increase monitoring and review contingency and exit plans","Wait until the provider fails and then decide how to respond"],2,"Prepare before failure."],[2,"All critical services run with a single cloud provider. Which strategy BEST reduces the concentration risk?",["A tested exit and portability plan with alternate providers for critical workloads","A longer contract with the current provider in exchange for better pricing","A larger insurance policy covering provider outages","More frequent review of the provider's published service reports"],0,"Portability and alternatives reduce dependence."],[2,"Business units and IT disagree over project priorities. Who should decide?",["The CIO, based on technical considerations and the capacity of the IT department","The project manager of the largest project, based on the resources it requires","The department with the largest budget, based on its contribution to funding","The IT steering committee, using agreed criteria of value and risk"],3,"Governance bodies arbitrate competing priorities."],[2,"Why is an architecture review gate useful in IT governance?",["It speeds up approval of all projects by removing other reviews from the process","It checks that solutions fit the target architecture and standards before major investment","It replaces testing with design reviews so projects can be delivered sooner","It transfers responsibility for solution design to the auditor"],1,"Gates prevent costly misalignment."],[2,"IT budgets are cut by 15 percent. Which governance response is BEST?",["Reduce every project budget by the same percentage regardless of its value or risk","Reprioritize spending using risk and value, and make the impact visible to executives","Cancel security and audit-related spending first since it does not produce direct revenue","Delay the decision until the next budget cycle, when more information will be available"],1,"Cuts should follow risk and value."],[2,"Which BEST helps ensure that legal and regulatory obligations are met?",["A policy stating that all staff must obey applicable laws and regulations at all times","A maintained register of obligations with owners and periodic compliance checks","An annual email reminder from the legal department to all department heads","Reliance on the external auditor to identify any gaps in the organization's compliance"],1,"A register creates ownership and follow-up."],[2,"Board members have limited IT knowledge. What should be done to improve oversight?",["Delegate all IT oversight decisions to the CIO, who has the necessary technical knowledge","Send the board detailed technical documents each month so it can review the IT environment","Provide targeted briefings and clear IT risk reports, and consider adding relevant expertise","Reduce the frequency of IT reporting to avoid confusing members with technical detail"],2,"Boards need understandable information."],[2,"How does the COBIT goals cascade help an organization?",["It lists the technical controls required for every system in the organization's portfolio","It provides a fixed set of metrics that every organization must report to its regulator","It replaces the need for an organizational strategy by prescribing standard objectives","It links stakeholder needs to enterprise goals and then to IT-related goals and processes"],3,"The cascade connects business needs to IT."],[2,"Which approach BEST supports confidential reporting of misconduct?",["A channel allowing anonymous reports, with protection against retaliation","A requirement that all reports be made in person to the employee's line manager","A suggestion box in the staff canteen that is checked once or twice a year","Reports accepted only through HR from named complainants"],0,"Anonymity and protection encourage reporting."],[2,"Poor data quality is affecting business decisions. Which governance step is MOST appropriate?",["Purchase a larger database platform with more processing and storage capacity","Ask IT to correct the data in the systems without any input from business users","Assign data owners and define data quality standards with monitoring","Reduce the amount of data collected across all systems"],2,"Data governance assigns ownership."],[2,"Who should be responsible for deciding record retention periods?",["IT operations, based on the storage costs and the capacity of the backup systems","Business owners together with legal and compliance, within policy","The help desk, based on the requests it receives from users about old records","External auditors, based on the evidence they need for the annual audit"],1,"Retention is a business and legal decision."],[2,"A service provider's SOC 2 report contains exceptions. Who is responsible for evaluating their effect on the customer's controls?",["The service provider's auditors, who prepared the report and understand the exceptions","The regulator that supervises the customer's industry sector","The customer's management, with input from risk and audit","The provider's other customers, through a user group review of the report"],2,"The customer assesses the impact on its own environment."],[2,"Major IT incidents are not reaching executives. What is the BEST improvement?",["Remove severity levels so that all incidents are treated equally","Email every incident ticket to the executive team","Define severity criteria and escalation paths to senior management","Let IT staff decide case by case whether executives should be told"],2,"Escalation criteria create visibility."],[2,"A critical skills gap exists in IT. Which is the BEST response?",["Ignore it until a project is affected and the impact on delivery can be measured","Rely on staff to learn on their own without support","Include it in resource planning with training, hiring or sourcing decisions","Transfer the work to staff with no relevant experience"],2,"Resource management addresses skills gaps."],[2,"IT reports meeting all SLAs, but business users are unhappy. What does this MOST likely show?",["Users do not understand technology well enough","The SLAs are calculated incorrectly by the monitoring tool","The SLAs and metrics do not reflect what matters to the business","IT is exceeding expectations and users need to be informed"],2,"Metrics must reflect business needs."],[2,"Who should be accountable for realizing the benefits of a project?",["The project manager","A business owner or sponsor","The lead developer","The internal auditor"],1,"Business owners own the benefits."],[2,"Several business units run unapproved applications. This is MOST likely a sign of:",["Excellent innovation by the business that should not be constrained","Over-investment in IT by the central function, leaving surplus capacity unused","Low demand for IT services across the organization, with users seeking alternatives","IT not meeting business needs, or a weak governance process for technology requests"],3,"Shadow IT points to a governance gap."],[2,"Critical systems run on technology nearing the end of vendor support. What should governance ensure?",["That the systems remain in use indefinitely","That support is taken over by internal staff without further planning","A lifecycle plan with funding and timelines to replace or mitigate the risk","That the risk is reported only if the vendor withdraws support"],2,"Plan lifecycle and replacement."],[2,"In a small company, one person administers systems and also approves changes. What is the BEST compensating control?",["A longer password for the administrator account","Regular independent review of logs and changes by an owner or manager","A ban on changes because staffing is limited","A policy statement forbidding misuse of administrator rights"],1,"Independent review compensates for missing segregation."],[2,"A contract with a foreign provider lacks data protection clauses. What should be done?",["Involve legal counsel to add data protection, audit and breach notification terms before signing","Sign now to meet the project deadline and amend the contract later if problems arise","Assume the provider's standard terms are sufficient, since they are used for other customers","Rely on the provider's reputation in the market and its published security statement"],0,"Contract terms protect the data."],[2,"An insider threat program is MOST effective when it:",["Relies on IT monitoring alone, using automated alerts on user activity","Combines HR, legal and security with clear policies and monitoring that respects privacy","Is run by line managers without guidance, using their knowledge of staff behavior","Is kept secret from legal and HR to avoid leaks about monitored employees"],1,"A cross-functional approach is needed."],[2,"Which metric is the LEAST useful for governance purposes?",["A count of reports produced with no link to decisions or objectives","Percentage of critical risks with treatment plans in place","Benefits realized compared with business cases","The trend in repeat audit findings over time"],0,"Metrics should support decisions."],[3,"Which technique BEST helps users confirm that requirements have been understood correctly?",["Reviewing a long requirements document without discussion","Prototypes or workshops in which users review models of the solution","Asking the developers to approve the requirements","Waiting for user acceptance testing to reveal any gaps"],1,"Early user feedback prevents rework."],[3,"How should requirements be prioritized when time or budget is limited?",["In the order in which they were received","By business value and risk, agreed with the business sponsor","By how easy they are for the developers to build","By the seniority of the person who requested them"],1,"Business value drives priority."],[3,"Source code escrow is of limited value unless:",["The vendor's name appears in the escrow agreement and the agreement is signed by both parties","The escrow agent is located near the customer's head office for easy access","The code is stored in encrypted format only, with the key held by the vendor","The escrowed code is periodically verified as complete and able to be built"],3,"An unverified escrow may not work when needed."],[3,"The test environment differs significantly from production. What is the main risk?",["Testing will take longer than planned because of the configuration differences","Test results may not reflect how the system will behave in production","Developers will have less access to the test environment","Licensing costs will increase for the test servers"],1,"Environment parity makes tests meaningful."],[3,"What should be completed BEFORE user acceptance testing begins?",["Go-live communication to all users and their managers across the organization","System and integration testing, with critical defects resolved","Final migration of all data into the production environment","Decommissioning of the old system and removal of its user accounts"],1,"UAT starts once the system is stable enough to be tested by users."],[3,"A go/no-go decision before cutover should be based on:",["The project manager's judgment alone, based on their experience of similar projects","The date planned in the project schedule, to avoid further delay and cost","The availability of the vendor's staff on the day","A readiness checklist covering testing, data, training, support and rollback"],3,"Objective readiness criteria support the decision."],[3,"The purpose of hypercare support after go-live is to:",["Replace the post-implementation review with continuous feedback from users","Give extra support to resolve issues quickly while the system stabilizes","Test the rollback plan under real operating conditions during the first month","Provide training to new hires over the following year"],1,"Early extra support protects the business during stabilization."],[3,"Why should data be cleansed before migration?",["Cleansing makes the migration run faster because there is less data to move","Cleansing eliminates the need for reconciliation after migration","Cleansing is required only for archived data, since active data is already validated","Migrating poor quality data carries errors and duplicates into the new system"],3,"Poor data in means poor data out."],[3,"When implementing packaged software, which approach generally carries the LEAST long-term risk?",["Customizing the package heavily so that it matches existing processes exactly","Modifying the vendor's code without documenting the changes made","Configuring the package with supported settings rather than modifying its code","Delaying all upgrades indefinitely to avoid disruption to the customized features"],2,"Configuration over customization eases upgrades and support."],[3,"A vendor changes an API that the organization's systems depend on. Which control BEST reduces the impact?",["Trusting the vendor to notify the organization of all API changes in advance","Versioning agreements and regression testing of integrations before changes go live","Avoiding all API-based integrations in future projects to reduce dependency","Waiting for users to report failures before deciding how to react to changes"],1,"Interfaces need controlled change and testing."],[3,"Business users build applications with low-code tools. Which governance measure is MOST important?",["A ban on all low-code tools across the organization, with disciplinary action for use","Unrestricted use because the applications are small","Leaving support to the goodwill of the builders","An inventory and standards for approval, security and support of such applications"],3,"End-user development needs governance."],[3,"Access to the source code repository should be:",["Restricted by role and reviewed periodically","Open to all employees to encourage collaboration","Shared through one team account","Granted permanently on request"],0,"Least privilege applies to code."],[3,"How should defects be prioritized during testing?",["By the date on which they were found, with the oldest defects fixed first","By business impact and severity, with critical defects fixed before release","By the developers' preference, depending on which defects are easiest to fix","By the number of users who report each defect through the help desk"],1,"Impact drives priority."],[3,"Adding security controls late in a project, compared with designing them in early, typically:",["Costs less and is more effective","Has no effect on project cost","Is required by most development standards","Costs more and is often less effective"],3,"Building controls in early is cheaper and stronger."],[3,"Who should own the project risks identified in the risk register?",["The internal auditor, who reviews the register each quarter","The vendor, under the terms of the contract","No one until a risk actually occurs and an issue is raised","Named individuals accountable for managing each risk"],3,"Every risk needs an accountable owner."],[3,"In agile projects, what should the 'definition of done' include?",["Only that the code for the item has been written and checked in","Testing, security and documentation criteria that every item must meet","Approval of the product owner without testing","The number of hours spent on the item compared with the estimate"],1,"Quality is built into completion criteria."],[3,"An emergency fix has been applied directly to production. What should happen afterwards?",["It is left outside the baseline to avoid conflicts with planned development work","It is removed in the next release without review, since it was only temporary","The fix is documented, reviewed and included in the normal source code baseline","It is documented only if problems occur later and the fix is questioned"],2,"Emergency changes must be brought back under control."],[3,"When a system is retired, which step is MOST important?",["Archive or destroy data according to retention and security requirements","Leave the data on the server until the storage is needed","Delete user accounts but keep the data accessible on the old server","Transfer all data to an employee's personal device"],0,"Secure disposal protects the data."],[4,"Which backup approach BEST reflects keeping multiple copies on different media, with at least one offsite?",["Two copies kept on the same disk array for speed of restore","Three copies of data on two types of media, with one stored offsite","All copies stored in the same data center but in separate rooms","A single copy supported by real-time replication to the same site"],1,"Diversity of media and location improves recoverability."],[4,"Nightly backups now take longer than the available window. What is the MOST appropriate action?",["Skip backups of non-critical servers, without first assessing the risk to the business","Extend the window into business hours without testing the impact on users","Reduce backup retention so that less data has to be copied each night","Review the backup design, such as incremental or snapshot methods, and capacity to meet the window"],3,"Redesign to meet the window instead of weakening protection."],[4,"Backup data contains sensitive information. Which is the BEST protection?",["Label the media as confidential","Store the backups on the same network share as production data","Encrypt the backups and restrict access to backup media and keys","Give all operators permission to restore any backup"],2,"Encryption and access control protect the data."],[4,"A critical supplier is not covered in the continuity plan. What is the MOST significant risk?",["Contract negotiations with the supplier may take longer and cost more at renewal","The supplier's prices could increase over time and affect the budget","Staff may be unsure who the supplier is and how to contact it in an emergency","A supplier outage could interrupt a critical process with no recovery option"],3,"Dependencies must be covered in continuity planning."],[4,"Which element is essential in a crisis communications plan?",["Defined spokespersons and channels to reach staff, customers and regulators","A list of marketing slogans and brand messages for use during an incident","Instructions that no information be shared with anyone outside the crisis team","Permission for any employee to speak to the media if they have the facts"],0,"Controlled communication prevents confusion and damage."],[4,"During the BIA, which is MOST important to identify for each critical process?",["The names and contact details of all employees who work in the process area","The cost of the office space and equipment used to run the process","The age and original purchase price of the equipment used by the process","Its critical dependencies and the maximum tolerable downtime"],3,"The BIA identifies what the process needs and how long it can be down."],[4,"How often should a business continuity plan normally be tested?",["At least annually and after significant changes","Every five years as part of the strategic cycle","Only after a real disaster has occurred","Only when the auditors request it"],0,"Regular testing keeps the plan valid."],[4,"Who should be authorized to declare a disaster?",["Whichever employee notices the problem first, to avoid any delay in response","The IT help desk, because it receives the first reports of service failures","The vendor providing the recovery site, once it has verified the outage","A designated senior manager or crisis team, using defined criteria"],3,"Declaration needs clear authority and criteria."],[4,"Manual workarounds for critical processes are MOST useful in continuity planning when they:",["Are known only to senior managers, who direct staff when the outage begins","Rely on systems that are also unavailable during the outage","Are documented, practiced and sized for the expected volume during an outage","Are drafted only after an outage has started and the impact is understood"],2,"Workarounds must be ready and realistic."],[4,"A major incident affects many users. Which practice is MOST important?",["Waiting until the root cause is known before communicating anything to users","Assigning an incident manager and communicating status at regular intervals","Handling the incident through the normal ticket queues","Limiting communication to IT staff so users are not alarmed by the issue"],1,"Major incidents need coordination and communication."],[4,"A standard change that is pre-approved for routine, low-risk work should:",["Bypass logging because the change is routine and low risk","Be carried out by anyone in the team without specific training or authorization","Follow a documented procedure with defined criteria and be logged","Be used for higher-risk changes as well, to speed up delivery to the business"],2,"Standard changes still follow a controlled procedure."],[4,"Why are change freeze periods used?",["To give IT staff time off during periods when the business is busy","To stop emergency changes from being made during the freeze period","To reduce risk in critical business periods by limiting non-essential changes","To reduce software licensing costs during the period when usage is highest"],2,"Freezes lower the chance of disruption at critical times."],[4,"Code is promoted from development to test to production. Which control is MOST important?",["Developers copy the code to each environment manually","Code is edited directly in production if needed","Promotion only through controlled, approved and logged processes","All environments share the same database to simplify testing"],2,"Controlled promotion preserves integrity."],[4,"Unapproved software is found on production servers. What is the BEST preventive control?",["Sending a reminder to all administrators about the software installation policy","Restricting administrative rights and using application allowlisting","Reviewing the installed software on each server once a year","Allowing installation with after-the-fact notification to the change board"],1,"Preventive technical control."],[4,"Application performance monitoring MOST directly helps to:",["Detect slow transactions and bottlenecks before users are widely affected","Encrypt data in transit between the application servers and the database","Back up the application database more frequently during the working day","Authenticate users to the application using stronger credentials"],0,"Monitoring supports availability and performance."],[4,"Cloud auto-scaling is enabled for a critical application. Which risk requires management attention?",["Scaled servers may not be covered by the organization's software licences","Uncontrolled scaling may increase cost without limits or alerts","Users may lose connections to the application each time the scale changes","Backups of scaled servers will be unnecessary because they are temporary"],1,"Elastic services need cost controls."],[4,"Software asset management primarily helps the organization to:",["Encrypt all installed software to protect it from unauthorized copying","Test applications in a staging environment before they are released","Track installed software and entitlements to manage cost and license compliance","Back up the software libraries and installation media to offsite storage"],2,"It links what is installed with what is licensed."],[4,"Point-in-time recovery of a database requires:",["Only a copy of the database files","A printout of recent transactions","A full backup combined with transaction logs","A mirrored server that keeps no logs"],2,"Logs allow recovery to a chosen moment."],[4,"Data is replicated between two active database sites that both accept updates. What is a key risk?",["Faster performance at both sites because the load is shared","Reduced storage requirements since only changes are replicated","The elimination of the need for backups at either site","Conflicting updates that can corrupt data unless conflicts are resolved"],3,"Active-active replication needs conflict handling."],[4,"A server hardening baseline is MOST useful because it:",["Defines a consistent secure configuration that can be applied and checked","Improves server performance by removing unnecessary services","Replaces the need for patching because configurations are standardized","Removes the need for access control on the hardened servers"],0,"A baseline provides a standard to apply and verify."],[4,"Which control is MOST important for hypervisors?",["Larger disks to hold more virtual machines and snapshots on each host","Running more virtual machines per host to reduce the number of hosts","Open management consoles to speed up administration across hosts","Timely patching, restricted administrative access and monitoring"],3,"A hypervisor compromise affects every guest."],[4,"Which measure BEST protects critical systems from compromised general-purpose workstations?",["Placing all systems on one flat network to simplify administration","Giving workstations administrative access to servers","Using the same password on all servers to simplify administration","Segmentation with access control lists limiting traffic to what is needed"],3,"Segmentation limits lateral movement."],[4,"A DNS outage makes many applications unreachable. What is the BEST design improvement?",["Redundant DNS servers in separate locations","A single, more powerful DNS server","Replacing DNS with local host files","Longer DNS cache times only"],0,"Redundancy removes the single point of failure."],[4,"Voice traffic is poor in quality when the network is busy. Which technique BEST helps?",["Quality of service rules that prioritize voice traffic","Adding more email filters to reduce the volume of traffic on the network","Reducing password complexity so that users log in faster to voice systems","Removing logging from network devices to free up processing capacity"],0,"QoS prioritizes time-sensitive traffic."],[4,"What is the BEST way to maintain continuity of operations at a shift handover?",["Rely on verbal briefings between the outgoing and incoming shift only","Let each shift decide independently what needs attention","Keep handover notes in personal notebooks that operators carry between shifts","Use a handover log of open incidents, pending jobs and special instructions"],3,"A shared log preserves continuity."],[4,"Operators can connect remotely to production systems. Which control is MOST important?",["Strong authentication, encrypted connections and logging of remote sessions","Shared accounts for remote operators so that sessions are easier to manage","Open access from any network so operators can connect from anywhere","No logging of remote sessions so that performance is not affected"],0,"Remote operations need strong, monitored access."],[4,"Generators and UPS units should be:",["Tested only when installed","Left untouched to avoid causing failures","Tested only after a power outage","Tested regularly under load according to a schedule"],3,"Untested equipment cannot be relied on."],[4,"An underpinning contract with a supplier is MOST useful to:",["Replace the SLA with the business, because the contract covers the same terms","Reduce user training needs for the services that the supplier provides","Support the internal service levels IT has promised the business","Avoid change control for the supplier's services"],2,"It backs the service levels promised to the business."],[4,"A service catalog helps the business by:",["Describing available services, service levels and how to request them","Listing the salaries and job titles of all IT staff who support each service","Recording hardware serial numbers and warranty details for each asset","Replacing incident management with a self-service request portal"],0,"It makes the services and how to obtain them clear."],[4,"In a SaaS model, which task usually remains with the customer?",["Patching the operating systems on the provider's infrastructure servers","Configuring user access and managing the data it enters","Operating the physical data centers in which the service runs","Managing the network devices that connect the provider's systems"],1,"Customers remain responsible for their data and access."],[4,"Why are independent backups of SaaS data relevant?",["Provider commitments may not cover deletion or corruption caused by the customer","SaaS data is not stored by the provider, so the customer must hold all copies","SaaS providers always keep unlimited version history for every customer record","Backups are prohibited in cloud services under most standard service contracts"],0,"Customers may need their own recovery copy."],[4,"Auditing an outsourced data center is BEST supported by:",["The provider's marketing brochure and its published security statement","Contractual audit rights and independent assurance reports such as SOC 2","Verbal confirmation from the provider's sales staff","A tour of the provider's reception area and public facilities"],1,"Rights and independent reports provide assurance."],[4,"Spreadsheets with macros are used for financial reporting. Which control is MOST valuable?",["No control, since macros are small programs written by finance staff","Allowing anyone to change the macros so that errors are found quickly","Version control, restricted editing and independent review of macros and calculations","Keeping the file on a personal USB drive to prevent unauthorized copies"],2,"End-user computing needs control and review."],[4,"Operational technology (OT) devices share the corporate IT network. What is the BEST protection?",["Allow free access between IT and OT for efficiency","Leave default passwords on OT devices","Segment OT from IT with controlled gateways","Disable logging on OT networks"],2,"Segmentation protects fragile systems."],[4,"Servers show different times, complicating investigations. What is the BEST solution?",["Manually set the time on each server weekly","Synchronize all systems to a trusted time source","Ignore time stamps when reviewing logs","Use local time zones for all servers"],1,"Consistent time supports investigation."],[4,"Log storage is nearly full on a critical server. What is the main risk?",["Reports will take less time to generate because there is less data","New events may not be recorded, creating gaps in monitoring and evidence","Backups will run faster since fewer log files need to be copied","Users will notice more error messages when the server is busy"],1,"Missing logs mean missing evidence."],[4,"Access to the computer operations area should be:",["Open to all employees","Unlogged for convenience","Restricted to authorized personnel and logged","Granted to visitors without escort"],2,"Physical access must be controlled and recorded."],[4,"A cloud workload uses a warm standby design. What does this mean for recovery?",["No resources run until a disaster occurs, and everything is built from backups","Two full production sites serve users at all times and share the load equally","Recovery depends on shipping tapes to a recovery site and rebuilding servers","A scaled-down copy already runs and can be scaled up to take over quickly"],3,"Warm standby balances cost and recovery time."],[4,"A service desk reports a growing number of repeat incidents. Which process should be strengthened?",["Release management, to schedule and deploy changes more safely","Capacity management, to ensure resources are sufficient for demand","Problem management, to find and remove root causes","Financial management, to control the cost of incident handling"],2,"Repeat incidents point to unresolved root causes."],[5,"The root certificate authority in a public key infrastructure is compromised. What is the main impact?",["Only certificates issued in the last day are affected","Only encryption speed is affected","Only the CA staff's passwords need to be changed","All certificates chained to that root can no longer be trusted"],3,"Trust flows down from the root."],[5,"Egress filtering on a firewall helps by:",["Blocking all incoming connections from the internet unless explicitly approved","Encrypting traffic between internal servers using the firewall's VPN module","Limiting outbound traffic to approved destinations and ports, reducing data exfiltration","Speeding up internal network traffic by bypassing inspection of local flows"],2,"Outbound controls limit what compromised systems can do."],[5,"An IDS placed in the DMZ, inside the firewall, is mainly useful to:",["Detect attacks that passed the firewall and reached the protected segment","Block all attacks before they reach the firewall at the network edge","Record every packet arriving from the internet for later forensic analysis","Replace the firewall rule set with signature-based filtering of traffic"],0,"It sees what got through."],[5,"Network access control posture checks:",["Measure the speed and quality of each device's connection to the network","Record which employees are in the office on a given day for security purposes","Verify devices meet requirements such as patches and antimalware before granting access","Encrypt data on the devices after they have connected to the corporate network"],2,"Posture checks admit only compliant devices."],[5,"An 'evil twin' wireless attack involves:",["Two identical servers failing at the same time because of a shared fault","A rogue access point imitating a legitimate one to capture credentials or traffic","A copy of a user's database made without the owner's authorization","A duplicate employee account created by an administrator by mistake"],1,"It lures users to a fake network."],[5,"Split tunneling on a VPN increases risk because:",["All traffic is encrypted twice, which slows down the connection for the user","Users cannot reach internal systems because of conflicting routing rules","The VPN server becomes unavailable whenever several users connect together","Internet traffic bypasses corporate controls while the device is on the internal network"],3,"Bypassing corporate controls can expose the internal network."],[5,"An advanced persistent threat is BEST detected by:",["Behavior-based monitoring and correlation of unusual activity over time","A single scan with an up-to-date antivirus tool on each endpoint","Annual review of firewall rules by the network team","Review of printer and print server logs for unusual jobs"],0,"APTs hide in normal activity, so patterns over time matter."],[5,"Which measure BEST limits the spread of ransomware inside a network?",["Network segmentation and least-privilege access to file shares","A single large network with shared administrative access","A longer password policy only","Faster backups only"],0,"Segmentation and least privilege contain the damage."],[5,"Access provisioning BEST ensures appropriate access when:",["IT grants access to anyone who asks, using the standard role for the job title","Managers email access requests informally to the administrator who has time","Users share accounts with colleagues to speed up work during busy periods","Requests are approved by the data owner and granted through a workflow with records"],3,"Owner approval with a record supports accountability."],[5,"Emergency (break-glass) access to a critical system should be:",["Tightly controlled, time-limited, logged and reviewed afterwards","Shared permanently among all administrators so that help is always available","Unlogged, to avoid delaying the response to the emergency","Granted to any user who reports an emergency, based on their own judgment"],0,"Emergency access is high-risk and needs oversight."],[5,"Service accounts should be:",["Shared among administrators so that anyone can fix a failed process","Given permanent passwords that never change, to avoid process failures","Non-interactive, assigned to an owner, with protected and rotated credentials","Used for daily interactive logons by the application support team"],2,"Service accounts need ownership and protection."],[5,"A password vault for administrators helps mainly by:",["Letting administrators share passwords by email when they need access quickly","Removing the need for authentication on the systems that the vault manages","Storing credentials securely, controlling checkout and logging their use","Making passwords simpler to remember and therefore less likely to be reset"],2,"Vaulting controls and records privileged credentials."],[5,"Risk-based (adaptive) authentication:",["Uses the same authentication checks for every login regardless of the risk","Removes passwords entirely for all users once the device has been registered","Adjusts authentication requirements to context such as location, device and behavior","Applies only to physical access to buildings and data centers"],2,"It matches the strength of authentication to the risk."],[5,"How frequently should security logs be reviewed?",["Only once a year for all systems, at the time of the annual audit","Only after an incident has been reported by a user or a customer","Based on risk, with critical systems monitored continuously or in near real time","Never, since logs are intended only to support later audits and investigations"],2,"Review frequency should follow risk."],[5,"To test for authorization weaknesses in a web application, the auditor should:",["Review the application's user interface design and navigation for consistency","Attempt actions with accounts of different roles to confirm restrictions are enforced","Check that the passwords used by the application are long enough","Count the number of pages and forms that the application exposes to users"],1,"Role-based testing shows whether restrictions hold."],[5,"Default configurations on newly deployed applications should be:",["Left unchanged to avoid vendor support issues","Changed only after an incident","Documented but not applied","Reviewed and hardened before production use"],3,"Defaults are widely known and often weak."],[5,"Tokenization of payment card data is mainly intended to:",["Make the stored card data larger so that it is harder to copy in full","Speed up database queries by indexing card numbers more efficiently","Remove the need for access control on the systems that store the data","Replace sensitive values with tokens to reduce exposure and compliance scope"],3,"Tokens limit where real card data exists."],[5,"Endpoint data loss prevention primarily helps by:",["Speeding up the devices by removing unnecessary background processes","Controlling how sensitive data is copied, printed or uploaded from devices","Blocking all internet access from devices that store sensitive information","Replacing the backups of the data held on each endpoint"],1,"It controls how data leaves endpoints."],[5,"Cloud identity and access management should be based on:",["Shared administrator accounts that all engineers can use when they need to","Permanent broad rights for developers so that deployments are not delayed","Least-privilege roles with regular access reviews and multi-factor authentication","Passwords only, shared across teams that work on the same workload"],2,"Least privilege and review reduce cloud risk."],[5,"BYOD containerization:",["Gives the organization full control of all personal photos and messages on the device","Blocks all personal apps from being installed on the employee's device","Encrypts only the device's operating system and leaves apps unprotected","Separates corporate data from personal data so corporate data can be wiped"],3,"It protects corporate data on personal devices."],[5,"Visitor management controls should include:",["Registration, visitor badges and escorts","Open access to all areas","Unrecorded entry for known visitors","Shared badges"],0,"Visitors need identification, tracking and supervision."],[5,"HVAC redundancy in a data center is important because:",["It reduces the need for backups because systems stay online longer","Cooling failure can force equipment to shut down and cause outages","It improves network speed by keeping cables at a lower temperature","It prevents all fires by removing heat from the equipment room"],1,"Environmental failures cause outages."],[5,"A caller impersonating an executive asks the help desk to reset a password. Which control is BEST?",["Resetting the password at once to avoid upsetting the executive concerned","Asking the caller to describe the executive's role and recent travel plans","Verification procedures using call-back to known numbers and required approvals","Resetting it if the caller knows the executive's name and department"],2,"Verification through trusted channels defeats impersonation."],[5,"Incident severity classification primarily:",["Determines response priority, escalation and communication needs","Assigns blame for the incident to the team that owns the affected system","Replaces the need to report incidents to the security team","Reduces the number of incidents that occur in the following year"],0,"Severity drives the response."],[5,"A write blocker is used in forensics to:",["Speed up the process of copying large volumes of evidence from the media","Encrypt the evidence automatically while it is being collected","Prevent changes to the original media while it is copied","Delete suspicious files from the media before analysis begins"],2,"It preserves the original evidence."],[5,"A red team exercise differs from a typical penetration test because it:",["Only scans systems for known vulnerabilities and reports the results","Is performed by internal audit staff using the standard audit program","Tests only the physical locks and entry controls of a facility","Simulates a real adversary against people, processes and technology"],3,"Red teams test detection and response end to end."],[5,"Which combination BEST informs the priority given to a vulnerability?",["Severity score plus exploitability, exposure and asset criticality","The age of the vulnerability alone, with the oldest fixed first","The number of systems that appear in the asset inventory","The vendor's marketing rating of the product's overall security"],0,"Prioritize by real risk."],[5,"A vulnerability is being actively exploited and affects internet-facing servers. What is BEST?",["Wait for the next monthly patch cycle and test the patch fully first","Apply an emergency patch or mitigation outside the normal cycle","Accept the risk because patching may cause disruption to the services","Patch only after an incident has occurred and the impact is known"],1,"Active exploitation justifies emergency action."],[5,"Vendor remote access to systems is BEST controlled by:",["A shared VPN account that all vendor staff use when they need access","Permanent access with no monitoring, since vendors are trusted partners","Email approval from any manager, with no limit on duration of access","A jump host or privileged access management with approval, recording and expiry"],3,"Third-party access must be limited and observable."],[5,"Why should executives receive security awareness training?",["They are the only group in the organization that needs this training","They never click on phishing emails because of their experience","Training is relevant only to technical staff who manage systems","They are targeted by tailored attacks and often have broad access"],3,"Executives are high-value targets."],[5,"A data subject requests a copy of their personal data. What is needed?",["Ignoring the request until it has been repeated at least twice","A documented process to verify identity, find the data and respond on time","Providing the data to anyone who asks, without further checks","Deleting the data without responding, to avoid disclosure risks"],1,"Rights requests need a defined process."],[5,"A privacy impact assessment should be performed:",["After the first complaint about the new system is received from a customer","Only when a regulator asks the organization for the assessment","Once the system has been retired, as part of the closure review","Before introducing a new system or process that handles personal data"],3,"Assess privacy risk before the processing starts."],[5,"Which handling rule BEST matches data classified as confidential?",["Stored on a shared drive that is open to all staff to encourage collaboration","Sent by regular email without protection to speed up communication","Printed and left on desks so that it is available for easy reference","Encrypted in transit and at rest, with access limited to authorized roles"],3,"Controls must match the classification."],[5,"In cloud storage where physical disks cannot be wiped by the customer, secure disposal is BEST achieved by:",["Deleting files and emptying the recycle bin of the storage account","Closing the account and relying on the provider to clear the disks","Reformatting the virtual disk and creating a new volume on it","Cryptographic erasure by destroying the encryption keys"],3,"Without keys, encrypted data is unreadable."],[5,"Access to backups should be:",["Limited to authorized personnel and monitored","Open to all IT staff to ensure that restores are not delayed","Shared through a common account that operators use when needed","Unrestricted to speed up restores in emergency situations"],0,"Backups contain the same data as production."],[5,"A security officer who reviews their own access changes creates a problem because:",["It breaks segregation of duties","It makes reviews faster","It reduces accountability for others","It is required by standards"],0,"Self-review is not independent."],[5,"Which approach BEST tests whether staff follow a clean desk policy?",["Unannounced spot checks with results reported to management","An annual email reminder to all staff about the clean desk policy","A review of the policy document by the compliance function","Asking staff to sign an acknowledgment when they join the organization"],0,"Checks show actual behavior."],[5,"Mobile applications that handle sensitive data should:",["Use secure storage, encrypted communication and strong authentication","Store data in plain text locally so that the application runs faster","Use shared credentials across users to simplify support","Allow unrestricted access to the device's data and other applications"],0,"Protect data on and from the device."],[5,"The PRIMARY purpose of security metrics for management is to:",["Increase the number of reports that the security team produces","Replace audits and independent assurance activities","Show how many staff work in the security function over time","Support risk-based decisions and show whether controls are effective"],3,"Metrics inform decisions."]]}};
var NOTES = [{"n":1,"name":"Auditing Information Systems","weight":"18%","html":"<p class=\"lead\">This domain tests how an IS auditor plans, performs and reports an audit. Expect questions on independence, risk-based planning, evidence, sampling, CAATs, reporting and follow-up. Almost every question here rewards the same habit: think like an auditor who assesses and recommends, and never like the manager who fixes things.<\/p><div class=\"tip\"><strong>Must-know points<\/strong><ul><li>The auditor <b>assesses and recommends<\/b>. Management <b>decides, accepts risk and implements<\/b>.<\/li><li>Audit work is <b>risk-based<\/b>: focus effort where the risk is highest.<\/li><li><b>Independence<\/b> comes first. Never audit your own work or design the controls you will audit.<\/li><li>Evidence must be <b>sufficient, reliable and relevant<\/b>. Independent external evidence is the strongest.<\/li><li>Weak controls mean <b>more substantive testing<\/b>. Strong controls allow lighter testing.<\/li><li>Suspected fraud goes to <b>appropriate management or the audit committee<\/b>. Never confront or investigate alone.<\/li><\/ul><\/div><h3>1. The ISACA mindset<\/h3><ul><li>Answer as an <b>auditor<\/b>, not as an engineer or a manager. Auditors evaluate controls and report; they do not implement them.<\/li><li>Keywords: <b>FIRST<\/b> usually means plan, understand or assess risk before acting. <b>BEST<\/b> means the most effective, preventive or reliable choice. <b>MOST<\/b> means highest risk or impact.<\/li><li>Business objectives and risk drive every audit decision. A technically perfect answer that ignores risk is usually wrong.<\/li><li>Always report findings through the proper reporting line, even when management is uncomfortable.<\/li><\/ul><h3>2. Types of audits and engagements<\/h3><div class=\"tw\"><table><thead><tr><th>Type<\/th><th>Purpose<\/th><\/tr><\/thead><tbody><tr><td>Financial audit<\/td><td>Assess accuracy of financial statements and the controls behind t

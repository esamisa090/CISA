hem.<\/td><\/tr><tr><td>Operational audit<\/td><td>Assess efficiency and effectiveness of operations and processes.<\/td><\/tr><tr><td>Compliance audit<\/td><td>Check adherence to laws, regulations, policies and contracts.<\/td><\/tr><tr><td>Integrated audit<\/td><td>Combines financial, operational and IT audit work in one engagement.<\/td><\/tr><tr><td>IS (IT) audit<\/td><td>Evaluate IT systems, processes and controls for security, integrity and availability.<\/td><\/tr><tr><td>Forensic audit<\/td><td>Investigate fraud or crime and preserve evidence for legal use.<\/td><\/tr><tr><td>Third-party assurance<\/td><td>Reports such as SOC 1, SOC 2 and SOC 3 on a service provider's controls.<\/td><\/tr><\/tbody><\/table><\/div><h3>3. Audit charter and the audit function<\/h3><ul><li>The <b>audit charter<\/b> defines the audit function's purpose, authority, responsibility and accountability. It is approved by the <b>board or audit committee<\/b>, not by the auditee.<\/li><li>The <b>annual audit plan<\/b> is built from a <b>risk assessment<\/b> of the audit universe (all auditable areas), with resources and timing matched to risk.<\/li><li>The audit function should report <b>functionally to the board or audit committee<\/b> to protect independence.<\/li><li>Quality assurance covers supervision, workpaper review and periodic internal and external assessments of the audit function.<\/li><\/ul><h3>4. Standards, ethics and independence<\/h3><ul><li>Auditors follow the <b>ISACA Code of Professional Ethics<\/b> and audit standards: integrity, objectivity, confidentiality, competence, due professional care and truthful reporting.<\/li><li><b>Organizational independence<\/b>: reporting line to the board or audit committee. <b>Professional independence<\/b>: unbiased attitude and conduct.<\/li><li><b>Threats to independence<\/b>: self-review (auditing what you designed), familiarity, advocacy, intimidation, and financial or personal interests.<\/li><li>If independence is impaired, disclose it to the audit manager or committee. Do not accept roles that conflict with audit work.<\/li><li>Auditors must keep audit information <b>confidential<\/b> and use it only for audit purposes.<\/li><li>Competence: if the auditor lacks skills (for example a new technology), get a qualified specialist and review their work, but the auditor stays responsible for the opinion.<\/li><\/ul><h3>4a. Audit process at a glance<\/h3><div class=\"tw\"><table><thead><tr><th>Step<\/th><th>What happens<\/th><\/tr><\/thead><tbody><tr><td>1. Planning<\/td><td>Define scope and objectives, understand the business and process, assess risk, set the audit program.<\/td><\/tr><tr><td>2. Fieldwork<\/td><td>Gather evidence through inquiry, observation, inspection, re-performance and testing.<\/td><\/tr><tr><td>3. Analysis<\/td><td>Evaluate evidence against criteria, form conclusions, rate findings.<\/td><\/tr><tr><td>4. Reporting<\/td><td>Discuss findings with the auditee, issue the report with management responses.<\/td><\/tr><tr><td>5. Follow-up<\/td><td>Verify that agreed actions were actually completed.<\/td><\/tr><\/tbody><\/table><\/div><p class=\"small\">Scope and objectives come first. Understanding the process (for example by walkthrough) comes before testing.<\/p><h3>5. Risk-based auditing<\/h3><ul><li><b>Audit risk<\/b> is the risk of giving a wrong opinion. Audit risk = Inherent risk x Control risk x Detection risk.<\/li><li>Higher inherent or control risk means the auditor must lower <b>detection risk<\/b> by doing <b>more or stronger testing<\/b>.<\/li><li>Use a <b>risk assessment<\/b> to rank areas for the audit plan, considering impact, likelihood, past findings, change and regulatory exposure.<\/li><li><b>Materiality<\/b> has a financial and a qualitative side. A small amount can still be material if it hides fraud, a legal breach or a control failure.<\/li><li>Several small weaknesses in one area can be material <b>in aggregate<\/b>. Consider their combined effect.<\/li><\/ul><div class=\"tw\"><table><thead><tr><th>Risk<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Inherent risk<\/td><td>Risk of a material error before considering any controls.<\/td><\/tr><tr><td>Control risk<\/td><td>Risk that controls will not prevent or detect a material error in time.<\/td><\/tr><tr><td>Detection risk<\/td><td>Risk that the auditor's procedures fail to detect a material error.<\/td><\/tr><tr><td>Sampling risk<\/td><td>Risk the sample does not represent the population.<\/td><\/tr><tr><td>Non-sampling risk<\/td><td>Risk from wrong methods, misreading evidence or poor judgment.<\/td><\/tr><tr><td>Residual risk<\/td><td>Risk remaining after controls are applied.<\/td><\/tr><\/tbody><\/table><\/div><h3>6. Controls<\/h3><div class=\"tw\"><table><thead><tr><th>Control type<\/th><th>Role<\/th><th>Examples<\/th><\/tr><\/thead><tbody><tr><td>Preventive<\/td><td>Stop problems before they occur.<\/td><td>Access restrictions, edit checks, segregation of duties, approvals.<\/td><\/tr><tr><td>Detective<\/td><td>Find problems after they occur.<\/td><td>Exception reports, reconciliations, log reviews, audit trails.<\/td><\/tr><tr><td>Corrective<\/td><td>Fix problems and reduce impact.<\/td><td>Backup restore, incident response, patching.<\/td><\/tr><tr><td>Deterrent<\/td><td>Discourage violations.<\/td><td>Warning banners, policies, visible cameras.<\/td><\/tr><tr><td>Compensating<\/td><td>Offset a missing or weak control.<\/td><td>Management review where duties cannot be separated.<\/td><\/tr><\/tbody><\/table><\/div><ul><li><b>General controls<\/b> cover the IT environment (access, change, operations, backup). <b>Application controls<\/b> sit inside a process (input, processing, output).<\/li><li>Test <b>design<\/b> (is the control suitable?) and <b>operating effectiveness<\/b> (did it work consistently over the period?).<\/li><li>A control that can be <b>bypassed<\/b> is not effective unless a compensating control exists.<\/li><li>When duties cannot be separated, rely on compensating controls such as independent review of exception reports.<\/li><\/ul><h3>7. Audit evidence<\/h3><ul><li>Evidence must be <b>sufficient<\/b> (enough), <b>reliable<\/b> (trustworthy), <b>relevant<\/b> (related to the objective) and <b>useful<\/b>.<\/li><li><b>Reliability ranking<\/b> (strongest to weakest): independent external confirmation, then evidence from strong internal controls, then evidence the auditor obtains directly, then documents, then management representations and interview answers alone.<\/li><li>System-generated reports used as evidence need a check of <b>completeness and accuracy<\/b> (source, parameters, logic).<\/li><li>If people describe a control differently from the written procedure, perform a <b>walkthrough or test<\/b> to see how it truly works.<\/li><li>Management claims that a finding is fixed need <b>independent verification<\/b> before closing.<\/li><\/ul><div class=\"tw\"><table><thead><tr><th>Technique<\/th><th>What it is<\/th><\/tr><\/thead><tbody><tr><td>Inquiry<\/td><td>Asking questions. Useful but the weakest evidence on its own.<\/td><\/tr><tr><td>Observation<\/td><td>Watching a process being performed.<\/td><\/tr><tr><td>Inspection<\/td><td>Examining records, documents or systems.<\/td><\/tr><tr><td>Re-performance<\/td><td>The auditor repeats the control or calculation independently.<\/td><\/tr><tr><td>Recalculation<\/td><td>Checking arithmetic accuracy.<\/td><\/tr><tr><td>Confirmation<\/td><td>Obtaining direct written answers from independent third parties.<\/td><\/tr><tr><td>Analytical procedures<\/td><td>Comparing trends and ratios to find unusual items.<\/td><\/tr><\/tbody><\/table><\/div><h3>8. Sampling<\/h3><ul><li><b>Compliance tests<\/b> check whether controls exist and work. <b>Substantive tests<\/b> check the accuracy, completeness and validity of the data itself.<\/li><li>If compliance tests show weak controls, <b>increase substantive testing<\/b>.<\/li><li><b>Statistical sampling<\/b> lets the auditor measure sampling risk objectively. <b>Judgmental sampling<\/b> relies on the auditor's choice.<\/li><\/ul><div class=\"tw\"><table><thead><tr><th>Method<\/th><th>Use<\/th><\/tr><\/thead><tbody><tr><td>Attribute sampling<\/td><td>Compliance testing. Estimates how often a control or condition occurs (yes or no).<\/td><\/tr><tr><td>Variable sampling<\/td><td>Substantive testing. Estimates monetary amounts or numeric values.<\/td><\/tr><tr><td>Stratified sampling<\/td><td>Splits the population into groups to reduce variability and sample size.<\/td><\/tr><tr><td>Discovery sampling<\/td><td>Looks for at least one critical item (fraud, unauthorized vendor) when expected errors are near zero.<\/td><\/tr><tr><td>Systematic sampling<\/td><td>Every nth item. Watch for patterns in the population that bias results.<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tip\"><strong>Sample size rules<\/strong><ul><li>Higher required <b>confidence<\/b> means a larger sample.<\/li><li>Higher <b>tolerable error<\/b> means a smaller sample.<\/li><li>Higher <b>expected error<\/b> means a larger sample.<\/li><li>Population size has little effect on sample size once the population is large.<\/li><li>If the sample error rate exceeds the tolerable rate, the control cannot be relied on.<\/li><\/ul><\/div><h3>9. CAATs, data analytics and continuous auditing<\/h3><ul><li><b>CAATs<\/b> let the auditor test whole populations, find duplicates or gaps, and re-perform calculations. Typical tools: generalized audit software, test data, integrated test facility, parallel simulation, embedded audit modules, snapshots.<\/li><li>Before using CAATs on production data, get <b>read-only access or a copy<\/b> and confirm the data's <b>completeness and integrity<\/b>.<\/li><li><b>Embedded audit modules<\/b> monitor transactions in real time and flag exceptions for continuous auditing.<\/li><li><b>Continuous auditing<\/b> (done by the auditor) shortens the time between a control failure and its detection. <b>Continuous monitoring<\/b> is done by management.<\/li><li><b>Control self-assessment (CSA)<\/b> raises process-owner ownership of controls and surfaces risks early. It does not replace independent audit.<\/li><\/ul><h3>10. Fieldwork and documentation<\/h3><ul><li>Workpapers must let an <b>independent reviewer<\/b> follow the work, the evidence and the conclusions.<\/li><li>Supervisors review workpapers. Workpapers belong to the audit function and stay confidential.<\/li><li>Document scope, procedures, evidence, findings and conclusions. Retain according to policy and law.<\/li><\/ul><h3>11. Reporting and follow-up<\/h3><ul><li>A finding has five parts: <b>condition<\/b> (what was found), <b>criteria<\/b> (the standard), <b>cause<\/b>, <b>effect<\/b> (the risk) and <b>recommendation<\/b>.<\/li><li>A report states scope, objectives, period, findings, conclusions, recommendations and any <b>limitations<\/b>.<\/li><li>Discuss findings with the auditee <b>before issuing<\/b> to confirm facts, not to negotiate the conclusion.<\/li><li>Include <b>management's response<\/b> and target dates. Planned remediation does not remove a finding.<\/li><li>If management disagrees but the evidence supports the finding, keep it and report both views.<\/li><li>If management accepts a risk the auditor thinks is too high, <b>escalate<\/b> to senior management or the audit committee. Risk acceptance must be made and documented at the right level.<\/li><li>A <b>scope limitation<\/b> (for example denied access) is escalated, and disclosed in the report if unresolved.<\/li><li>Report significant weaknesses promptly. Do not wait for the final report.<\/li><li><b>Follow-up<\/b> verifies independently that agreed corrective actions were completed.<\/li><\/ul><h3>12. Fraud and illegal acts<\/h3><ul><li>Management is responsible for preventing and detecting fraud. The auditor evaluates fraud risk and stays alert to red flags.<\/li><li>Fraud triangle: <b>pressure, opportunity, rationalization<\/b>.<\/li><li>If fraud is suspected, <b>do not confront<\/b> anyone. Preserve evidence and report to the appropriate level or the audit committee per policy.<\/li><li>If senior management is involved (for example a control override by the CFO), report to the <b>audit committee or board<\/b>.<\/li><li>An audit gives <b>reasonable, not absolute<\/b> assurance. It cannot guarantee that no fraud exists.<\/li><\/ul><h3>13. Third-party and service organization assurance<\/h3><div class=\"tw\"><table><thead><tr><th>Report<\/th><th>Focus<\/th><\/tr><\/thead><tbody><tr><td>SOC 1<\/td><td>Controls relevant to the customer's financial reporting.<\/td><\/tr><tr><td>SOC 2<\/td><td>Security, availability, processing integrity, confidentiality and privacy controls.<\/td><\/tr><tr><td>SOC 3<\/td><td>Public, summarized version of a SOC 2.<\/td><\/tr><tr><td>Type I<\/td><td>Design of controls at a point in time.<\/td><\/tr><tr><td>Type II<\/td><td>Design and operating effectiveness over a period.<\/td><\/tr><\/tbody><\/table><\/div><ul><li>When relying on a SOC report, check the <b>period covered<\/b>, the <b>scope<\/b>, <b>exceptions<\/b> noted, and the <b>complementary user-entity controls<\/b> the customer must perform.<\/li><li>Outsourcing does not transfer accountability. A <b>right-to-audit<\/b> clause is a key contract term.<\/li><li>When relying on other auditors or experts, assess their competence and independence and review their work.<\/li><\/ul><div class=\"tip warn\"><strong>Common exam traps in Domain 1<\/strong><ul><li>Choosing to <b>test or fix<\/b> before planning or understanding the process.<\/li><li>Letting the auditee or management <b>remove or soften<\/b> a valid finding.<\/li><li>Accepting <b>management representations<\/b> or interviews as enough evidence.<\/li><li>Picking an answer where the auditor <b>implements<\/b> a control, selects a tool or designs the solution.<\/li><li>Confronting a suspect instead of <b>reporting through the proper channel<\/b>.<\/li><li>Confusing <b>attribute sampling<\/b> (controls, yes or no) with <b>variable sampling<\/b> (amounts).<\/li><li>Forgetting that <b>independent external<\/b> evidence beats internal or verbal evidence.<\/li><\/ul><\/div>"},{"n":2,"name":"Governance and Management of IT","weight":"18%","html":"<p class=\"lead\">This domain tests whether IT is directed and managed so that it supports the business. Expect questions on strategy alignment, committees and roles, frameworks, policies, segregation of duties, risk management, outsourcing and performance measurement. The recurring theme is that senior management and the board own IT governance, and the auditor checks that it works.<\/p><div class=\"tip\"><strong>Must-know points<\/strong><ul><li><b>Governance<\/b> evaluates, directs and monitors (board). <b>Management<\/b> plans, builds, runs and monitors (executives).<\/li><li>IT strategy must <b>align with business strategy<\/b>, and the business must be involved.<\/li><li><b>Senior management owns risk acceptance and policy approval.<\/b> You can outsource a task, never accountability.<\/li><li>Treat risk in four ways: <b>mitigate, avoid, transfer, accept<\/b>. Residual risk must fit the risk appetite.<\/li><li><b>Segregation of duties<\/b> and compensating controls are heavily tested.<\/li><li>Before outsourcing: business case and due diligence. In the contract: <b>right to audit<\/b>, SLAs, security, escrow, exit plan.<\/li><\/ul><\/div><h3>1. Governance versus management<\/h3><ul><li><b>Governance<\/b> is the board's job: set direction, evaluate performance and monitor results.<\/li><li><b>Management<\/b> turns that direction into plans, projects and daily operations.<\/li><li>Governance goals: <b>strategic alignment, value delivery, risk management, resource management and performance measurement<\/b>.<\/li><li>Value comes from <b>benefits realization<\/b>: tracking whether IT investments deliver what the business case promised.<\/li><li>The board's key IT responsibility is to <b>set direction and oversee that IT delivers business value<\/b>.<\/li><\/ul><h3>2. Roles and committees<\/h3><div class=\"tw\"><table><thead><tr><th>Role or body<\/th><th>Main responsibility<\/th><\/tr><\/thead><tbody><tr><td>Board of directors<\/td><td>Sets direction, oversees IT value and risk, approves strategy at the top level.<\/td><\/tr><tr><td>Executive management<\/td><td>Implements the strategy, owns policy approval and risk acceptance.<\/td><\/tr><tr><td>IT strategy committee<\/td><td>Advises the board on IT strategy and alignment with the business.<\/td><\/tr><tr><td>IT steering committee<\/td><td>Senior business and IT leaders who prioritize projects, approve major spending and monitor delivery.<\/td><\/tr><tr><td>CIO<\/td><td>Leads IT delivery and operations.<\/td><\/tr><tr><td>CISO / security officer<\/td><td>Leads security governance. Should be independent of IT operations where possible.<\/td><\/tr><tr><td>Data owner<\/td><td>Decides classification and who may access the data.<\/td><\/tr><tr><td>Data custodian<\/td><td>Implements and maintains controls protecting the data for the owner.<\/td><\/tr><tr><td>Process owner<\/td><td>Responsible for a business process and its controls.<\/td><\/tr><tr><td>IS auditor<\/td><td>Gives independent assurance. Does not own or implement controls.<\/td><\/tr><\/tbody><\/table><\/div><p class=\"small\">The three lines model: operations and management (first), risk and compliance (second), internal audit (third, independent).<\/p><h3>3. Frameworks and standards<\/h3><div class=\"tw\"><table><thead><tr><th>Framework<\/th><th>What it is for<\/th><\/tr><\/thead><tbody><tr><td>COBIT<\/td><td>ISACA framework for governance and management of enterprise IT.<\/td><\/tr><tr><td>ITIL<\/td><td>Best practice for IT service management.<\/td><\/tr><tr><td>ISO/IEC 27001 and 27002<\/td><td>Information security management system (requirements) and control guidance.<\/td><\/tr><tr><td>ISO 31000<\/td><td>Risk management principles and process.<\/td><\/tr><tr><td>COSO<\/td><td>Internal control and enterprise risk management.<\/td><\/tr><tr><td>ISO/IEC 38500<\/td><td>Corporate governance of IT.<\/td><\/tr><tr><td>NIST CSF<\/td><td>Cybersecurity risk management framework.<\/td><\/tr><tr><td>CMMI<\/td><td>Process maturity and improvement.<\/td><\/tr><tr><td>TOGAF, Zachman<\/td><td>Enterprise architecture.<\/td><\/tr><tr><td>PMBOK, PRINCE2<\/td><td>Project management.<\/td><\/tr><tr><td>ISO 22301<\/td><td>Business continuity management.<\/td><\/tr><\/tbody><\/table><\/div><h3>4. Strategy, planning and performance<\/h3><ul><li>The <b>IT strategic plan<\/b> is long term (typically 3 to 5 years) and linked to the approved business plan. Tactical and operational plans follow from it.<\/li><li>An approved IT plan that is <b>linked to the business plan<\/b> is the best sign of alignment.<\/li><li><b>Portfolio management<\/b> prioritizes projects by business value and risk, not by who asks loudest.<\/li><li><b>Business cases<\/b> justify investment and are the baseline for benefits tracking.<\/li><li><b>Enterprise architecture<\/b> describes current and target IT structure so IT assets fit business needs and complexity is reduced.<\/li><\/ul><div class=\"tw\"><table><thead><tr><th>Tool<\/th><th>Purpose<\/th><\/tr><\/thead><tbody><tr><td>Balanced scorecard<\/td><td>Measures performance from several perspectives: financial, customer, internal process, learning and growth.<\/td><\/tr><tr><td>KPI / KGI / CSF<\/td><td>Key performance indicators, key goal indicators and critical success factors.<\/td><\/tr><tr><td>Maturity model<\/td><td>Rates process maturity. Levels run from ad hoc, to repeatable, defined, managed and optimized.<\/td><\/tr><tr><td>Benchmarking<\/td><td>Compares performance with peers or standards.<\/td><\/tr><tr><td>RACI matrix<\/td><td>Clarifies who is responsible, accountable, consulted and informed.<\/td><\/tr><\/tbody><\/table><\/div><ul><li>A maturity rating of <b>defined<\/b> means processes are documented, standardized and communicated. <b>Optimized<\/b> means continuous improvement.<\/li><li>A claimed maturity level needs <b>evidence<\/b> from the auditor.<\/li><\/ul><h3>5. Policies, standards, procedures, guidelines<\/h3><div class=\"tw\"><table><thead><tr><th>Document<\/th><th>Nature<\/th><\/tr><\/thead><tbody><tr><td>Policy<\/td><td>High-level, mandatory statement of management intent. Approved by senior management and reviewed periodically.<\/td><\/tr><tr><td>Standard<\/td><td>Mandatory, specific requirements that support a policy.<\/td><\/tr><tr><td>Procedure<\/td><td>Step-by-step instructions for a task.<\/td><\/tr><tr><td>Guideline<\/td><td>Recommended, optional advice.<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Policies must be <b>communicated<\/b>, understood and enforced. Repeated exceptions suggest the policy or process needs review.<\/li><li>Use a <b>formal exception process<\/b> with risk acceptance, an expiry date and review.<\/li><\/ul><h3>6. Organization, segregation of duties and HR<\/h3><ul><li><b>Segregation of duties (SoD)<\/b> separates incompatible functions so one person cannot commit and hide an error or fraud.<\/li><li>Typical incompatible combinations: programmer and production access, programmer and operator, data entry and transaction authorization, security administrator and business transactions, creating an employee and approving payments.<\/li><li>When SoD is impossible, use <b>compensating controls<\/b>: independent review of exception reports, supervision, reconciliations, audit trails.<\/li><li><b>Mandatory vacations and job rotation<\/b> help detect irregularities because someone else performs the duties.<\/li><li><b>Hiring<\/b>: role-appropriate background checks, signed confidentiality terms, clear job descriptions.<\/li><li><b>Termination<\/b>: remove access <b>immediately<\/b>, recover assets, and review activity.<\/li><li>Watch for <b>key-person dependency<\/b>. Use documentation, cross-training and succession planning.<\/li><li><b>Training<\/b> should be role-based, tested and recorded.<\/li><\/ul><h3>7. Risk management<\/h3><ul><li>Steps: identify assets, threats and vulnerabilities, assess likelihood and impact, evaluate against appetite, treat, then monitor and report.<\/li><li><b>Risk = likelihood x impact.<\/b> Assessment can be qualitative (ratings) or quantitative (money).<\/li><li><b>Quantitative formulas<\/b>: Single loss expectancy (SLE) = asset value x exposure factor. Annual loss expectancy (ALE) = SLE x annual rate of occurrence (ARO).<\/li><li><b>Risk appetite<\/b> is the amount and type of risk the organization will accept to reach its goals. <b>Tolerance<\/b> is the acceptable deviation around it.<\/li><li><b>Residual risk<\/b> is what remains after controls. If it exceeds appetite, apply further treatment or get a formal decision from senior management.<\/li><li><b>Key risk indicators (KRIs)<\/b> give early warning that risk is nearing tolerance. A <b>risk register<\/b> records risks, owners and treatments.<\/li><\/ul><div class=\"tw\"><table><thead><tr><th>Treatment<\/th><th>Meaning<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td>Mitigate<\/td><td>Reduce likelihood or impact.<\/td><td>Add a control, patch, add redundancy.<\/td><\/tr><tr><td>Avoid<\/td><td>Stop the risky activity.<\/td><td>Discontinue a product line.<\/td><\/tr><tr><td>Transfer or share<\/td><td>Pass the financial impact to another party.<\/td><td>Insurance, outsourcing, contractual terms.<\/td><\/tr><tr><td>Accept<\/td><td>Knowingly keep the risk.<\/td><td>Formal decision by senior management, documented.<\/td><\/tr><\/tbody><\/table><\/div><h3>8. Outsourcing and third parties<\/h3><ul><li><b>Before<\/b> outsourcing: build the business case, define requirements, perform due diligence and assess risk.<\/li><li><b>Contract<\/b> should include: SLAs with measurable metrics, <b>right to audit<\/b>, security and privacy requirements, ownership of deliverables and IP, source code escrow, incident notification times, data location, subcontracting rules, business continuity, and an exit or transition plan.<\/li><li><b>Ongoing<\/b>: monitor SLAs through independently verified data, review SOC reports, and perform audits.<\/li><li><b>Accountability stays with the organization<\/b> even when a provider processes the data.<\/li><li><b>Offshoring<\/b> adds legal, privacy, cross-border and geopolitical risk.<\/li><li><b>Cloud<\/b>: responsibilities are shared. In IaaS the customer manages the operating system and above. In SaaS the customer remains responsible for its data and access management.<\/li><li>A merchant that stores cardholder data stays responsible for protecting it, even if payments are processed by a third party.<\/li><\/ul><h3>9. IT management practices<\/h3><ul><li><b>Quality management<\/b>: quality assurance checks processes comply with standards; quality control checks the output.<\/li><li><b>Financial management<\/b>: budgets, chargeback, total cost of ownership and return on investment. Repeated budget overruns point to weak estimating and oversight.<\/li><li><b>Capacity and performance management<\/b> ensure resources meet current and future demand.<\/li><li><b>Asset management<\/b>: keep an inventory of information assets so they can be classified, owned and protected.<\/li><\/ul><h3>10. Legal, regulatory and privacy<\/h3><ul><li>Management is responsible for <b>identifying applicable laws<\/b> and ensuring compliance. The auditor reviews that process.<\/li><li>Common privacy principles: lawful basis or consent, <b>purpose limitation<\/b>, data minimization, accuracy, storage limitation, security, accountability, individual rights, breach notification and controls on cross-border transfer.<\/li><li>Using personal data for a new purpose needs a legal basis or fresh consent.<\/li><\/ul><h3>11. Business continuity governance<\/h3><ul><li>Senior management owns the business continuity policy and approves the plan. Details are in Domain 4.<\/li><li>A plan that is not updated after major change (for example a merger) no longer reflects the business.<\/li><\/ul><h3>12. What the auditor checks in IT governance<\/h3><ul><li>A documented, approved IT strategy linked to the business plan.<\/li><li>Committee minutes showing real decisions, priorities and follow-up.<\/li><li>Defined roles, decision rights and reporting lines (organization chart, RACI).<\/li><li>Current policies, an exception process and evidence of communication.<\/li><li>A risk register, KRIs and clear risk acceptance records.<\/li><li>Performance metrics and benefits tracking against business cases.<\/li><li>Outsourcing contracts, SLA reports and right-to-audit clauses.<\/li><\/ul><div class=\"tip warn\"><strong>Common exam traps in Domain 2<\/strong><ul><li>Letting <b>IT alone<\/b> set strategy, or letting IT staff approve policy.<\/li><li>Believing that <b>outsourcing transfers accountability<\/b>.<\/li><li>Treating the <b>auditor<\/b> as the one who accepts risk or approves policy.<\/li><li>Confusing <b>data owner<\/b> (classifies, approves access) with <b>custodian<\/b> (protects).<\/li><li>Ignoring <b>compensating controls<\/b> when duties cannot be separated.<\/li><li>Mixing up <b>risk avoidance<\/b> (stop the activity) with <b>transfer<\/b> (insurance).<\/li><li>Choosing a technical answer when the question is about <b>governance or alignment<\/b>.<\/li><\/ul><\/div>"},{"n":3,"name":"Information Systems Acquisition, Development and Implementation","weight":"12%","html":"<p class=\"lead\">This domain tests how systems are justified, acquired, built, tested and put into production, and how the auditor evaluates those steps. Expect questions on project governance, the SDLC, testing types, data conversion, cutover methods, change control and application controls. The auditor's role is to confirm that business needs, controls and approvals are built in from the start.<\/p><div class=\"tip\"><strong>Must-know points<\/strong><ul><li>Projects fail mostly from <b>weak senior management support and poor user involvement<\/b>.<\/li><li>The <b>business owner and users<\/b> sign off requirements and accept the system (UAT). Developers do not.<\/li><li><b>Developers must not move their own code to production.<\/b> A separate release function does.<\/li><li>A <b>post-implementation review<\/b> checks whether objectives and benefits were achieved.<\/li><li><b>Parallel<\/b> cutover is lowest risk but costly. <b>Big bang<\/b> has no fallback.<\/li><li>Build <b>controls and security into the SDLC<\/b>, not after release.<\/li><\/ul><\/div><h3>1. Project governance and management<\/h3><ul><li>A <b>business case<\/b> justifies the investment and is the baseline for benefits realization.<\/li><li>A <b>feasibility study<\/b> (technical, economic, operational) is done at <b>project initiation<\/b>.<\/li><li>The <b>steering committee<\/b> (senior business and IT) approves scope, priorities and funding, and decides continue, rescope or stop when problems appear.<\/li><li>The <b>project manager<\/b> plans and controls schedule, cost and scope. The <b>sponsor<\/b> is accountable for business outcomes. A <b>PMO<\/b> sets standards across projects.<\/li><li>If a project has consumed most of its budget but is far behind, <b>re-baseline and reassess the business case<\/b> before more spending.<\/li><li><b>Stage gates<\/b> (phase-end reviews) catch problems early. Without them, issues compound.<\/li><li><b>Scope creep<\/b> is controlled by <b>formal change control<\/b> and impact analysis of every requested change.<\/li><\/ul><div class=\"tw\"><table><thead><tr><th>Tool<\/th><th>Purpose<\/th><\/tr><\/thead><tbody><tr><td>Critical path (CPM)<\/td><td>Longest chain of dependent tasks. Sets the minimum project duration. Delays on it delay the project.<\/td><\/tr><tr><td>Gantt chart<\/td><td>Shows tasks, durations and dependencies over time.<\/td><\/tr><tr><td>PERT<\/td><td>Time estimates using optimistic, most likely and pessimistic values.<\/td><\/tr><tr><td>Function point analysis<\/td><td>Estimates software size from delivered functionality.<\/td><\/tr><tr><td>Earned value<\/td><td>Compares work done with plan and cost to show progress and cost control.<\/td><\/tr><\/tbody><\/table><\/div><h3>2. System development life cycle (SDLC)<\/h3><div class=\"tw\"><table><thead><tr><th>Phase<\/th><th>Key activities and audit focus<\/th><\/tr><\/thead><tbody><tr><td>1. Feasibility<\/td><td>Business case, alternatives, cost-benefit. Confirm management approval.<\/td><\/tr><tr><td>2. Requirements<\/td><td>Gather and document business and security requirements. Users sign off.<\/td><\/tr><tr><td>3. Design<\/td><td>Architecture, data and interface design. Controls and audit trails designed in.<\/td><\/tr><tr><td>4. Development<\/td><td>Coding or configuration. Version control, coding standards, code review.<\/td><\/tr><tr><td>5. Testing<\/td><td>Unit, integration, system and user acceptance testing. Defects tracked and resolved.<\/td><\/tr><tr><td>6. Implementation<\/td><td>Data conversion, training, cutover, go-live approval.<\/td><\/tr><tr><td>7. Post-implementation<\/td><td>Review benefits, lessons learned, ongoing support.<\/td><\/tr><tr><td>8. Disposal<\/td><td>Retire the system, archive or destroy data securely.<\/td><\/tr><\/tbody><\/table><\/div><ul><li><b>Users must be involved in requirements<\/b>. If they were not, the system may not meet needs and may be rejected.<\/li><li><b>Security and control requirements<\/b> are defined early, because retrofitting is expensive and weak.<\/li><li>Auditors may review during development (a preimplementation review) but should not take on design responsibility, which would impair independence.<\/li><\/ul><h3>3. Development approaches<\/h3><div class=\"tw\"><table><thead><tr><th>Approach<\/th><th>Key idea<\/th><th>Audit concern<\/th><\/tr><\/thead><tbody><tr><td>Waterfall<\/td><td>Sequential phases with sign-offs.<\/td><td>Late discovery of requirement errors.<\/td><\/tr><tr><td>Iterative / spiral<\/td><td>Repeated cycles with risk review.<\/td><td>Scope drift, control of versions.<\/td><\/tr><tr><td>Agile (Scrum)<\/td><td>Short iterations, frequent user feedback, working software.<\/td><td>Little formal documentation, so check that approvals, testing and change tracking are evidenced in tools.<\/td><\/tr><tr><td>DevOps / DevSecOps<\/td><td>Automated build, test and release with security built in.<\/td><td>Segregation of duties in pipelines, approvals for releases.<\/td><\/tr><tr><td>Prototyping<\/td><td>Build a rough model to refine requirements.<\/td><td>Prototype pushed into production with weak controls and documentation.<\/td><\/tr><tr><td>RAD<\/td><td>Fast development with prototypes and reusable parts.<\/td><td>Reduced documentation and testing.<\/td><\/tr><tr><td>BPR<\/td><td>Redesign business processes, then supporting systems.<\/td><td>Controls lost during redesign.<\/td><\/tr><\/tbody><\/table><\/div><h3>4. Acquisition and vendor management<\/h3><ul><li>Decide build versus buy using requirements, cost, risk and vendor capability.<\/li><li><b>RFP evaluation<\/b>: fit to requirements, vendor viability, security, support and <b>total cost of ownership<\/b>.<\/li><li><b>Contract<\/b>: SLAs, support, warranties, IP, security terms and <b>source code escrow<\/b>, which protects the customer if the vendor fails.<\/li><li><b>Heavy customization<\/b> of a package makes upgrades and patches difficult and may end vendor support.<\/li><li>Legal review and software licensing compliance are part of acquisition.<\/li><\/ul><h3>5. Testing<\/h3><div class=\"tw\"><table><thead><tr><th>Test<\/th><th>Purpose<\/th><\/tr><\/thead><tbody><tr><td>Unit testing<\/td><td>Individual programs or modules, usually by developers (white-box).<\/td><\/tr><tr><td>Integration testing<\/td><td>Modules work together and exchange data correctly.<\/td><\/tr><tr><td>System testing<\/td><td>Whole system meets requirements, including performance and security.<\/td><\/tr><tr><td>Interface testing<\/td><td>Data passes correctly between systems.<\/td><\/tr><tr><td>User acceptance testing (UAT)<\/td><td>Users confirm the system meets business needs. Final test before approval.<\/td><\/tr><tr><td>Regression testing<\/td><td>Changes did not break existing functions.<\/td><\/tr><tr><td>Stress / load testing<\/td><td>Behavior under heavy volume or beyond limits.<\/td><\/tr><tr><td>Sociability testing<\/td><td>System works in the target environment alongside other software.<\/td><\/tr><tr><td>Parallel testing<\/td><td>Old and new systems run the same data to compare results.<\/td><\/tr><tr><td>Pilot<\/td><td>Rolled out to a small group first.<\/td><\/tr><tr><td>White-box / black-box<\/td><td>White-box uses knowledge of internal code. Black-box tests inputs and outputs only.<\/td><\/tr><\/tbody><\/table><\/div><ul><li><b>Test data<\/b> should not contain live personal data unless masked. Test and production environments should be <b>separate<\/b>.<\/li><li><b>Defects<\/b> are logged, prioritized and retested. Go-live with known critical defects needs a fix or a <b>formal risk acceptance with a rollback plan<\/b>.<\/li><li><b>Security testing<\/b>, such as secure code review and vulnerability testing, belongs inside the lifecycle.<\/li><li><b>Final approval to move to production<\/b> comes from the business owner, based on test results.<\/li><\/ul><h3>6. Data conversion and migration<\/h3><ul><li>Cleanse and map source data, then convert, then reconcile.<\/li><li><b>Completeness<\/b>: reconcile record counts and control totals between old and new systems.<\/li><li><b>Accuracy<\/b>: validate transformed fields against source data, with business sign-off.<\/li><li>Keep source data and a <b>rollback path<\/b> until the new system is accepted.<\/li><li>Handle conversion errors through logged exception reports with follow-up.<\/li><\/ul><h3>7. Cutover (changeover) strategies<\/h3><div class=\"tw\"><table><thead><tr><th>Strategy<\/th><th>Description<\/th><th>Risk or trade-off<\/th><\/tr><\/thead><tbody><tr><td>Big bang (direct)<\/td><td>Switch all at once.<\/td><td>No fallback if the new system fails.<\/td><\/tr><tr><td>Parallel<\/td><td>Run old and new together.<\/td><td>Lowest risk, highest cost and duplicate effort.<\/td><\/tr><tr><td>Phased<\/td><td>Switch in stages or modules.<\/td><td>Longer timeline, interface complexity.<\/td><\/tr><tr><td>Pilot<\/td><td>Small group goes first.<\/td><td>Limited exposure, but may not reveal scale issues.<\/td><\/tr><\/tbody><\/table><\/div><h3>8. Change, configuration and release management<\/h3><ul><li>Every change is <b>requested, assessed, approved, tested and documented<\/b> before release.<\/li><li><b>Separate duties<\/b>: developers build, an independent function releases to production. Developers should not have write access to production.<\/li><li><b>Version control<\/b> and a program library prevent untracked changes and allow rollback.<\/li><li><b>Emergency changes<\/b> follow a fast path, but are documented and approved after the fact.<\/li><li>A <b>source code comparison<\/b> or change log reconciliation detects unauthorized changes.<\/li><li><b>Post-implementation review<\/b> should be objective. A review done only by the project team lacks objectivity.<\/li><\/ul><h3>9. Application controls<\/h3><div class=\"tw\"><table><thead><tr><th>Area<\/th><th>Controls<\/th><\/tr><\/thead><tbody><tr><td>Input<\/td><td>Edit and validation checks (range, reasonableness, format, check digit, completeness), duplicate checks, sequence checks, authorization, error handling.<\/td><\/tr><tr><td>Processing<\/td><td>Run-to-run totals, limit checks, reconciliations, exception reports, audit trails.<\/td><\/tr><tr><td>Output<\/td><td>Reconciliation to input, controlled distribution, review of exceptions, retention.<\/td><\/tr><tr><td>Data integrity<\/td><td>Referential integrity (foreign keys match primary keys), ACID properties: atomicity, consistency, isolation, durability.<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Input validation is a <b>preventive<\/b> control. Reconciliations and exception reports are <b>detective<\/b>.<\/li><li>A duplicate or sequence check best prevents a transaction being processed twice.<\/li><li><b>EDI, web and API processes<\/b> need authentication, integrity checks and audit trails for transactions in transit.<\/li><\/ul><h3>10. Post-implementation and retirement<\/h3><ul><li>A <b>post-implementation review<\/b> measures whether objectives and benefits were achieved and captures lessons learned.<\/li><li><b>System retirement<\/b>: archive required data, destroy the rest securely, remove access and update inventories.<\/li><\/ul><div class=\"tip warn\"><strong>Common exam traps in Domain 3<\/strong><ul><li>Choosing <b>developers<\/b> to perform UAT or to promote code to production.<\/li><li>Picking <b>big bang<\/b> when a safe fallback is required.<\/li><li>Confusing <b>integration<\/b> testing (modules together) with <b>regression<\/b> testing (nothing else broke).<\/li><li>Accepting go-live with <b>known critical defects<\/b> and no risk decision.<\/li><li>Treating a <b>prototype<\/b> as production-ready.<\/li><li>Forgetting that <b>users and the business owner<\/b> own requirements and acceptance.<\/li><li>Letting the <b>auditor<\/b> design the solution during development.<\/li><\/ul><\/div>"},{"n":4,"name":"Information Systems Operations and Business Resilience","weight":"26%","html":"<p class=\"lead\">This is one of the two heaviest domains. It covers how IT runs day to day (hardware, software, databases, networks, service management) and how the organization survives disruption (business continuity, disaster recovery, backups). Expect many questions on RTO and RPO, recovery sites, backup types, incident and problem management, change control and network basics.<\/p><div class=\"tip\"><strong>Must-know points<\/strong><ul><li><b>BIA comes first<\/b> in business continuity planning. It sets priorities, RTO and RPO.<\/li><li><b>RTO<\/b> is how fast to recover. <b>RPO<\/b> is how much data loss is acceptable and drives backup frequency.<\/li><li>Recovery sites from fastest to slowest: <b>hot, warm, cold<\/b>. Hot is fastest and costs the most.<\/li><li><b>Incident management<\/b> restores service. <b>Problem management<\/b> finds the root cause.<\/li><li>Backups are proven only by <b>restore tests<\/b>. Plans are proven by <b>real tests<\/b>, not just reading them.<\/li><li><b>Life safety<\/b> comes first in any disaster.<\/li><\/ul><\/div><h3>1. IT infrastructure basics<\/h3><ul><li><b>Hardware<\/b>: CPU, memory, storage, peripherals. Capacity and maintenance planning prevent outages.<\/li><li><b>Operating systems<\/b> manage resources and security. Controls cover access to system utilities, patching and hardening.<\/li><li><b>Databases<\/b> use a DBMS. In relational databases, <b>normalization<\/b> reduces redundancy, and <b>referential integrity<\/b> keeps foreign keys valid. DBA activity must be <b>logged and independently reviewed<\/b>.<\/li><li><b>Virtualization<\/b> consolidates servers, but a compromise of the hypervisor can affect every guest.<\/li><li><b>Cloud<\/b>: IaaS, PaaS and SaaS. Deployment models are public, private, hybrid and community. Responsibility is shared.<\/li><li><b>Job scheduling<\/b> controls should restrict who can change production schedules and require logging of reruns.<\/li><li><b>End-user computing<\/b> (spreadsheets, local tools) needs inventory, access, version and validation controls.<\/li><\/ul><h3>2. Networks<\/h3><div class=\"tw\"><table><thead><tr><th>OSI layer<\/th><th>Name<\/th><th>Examples<\/th><\/tr><\/thead><tbody><tr><td>7<\/td><td>Application<\/td><td>HTTP, SMTP, DNS, application gateways<\/td><\/tr><tr><td>6<\/td><td>Presentation<\/td><td>Encryption, data formats<\/td><\/tr><tr><td>5<\/td><td>Session<\/td><td>Session setup and control<\/td><\/tr><tr><td>4<\/td><td>Transport<\/td><td>TCP (connection-oriented), UDP (connectionless)<\/td><\/tr><tr><td>3<\/td><td>Network<\/td><td>IP, routers, IPsec<\/td><\/tr><tr><td>2<\/td><td>Data link<\/td><td>Switches, MAC addresses<\/td><\/tr><tr><td>1<\/td><td>Physical<\/td><td>Cables, hubs, repeaters<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tw\"><table><thead><tr><th>Device<\/th><th>Role<\/th><\/tr><\/thead><tbody><tr><td>Hub / repeater<\/td><td>Physical layer, repeats signals to all ports.<\/td><\/tr><tr><td>Switch<\/td><td>Data link layer, forwards frames by MAC address.<\/td><\/tr><tr><td>Router<\/td><td>Network layer, forwards packets between networks.<\/td><\/tr><tr><td>Gateway<\/td><td>Connects networks that use different protocols.<\/td><\/tr><tr><td>Firewall<\/td><td>Filters traffic by rules (see Domain 5).<\/td><\/tr><\/tbody><\/table><\/div><ul><li><b>TCP<\/b> is reliable and connection-oriented. <b>UDP<\/b> is faster and connectionless.<\/li><li>A <b>VPN<\/b> gives an encrypted tunnel over a public network.<\/li><li><b>Network segmentation<\/b> and separate test and production environments limit the spread of problems.<\/li><li>Remove <b>single points of failure<\/b> with redundant components and diverse physical routes for critical links.<\/li><li>Network management uses monitoring, logs and baselines to detect outages and abnormal traffic.<\/li><\/ul><h3>3. IT service management<\/h3><div class=\"tw\"><table><thead><tr><th>Process<\/th><th>Goal<\/th><\/tr><\/thead><tbody><tr><td>Service desk<\/td><td>Single point of contact for logging and tracking incidents.<\/td><\/tr><tr><td>Incident management<\/td><td>Restore normal service as quickly as possible.<\/td><\/tr><tr><td>Problem management<\/td><td>Find and remove the root cause of repeated incidents.<\/td><\/tr><tr><td>Change management<\/td><td>Make changes in a controlled, authorized and tested way.<\/td><\/tr><tr><td>Release management<\/td><td>Plan and move approved changes into production.<\/td><\/tr><tr><td>Configuration management<\/td><td>Keep an accurate record of assets and their relationships.<\/td><\/tr><tr><td>Capacity management<\/td><td>Ensure resources meet current and future demand.<\/td><\/tr><tr><td>Availability management<\/td><td>Ensure services are available as agreed.<\/td><\/tr><tr><td>SLA management<\/td><td>Set measurable service levels and verify them independently.<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Repeated tickets closed without root cause mean <b>problem management<\/b> is missing.<\/li><li><b>First-contact resolution rate<\/b> and time to resolve show service desk effectiveness better than call volume.<\/li><li><b>Change management<\/b>: all changes are authorized, tested and documented. A change that skipped approval is a control weakness even if it worked.<\/li><li><b>Emergency changes<\/b> are implemented fast, then documented and approved after the fact.<\/li><li><b>Patch management<\/b>: assess, test in non-production, deploy in a controlled way. Unsupported (end-of-life) systems need migration or compensating controls.<\/li><li><b>Capacity planning<\/b> acts before thresholds are breached, not after a failure.<\/li><li><b>SLA reports<\/b> from a provider need independent verification.<\/li><\/ul><h3>4. Data storage, RAID and backups<\/h3><div class=\"tw\"><table><thead><tr><th>RAID<\/th><th>Description<\/th><\/tr><\/thead><tbody><tr><td>RAID 0<\/td><td>Striping, no redundancy. Faster but fails if one disk fails.<\/td><\/tr><tr><td>RAID 1<\/td><td>Mirroring. Full copy on a second disk.<\/td><\/tr><tr><td>RAID 5<\/td><td>Striping with parity. Survives one disk failure.<\/td><\/tr><tr><td>RAID 6<\/td><td>Double parity. Survives two disk failures.<\/td><\/tr><tr><td>RAID 10<\/td><td>Mirrored stripes. Performance and redundancy.<\/td><\/tr><\/tbody><\/table><\/div><p class=\"small\">RAID protects against disk failure only. It does not replace backups (it cannot protect against deletion, corruption, ransomware or disaster).<\/p><div class=\"tw\"><table><thead><tr><th>Backup type<\/th><th>What it copies<\/th><th>Restore<\/th><\/tr><\/thead><tbody><tr><td>Full<\/td><td>Everything.<\/td><td>Fastest restore, longest backup.<\/td><\/tr><tr><td>Incremental<\/td><td>Changes since the last backup of any type.<\/td><td>Fastest backup, slowest restore (full plus every increment).<\/td><\/tr><tr><td>Differential<\/td><td>Changes since the last full backup.<\/td><td>Medium. Full plus the latest differential.<\/td><\/tr><\/tbody><\/table><\/div><ul><li><b>Offsite storage<\/b> should be geographically separate, with similar or better security, and backups should be <b>encrypted<\/b> with keys stored safely.<\/li><li><b>Test restores regularly<\/b> to prove backups work. Keep offline or immutable copies to survive ransomware.<\/li><li>Backup frequency should match the <b>RPO<\/b>.<\/li><li><b>Media disposal<\/b> needs secure wiping or destruction, since normal deletion leaves recoverable data.<\/li><\/ul><h3>5. Business continuity and disaster recovery<\/h3><ul><li><b>Business continuity plan (BCP)<\/b> keeps the business running. <b>Disaster recovery plan (DRP)<\/b> restores IT services. DRP supports the BCP.<\/li><li>Senior management owns the policy and approves the plan. The plan must be <b>current<\/b>, especially after mergers or major change.<\/li><li>The <b>business impact analysis (BIA)<\/b> is the first step. It identifies critical processes, dependencies, and the impact of downtime. It sets recovery priorities.<\/li><li><b>Life safety<\/b> is the top priority in any emergency response.<\/li><\/ul><div class=\"tw\"><table><thead><tr><th>Term<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>MTD / MTPD<\/td><td>Maximum tolerable downtime before the business suffers unacceptable harm.<\/td><\/tr><tr><td>RTO<\/td><td>Target time to restore a process or system. Must be shorter than the MTD.<\/td><\/tr><tr><td>RPO<\/td><td>Maximum acceptable data loss, measured in time. Drives backup or replication frequency.<\/td><\/tr><tr><td>WRT<\/td><td>Work recovery time. Time to catch up and verify data after systems return.<\/td><\/tr><\/tbody><\/table><\/div><ul><li>If recovery takes longer than the RTO, <b>redesign recovery<\/b> (replication, faster restore, alternate site). Do not quietly change the RTO.<\/li><li>If restored data is older than the RPO allows, increase backup or replication frequency.<\/li><li>Near-zero data loss and minutes of downtime need a <b>hot site with real-time replication<\/b>.<\/li><li>Replacement hardware lead time must fit inside the RTO. Keep spares or a contracted replacement SLA.<\/li><\/ul><div class=\"tw\"><table><thead><tr><th>Recovery site<\/th><th>Readiness<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td>Hot site<\/td><td>Fully equipped and current. Recovery in minutes or hours.<\/td><td>Highest cost. Check capacity guarantees.<\/td><\/tr><tr><td>Warm site<\/td><td>Hardware and connectivity ready, data must be restored.<\/td><td>Medium cost and time.<\/td><\/tr><tr><td>Cold site<\/td><td>Space and utilities only.<\/td><td>Cheapest, slowest.<\/td><\/tr><tr><td>Mobile site<\/td><td>Self-contained trailer or unit.<\/td><td>Moves to the location needed.<\/td><\/tr><tr><td>Reciprocal agreement<\/td><td>Agreement with another organization to share facilities.<\/td><td>Weak: compatibility and availability may not be guaranteed.<\/td><\/tr><\/tbody><\/table><\/div><ul><li><b>Two sites in the same flood zone or region<\/b> can both be hit by one event. Sites should be far enough apart.<\/li><li><b>Alternate telecom routes<\/b> from separate providers protect against a single cable cut.<\/li><li><b>Key-person dependency<\/b> weakens recovery. Document and cross-train.<\/li><li>Keep contact lists and call trees current.<\/li><\/ul><div class=\"tw\"><table><thead><tr><th>BCP test<\/th><th>What it proves<\/th><\/tr><\/thead><tbody><tr><td>Checklist / desk review<\/td><td>Plan content is complete. Weakest.<\/td><\/tr><tr><td>Walkthrough / tabletop<\/td><td>Plan logic works on paper. Limited assurance, not real recovery.<\/td><\/tr><tr><td>Simulation<\/td><td>Teams respond to a realistic scenario.<\/td><\/tr><tr><td>Parallel test<\/td><td>Recovery site runs alongside production without interrupting it.<\/td><\/tr><tr><td>Full interruption<\/td><td>Production moves to the recovery site. Most realistic, most risky.<\/td><\/tr><\/tbody><\/table><\/div><ul><li>The <b>best evidence a BCP is effective<\/b> is recent, successful test results.<\/li><li><b>Scenario tests<\/b> where key people or remote access are unavailable find hidden weaknesses.<\/li><li>Plan maintenance: update after changes, review regularly, retest, and train staff.<\/li><\/ul><h3>6. Incident handling in operations<\/h3><ul><li><b>Contain first<\/b> (isolate the affected system), then investigate, eradicate and recover.<\/li><li>Keep logs with <b>consistent time stamps<\/b> and protect them from alteration.<\/li><li><b>Alert tuning<\/b>: thousands of ignored alerts mean alert fatigue. Tune thresholds and prioritize.<\/li><li>Detect unauthorized production changes by <b>reconciling change logs to approved change requests<\/b>, and by file integrity monitoring.<\/li><li>Keep <b>test and production separate<\/b>, otherwise test activity can corrupt or expose live data.<\/li><\/ul><div class=\"tip warn\"><strong>Common exam traps in Domain 4<\/strong><ul><li>Starting a BCP with <b>site selection or testing<\/b> instead of a BIA.<\/li><li>Mixing up <b>RTO (time)<\/b> and <b>RPO (data)<\/b>.<\/li><li>Mixing up <b>incident<\/b> management (restore) with <b>problem<\/b> management (root cause).<\/li><li>Treating <b>RAID as a backup<\/b>.<\/li><li>Treating a <b>tabletop<\/b> as proof that recovery works.<\/li><li>Mixing up <b>incremental<\/b> (since last backup) and <b>differential<\/b> (since last full).<\/li><li>Picking <b>wipe or restore<\/b> before containing a malware infection.<\/li><li>Accepting <b>provider-reported SLA<\/b> figures without independent verification.<\/li><\/ul><\/div>"},{"n":5,"name":"Protection of Information Assets","weight":"26%","html":"<p class=\"lead\">This is the other heavy domain. It covers how information is classified and protected: logical access, network security, encryption, malware and attacks, data and mobile security, physical and environmental controls, security monitoring, incident response and forensics. Expect many scenario questions where the BEST control is preventive, layered and matched to risk.<\/p><div class=\"tip\"><strong>Must-know points<\/strong><ul><li><b>CIA<\/b>: confidentiality, integrity, availability. Add authentication, authorization, accountability and non-repudiation.<\/li><li><b>Least privilege<\/b> and <b>default deny<\/b> are the standard answers for access and firewalls.<\/li><li>Encrypt for confidentiality with the <b>recipient's public key<\/b>. Sign with the <b>sender's private key<\/b>.<\/li><li><b>Data owner<\/b> classifies data. <b>Custodian<\/b> protects it.<\/li><li><b>People<\/b> are often the weakest link: awareness training plus technical controls.<\/li><li><b>Contain first<\/b> in an incident, and preserve evidence with a <b>chain of custody<\/b>.<\/li><\/ul><\/div><h3>1. Security governance basics<\/h3><ul><li>Security policy is approved by senior management. Standards and procedures implement it.<\/li><li><b>Data classification<\/b> drives protection. Apply controls proportionate to sensitivity, and enforce them (for example restricted data must not sit on an open shared drive).<\/li><li><b>Information assets<\/b> need an inventory and an owner.<\/li><li><b>Security awareness<\/b> training should be ongoing and role-based, with measurable results.<\/li><li>Security administrators should not process business transactions or approve their own access.<\/li><\/ul><h3>2. Logical access controls<\/h3><ul><li>Three authentication factors: <b>something you know<\/b> (password), <b>something you have<\/b> (token, smart card), <b>something you are<\/b> (biometric). <b>Multi-factor<\/b> uses two or more different types. A smart card plus PIN is two-factor.<\/li><li><b>Password controls<\/b>: adequate length, no reuse of weak or breached passwords, <b>account lockout<\/b> after limited failures, and storage as <b>salted hashes<\/b>, never in plain text.<\/li><li><b>Single sign-on (SSO)<\/b> is convenient but one compromised credential exposes many systems.<\/li><li><b>Shared accounts<\/b> destroy accountability. Privileged access needs approval, logging and independent review.<\/li><li><b>Access reviews<\/b> find excess or outdated access (privilege creep). Re-evaluate access when people change roles. Remove access <b>immediately<\/b> on termination.<\/li><\/ul><div class=\"tw\"><table><thead><tr><th>Model<\/th><th>How access is decided<\/th><\/tr><\/thead><tbody><tr><td>DAC (discretionary)<\/td><td>The owner of the resource decides who may access it.<\/td><\/tr><tr><td>MAC (mandatory)<\/td><td>The system enforces access based on classification labels and clearances.<\/td><\/tr><tr><td>RBAC (role-based)<\/td><td>Access is grouped into roles tied to job functions. Simplifies administration.<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tw\"><table><thead><tr><th>Biometric measure<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>FAR (false acceptance rate)<\/td><td>Wrong person accepted. The most serious for security.<\/td><\/tr><tr><td>FRR (false rejection rate)<\/td><td>Right person rejected. Hurts availability and productivity.<\/td><\/tr><tr><td>EER (equal error rate)<\/td><td>Point where FAR equals FRR. Used to compare systems.<\/td><\/tr><\/tbody><\/table><\/div><p class=\"small\">Store biometric templates encrypted, not as raw images, because biometrics cannot be reset.<\/p><h3>3. Network security<\/h3><div class=\"tw\"><table><thead><tr><th>Control<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td>Packet-filter firewall<\/td><td>Filters by address and port. Simple, limited.<\/td><\/tr><tr><td>Stateful inspection firewall<\/td><td>Tracks connection state. Stronger than packet filtering.<\/td><\/tr><tr><td>Application-level gateway (proxy)<\/td><td>Inspects application content. Strongest, slower.<\/td><\/tr><tr><td>DMZ / screened subnet<\/td><td>Isolates public-facing servers from the internal network.<\/td><\/tr><tr><td>IDS<\/td><td>Detects and alerts. Signature-based finds known attacks. Anomaly-based can find unknown attacks but gives more false positives.<\/td><\/tr><tr><td>IPS<\/td><td>Detects and blocks.<\/td><\/tr><tr><td>VPN (IPsec, TLS)<\/td><td>Encrypted tunnel over an untrusted network.<\/td><\/tr><tr><td>Network segmentation / VLAN<\/td><td>Limits lateral movement.<\/td><\/tr><tr><td>Honeypot<\/td><td>Decoy system to attract and study attackers.<\/td><\/tr><\/tbody><\/table><\/div><ul><li><b>Default deny<\/b>: block everything except what is needed. An <b>allow any any<\/b> rule at the end of a rule set defeats this.<\/li><li>An IDS placed <b>outside<\/b> the firewall produces many alerts for attacks the firewall would have blocked.<\/li><li><b>Wireless<\/b>: use WPA2 or WPA3 Enterprise with individual authentication. WEP is weak. Scan for rogue access points.<\/li><li><b>Remote access<\/b> from unmanaged personal devices is a risk. Check endpoint compliance, and give least-privilege, time-limited, monitored access to vendors.<\/li><\/ul><h3>4. Encryption and PKI<\/h3><div class=\"tw\"><table><thead><tr><th>Type<\/th><th>Key points<\/th><\/tr><\/thead><tbody><tr><td>Symmetric<\/td><td>One shared key. Fast, good for large data. Problem: secure key distribution. Examples: AES, 3DES.<\/td><\/tr><tr><td>Asymmetric<\/td><td>Key pair (public and private). Slower. Solves key distribution, enables signatures. Example: RSA.<\/td><\/tr><tr><td>Hybrid<\/td><td>Asymmetric exchange of a symmetric session key, then fast symmetric encryption. Standard approach.<\/td><\/tr><tr><td>Hashing<\/td><td>One-way fingerprint that proves integrity. Example: SHA-256.<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tw\"><table><thead><tr><th>Goal<\/th><th>Use this key<\/th><\/tr><\/thead><tbody><tr><td>Confidentiality of a message<\/td><td>Encrypt with the recipient's public key. Only the recipient's private key decrypts.<\/td><\/tr><tr><td>Authentication and non-repudiation (digital signature)<\/td><td>Sign with the sender's private key. Verify with the sender's public key.<\/td><\/tr><tr><td>Integrity<\/td><td>Hash of the message, protected by a digital signature.<\/td><\/tr><\/tbody><\/table><\/div><ul><li><b>Digital signature<\/b> gives integrity and non-repudiation.<\/li><li><b>PKI<\/b>: the <b>CA<\/b> issues and signs certificates. The <b>RA<\/b> verifies the requester's identity. A <b>CRL<\/b> lists revoked certificates.<\/li><li>A valid certificate from a trusted CA that matches the domain authenticates a website. <b>TLS<\/b> protects web sessions and defeats man-in-the-middle attacks when certificates are validated.<\/li><li><b>Key management<\/b>: protect keys, never store them beside the data, back them up or escrow them (lost keys mean unrecoverable data), and rotate them.<\/li><li><b>IPsec<\/b> provides authentication and encryption for IP traffic in a VPN.<\/li><\/ul><h3>5. Malware and attacks<\/h3><div class=\"tw\"><table><thead><tr><th>Threat<\/th><th>Description<\/th><\/tr><\/thead><tbody><tr><td>Virus<\/td><td>Attaches to a host file and spreads when it is run.<\/td><\/tr><tr><td>Worm<\/td><td>Spreads by itself over networks without a host program.<\/td><\/tr><tr><td>Trojan<\/td><td>Looks legitimate but does something harmful.<\/td><\/tr><tr><td>Ransomware<\/td><td>Encrypts data and demands payment.<\/td><\/tr><tr><td>Rootkit<\/td><td>Hides malicious activity at a deep system level.<\/td><\/tr><tr><td>Logic bomb<\/td><td>Malicious code that triggers on a condition or date.<\/td><\/tr><tr><td>Denial of service<\/td><td>Attacks availability by overloading a system.<\/td><\/tr><tr><td>Man-in-the-middle<\/td><td>Intercepts and may alter communication.<\/td><\/tr><tr><td>Phishing<\/td><td>Fraudulent messages to steal credentials or money. Spear phishing targets a person or group. Whaling targets executives.<\/td><\/tr><tr><td>SQL injection<\/td><td>Malicious input changes database queries. Prevent with parameterized queries and input validation.<\/td><\/tr><\/tbody><\/table><\/div><ul><li><b>Antimalware<\/b> works best when signatures and engines update automatically and frequently. Signature-based tools miss unknown malware.<\/li><li><b>Social engineering<\/b> is defeated mainly by <b>awareness training<\/b> combined with technical filters, and by verifying requests (for example payment requests) through a separate channel.<\/li><li>A caller claiming to be IT and asking for a password: refuse and report.<\/li><li><b>Offline or immutable backups<\/b> are the best protection against ransomware encrypting backups.<\/li><\/ul><h3>6. Data protection and privacy<\/h3><ul><li>Protect data <b>at rest<\/b> (disk, database and backup encryption), <b>in transit<\/b> (TLS, VPN) and in use.<\/li><li><b>Data loss prevention (DLP)<\/b> stops sensitive data leaving the organization through email, web or removable media.<\/li><li><b>Removable media<\/b>: restrict use and require encryption on approved devices.<\/li><li><b>Mobile and BYOD<\/b>: mobile device management with encryption, remote lock or wipe, and approved apps. For a lost phone, lock or wipe first.<\/li><li><b>Shadow IT<\/b>: discover it, set policy and provide an approved alternative.<\/li><li><b>Privacy<\/b>: purpose limitation, data minimization and storage limitation. Do not reuse data for a new purpose without a legal basis or consent.<\/li><li><b>Cloud<\/b>: confirm where data is stored (jurisdiction), who is responsible for patching and access, how incidents are notified, and audit rights. In multi-tenant clouds, isolation between customers is a key risk. In IaaS the customer patches the guest operating system.<\/li><li><b>Disposal<\/b>: shred paper, and wipe or physically destroy media. Never rely on ordinary deletion.<\/li><li><b>Clean desk<\/b> policy reduces disclosure of sensitive information.<\/li><\/ul><h3>7. Physical and environmental security<\/h3><div class=\"tw\"><table><thead><tr><th>Area<\/th><th>Controls<\/th><\/tr><\/thead><tbody><tr><td>Access<\/td><td>Badges, biometrics, mantraps or turnstiles (stop tailgating), visitor logs and escorts, guards, CCTV. Collect visitor badges.<\/td><\/tr><tr><td>Location<\/td><td>Interior, no external signs, away from flood, fire and external walls. Avoid basements prone to flooding.<\/td><\/tr><tr><td>Fire<\/td><td>Smoke and heat detectors. Dry-pipe sprinklers or clean-agent gas systems preferred in data centers.<\/td><\/tr><tr><td>Power<\/td><td>UPS for short-term power and graceful shutdown. Generators for long outages.<\/td><\/tr><tr><td>Climate<\/td><td>Controlled temperature and humidity, water detection, raised floors.<\/td><\/tr><\/tbody><\/table><\/div><ul><li>A data center door propped open defeats physical access control.<\/li><li>Fire suppression systems must be tested and staff trained.<\/li><\/ul><h3>8. Security monitoring, incident response and forensics<\/h3><ul><li><b>Logging<\/b>: collect, protect from modification, synchronize time stamps and review. <b>SIEM<\/b> correlates logs to detect security events.<\/li><li><b>Vulnerability scanning<\/b> finds known weaknesses. <b>Penetration testing<\/b> tries to exploit them and needs <b>written authorization and a defined scope<\/b>. White-box testers are given system knowledge, black-box testers are not.<\/li><li>Fix findings in order of <b>risk<\/b> (exploitable and affecting critical assets).<\/li><li><b>Static code analysis<\/b> and secure code review find flaws before release.<\/li><\/ul><div class=\"tw\"><table><thead><tr><th>Incident phase<\/th><th>What happens<\/th><\/tr><\/thead><tbody><tr><td>Preparation<\/td><td>Plan, roles, tools, training, contacts.<\/td><\/tr><tr><td>Detection and analysis<\/td><td>Identify and confirm the incident.<\/td><\/tr><tr><td>Containment<\/td><td>Isolate affected systems to stop the spread.<\/td><\/tr><tr><td>Eradication and recovery<\/td><td>Remove the cause, restore systems.<\/td><\/tr><tr><td>Lessons learned<\/td><td>Review and improve.<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Disclosure to regulators and the public is authorized by <b>senior management with legal and communications<\/b>, following the plan.<\/li><li><b>Forensics<\/b>: preserve evidence, document a <b>chain of custody<\/b>, make a <b>bit-for-bit image<\/b> and work from the copy.<\/li><li><b>Order of volatility<\/b>: collect volatile data (memory) first, then disk.<\/li><li>Stolen laptop with unencrypted data: follow the incident plan, assess the data, notify as required and remote wipe if possible. Full-disk encryption would have prevented exposure.<\/li><\/ul><div class=\"tip warn\"><strong>Common exam traps in Domain 5<\/strong><ul><li>Mixing up the keys: <b>encrypt for confidentiality with the recipient's public key<\/b>, sign with your own private key.<\/li><li>Choosing <b>detective<\/b> over <b>preventive<\/b> when the question asks for the BEST control.<\/li><li>Choosing <b>technology alone<\/b> for phishing or social engineering. The best answer includes training.<\/li><li>Confusing <b>FAR<\/b> (security risk) with <b>FRR<\/b> (availability and usability problem).<\/li><li>Wiping or restoring a compromised system <b>before containing and preserving evidence<\/b>.<\/li><li>Mixing up <b>IDS<\/b> (detects) with <b>IPS<\/b> (blocks).<\/li><li>Picking <b>default allow<\/b> or shared accounts. The answer is least privilege and default deny.<\/li><li>Forgetting that the <b>data owner<\/b> classifies and <b>custodian<\/b> protects.<\/li><\/ul><\/div>"}];
var LETTERS = ["A", "B", "C", "D"];

var app = document.getElementById("app");
var curQuiz = "1", set = [], pos = 0, picks = [], answered = false;

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}
function nav(h) {
  if (location.hash === "#" + h || (h === "" && !location.hash)) route();
  else location.hash = h;
}
function questions(id) {
  return QUIZZES[id].raw.map(function (r, i) {
    return { n: i + 1, d: r[0], q: r[1], o: r[2], a: r[3], e: r[4] };
  });
}

function route() {
  var h = location.hash.replace("#", "");
  if (/^q[12345]$/.test(h)) return quizMenu(h.charAt(1));
  if (/^n[1-5]$/.test(h)) return showNote(+h.charAt(1));
  return home();
}

function home() {
  var h = '<h1>CISA Practice</h1>' +
    '<p class="muted">Five practice quizzes and short study notes for each CISA domain. Everything here is original practice material, not real exam questions.</p>' +
    '<h2>Practice quizzes</h2><div class="list">';
  Object.keys(QUIZZES).forEach(function (id) {
    h += '<button class="dom col" data-q="' + id + '"><strong>' + esc(QUIZZES[id].title) + '</strong><small>' + esc(QUIZZES[id].desc) + '</small></button>';
  });
  h += '</div><h2>Study notes</h2><div class="list">';
  NOTES.forEach(function (n) {
    h += '<button class="dom" data-n="' + n.n + '"><span><strong>Domain ' + n.n + '</strong>' + esc(n.name) + '</span><small class="r">' + esc(n.weight) + '</small></button>';
  });
  h += '</div>';
  app.innerHTML = h;
  app.querySelectorAll("[data-q]").forEach(function (b) {
    b.onclick = function () { nav("q" + b.getAttribute("data-q")); };
  });
  app.querySelectorAll("[data-n]").forEach(function (b) {
    b.onclick = function () { nav("n" + b.getAttribute("data-n")); };
  });
  window.scrollTo(0, 0);
}

function quizMenu(id) {
  curQuiz = id;
  var all = questions(id);
  var h = '<button class="back" id="back">&larr; All quizzes</button>' +
    '<h1>' + esc(QUIZZES[id].title.replace(/^Quiz \d: /, "Quiz " + id + ": ")) + '</h1>' +
    '<p class="muted">' + esc(QUIZZES[id].desc) + ' Each answer comes with a short explanation.</p>' +
    '<div class="list">' +
    '<button class="dom" data-d="0"><span><strong>All domains</strong></span><small class="r">' + all.length + ' questions</small></button>';
  DOMAINS.forEach(function (d) {
    var c = all.filter(function (q) { return q.d === d.id; }).length;
    h += '<button class="dom" data-d="' + d.id + '"><span>Domain ' + d.id + ': ' + esc(d.name) + '</span><small class="r">' + c + '</small></button>';
  });
  h += '</div>';
  app.innerHTML = h;
  document.getElementById("back").onclick = function () { nav(""); };
  app.querySelectorAll("[data-d]").forEach(function (b) {
    b.onclick = function () {
      var d = +b.getAttribute("data-d");
      start(d === 0 ? all : all.filter(function (q) { return q.d === d; }));
    };
  });
  window.scrollTo(0, 0);
}

function showNote(n) {
  var note = NOTES.filter(function (x) { return x.n === n; })[0];
  app.innerHTML = '<button class="back" id="back">&larr; Back</button>' +
    '<h1>Domain ' + note.n + ': ' + esc(note.name) + '</h1>' +
    '<p class="muted">Exam weight: about ' + esc(note.weight) + '</p>' +
    '<div class="note">' + note.html + '</div>' +
    '<button class="btn ghost" id="b2" style="margin-top:20px">Back to start</button>';
  document.getElementById("back").onclick = function () { nav(""); };
  document.getElementById("b2").onclick = function () { nav(""); };
  window.scrollTo(0, 0);
}

function start(list) {
  set = list; pos = 0; picks = []; answered = false;
  renderQ();
}

function renderQ() {
  var q = set[pos];
  answered = picks[pos] !== undefined;
  var pct = (pos / set.length) * 100;
  var h = '<div class="top"><span>Question ' + (pos + 1) + ' of ' + set.length + '</span><span>Domain ' + q.d + '</span></div>' +
    '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
    '<div class="q">' + esc(q.q) + '</div><div class="opts">';
  q.o.forEach(function (t, i) {
    h += '<button class="opt" data-i="' + i + '"><span class="l">' + LETTERS[i] + '</span><span>' + esc(t) + '</span></button>';
  });
  h += '</div><div id="fb"></div><div class="nav" id="nav"></div>' +
    '<div class="tools"><button id="quit">Quit to menu</button></div>';
  app.innerHTML = h;
  app.querySelectorAll(".opt").forEach(function (b) {
    b.onclick = function () { choose(+b.getAttribute("data-i")); };
  });
  document.getElementById("quit").onclick = function () { quizMenu(curQuiz); };
  if (answered) showFeedback();
  window.scrollTo(0, 0);
}

function choose(i) {
  if (answered) return;
  picks[pos] = i; answered = true;
  showFeedback();
}

function showFeedback() {
  var q = set[pos], p = picks[pos], right = p === q.a;
  app.querySelectorAll(".opt").forEach(function (b, i) {
    b.disabled = true;
    if (i === q.a) b.classList.add("ok");
    else if (i === p) b.classList.add("bad");
  });
  document.getElementById("fb").innerHTML =
    '<div class="fb" role="status"><strong class="' + (right ? "ok" : "bad") + '">' +
    (right ? "Correct." : "Not quite. The answer is " + LETTERS[q.a] + ".") + '</strong> ' + esc(q.e) + '</div>';
  var last = pos === set.length - 1;
  var nv = document.getElementById("nav");
  nv.innerHTML = '<button class="btn" id="next">' + (last ? "See results" : "Next question") + '</button>';
  document.getElementById("next").onclick = function () {
    if (last) results(); else { pos++; renderQ(); }
  };
  document.getElementById("next").focus({ preventScroll: true });
  nv.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

function results() {
  var correct = 0, byD = {}, wrong = [];
  set.forEach(function (q, i) {
    byD[q.d] = byD[q.d] || { c: 0, t: 0 };
    byD[q.d].t++;
    if (picks[i] === q.a) { correct++; byD[q.d].c++; } else wrong.push({ q: q, p: picks[i] });
  });
  var pct = Math.round((correct / set.length) * 100);
  var h = '<h2 style="margin-top:0">Your result</h2><div class="score">' + pct + '%</div>' +
    '<p class="muted">' + correct + ' correct out of ' + set.length + '. On the real exam you need a scaled score of 450 out of 800, so use this as a rough guide, not a prediction.</p>';
  DOMAINS.forEach(function (d) {
    var s = byD[d.id];
    if (!s) return;
    var dp = Math.round((s.c / s.t) * 100);
    h += '<div class="row"><span>Domain ' + d.id + ': ' + esc(d.name) + '</span><span>' + s.c + '/' + s.t + '</span>' +
      '<div class="bar"><i style="width:' + dp + '%"></i></div></div>';
  });
  h += '<div style="margin-top:20px">';
  if (wrong.length) h += '<button class="btn" id="retry">Retry the ' + wrong.length + ' you missed</button>';
  h += '<button class="btn ghost" id="again">Back to quiz menu</button></div>';
  if (wrong.length) {
    h += '<h2 style="margin-top:32px">Review your mistakes</h2>';
    wrong.forEach(function (w) {
      h += '<div class="miss"><div class="q">' + w.q.n + '. ' + esc(w.q.q) + '</div>' +
        '<div class="yours">Your answer: ' + LETTERS[w.p] + '. ' + esc(w.q.o[w.p]) + '</div>' +
        '<div class="right">Correct: ' + LETTERS[w.q.a] + '. ' + esc(w.q.o[w.q.a]) + '</div>' +
        '<div class="muted" style="margin-top:6px">' + esc(w.q.e) + '</div></div>';
    });
  }
  app.innerHTML = h;
  var r = document.getElementById("retry");
  if (r) r.onclick = function () { start(wrong.map(function (w) { return w.q; })); };
  document.getElementById("again").onclick = function () { quizMenu(curQuiz); };
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>

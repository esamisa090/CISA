<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CISA Practice</title>
<style>
:root {
  --bg: #f5f6f2; --card: #ffffff; --text: #1c2a2d; --muted: #5d6d70; --line: #d9dfdc;
  --accent: #0e6b6b; --accent-ink: #ffffff; --ok: #1d7a46; --ok-bg: #e3f3ea; --bad: #b0341f; --bad-bg: #f9e4df;
  --tip-bg: #e6f2f1; --warn-bg: #fff4e0; --warn: #c77d0a; --zebra: #f4f8f7;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1a1c; --card: #172528; --text: #e5ecea; --muted: #9fb0b2; --line: #2b3d40;
    --accent: #4fc0bb; --accent-ink: #0b1517; --ok: #62d28f; --ok-bg: #173325; --bad: #ff8d77; --bad-bg: #3b1f1a;
    --tip-bg: #14302f; --warn-bg: #3a2d12; --warn: #e0a040; --zebra: #1a2b2e;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1a1c; --card: #172528; --text: #e5ecea; --muted: #9fb0b2; --line: #2b3d40;
  --accent: #4fc0bb; --accent-ink: #0b1517; --ok: #62d28f; --ok-bg: #173325; --bad: #ff8d77; --bad-bg: #3b1f1a;
  --tip-bg: #14302f; --warn-bg: #3a2d12; --warn: #e0a040; --zebra: #1a2b2e;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
main { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }
h1, h2 { font-family: Georgia, "Times New Roman", serif; font-weight: 700; line-height: 1.2; margin: 0 0 8px; }
h1 { font-size: 30px; }
h2 { font-size: 21px; margin-top: 26px; }
p { margin: 0 0 12px; }
.muted { color: var(--muted); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn {
  display: block; width: 100%; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--accent);
  background: var(--accent); color: var(--accent-ink); font-weight: 600; text-align: center;
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn + .btn { margin-top: 10px; }
.list { display: grid; gap: 10px; margin: 10px 0 0; }
.dom {
  text-align: left; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); display: flex; justify-content: space-between; gap: 12px; align-items: center; width: 100%;
}
.dom.col { display: block; }
.dom strong { color: var(--accent); display: block; }
.dom small { color: var(--muted); }
.dom .r { white-space: nowrap; }
.back { background: none; border: 0; color: var(--accent); padding: 4px 0 12px; font-weight: 600; }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; font-size: 14px; color: var(--muted); }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 20px; }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }
.q { font-size: 17px; line-height: 1.45; margin-bottom: 16px; font-weight: 600; }
.opts { display: grid; gap: 10px; }
.opt {
  display: flex; gap: 12px; text-align: left; width: 100%; padding: 13px 14px;
  border-radius: 10px; border: 1.5px solid var(--line); background: var(--card);
}
.opt .l { font-weight: 700; color: var(--accent); min-width: 18px; }
.opt.ok { border-color: var(--ok); background: var(--ok-bg); }
.opt.bad { border-color: var(--bad); background: var(--bad-bg); }
.opt:disabled { cursor: default; }
.fb { margin-top: 16px; padding: 14px 16px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); }
.fb strong.ok { color: var(--ok); } .fb strong.bad { color: var(--bad); }
.nav { margin-top: 16px; }
.score { font-family: Georgia, serif; font-size: 56px; font-weight: 700; line-height: 1; margin: 8px 0 4px; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; margin: 14px 0; font-size: 15px; }
.row .bar { grid-column: 1 / -1; margin: 0; }
.miss { padding: 14px 0; border-top: 1px solid var(--line); }
.miss .q { font-size: 16px; margin-bottom: 8px; }
.miss .yours { color: var(--bad); } .miss .right { color: var(--ok); }
.tools { display: flex; justify-content: space-between; margin-top: 28px; font-size: 14px; }
.tools button { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 6px 0; }
/* study notes */
.note h3 { font-family: Georgia, "Times New Roman", serif; font-size: 18px; color: var(--accent); margin: 22px 0 8px; }
.note ul { margin: 0 0 12px; padding-left: 20px; }
.note li { margin-bottom: 5px; }
.note .lead { color: var(--muted); }
.note .small { font-size: 13px; color: var(--muted); font-style: italic; }
.note .tw { overflow-x: auto; margin: 0 0 14px; border: 1px solid var(--line); border-radius: 8px; }
.note table { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 320px; }
.note th { background: var(--accent); color: var(--accent-ink); text-align: left; padding: 7px 9px; }
.note td { padding: 7px 9px; border-top: 1px solid var(--line); vertical-align: top; }
.note tbody tr:nth-child(even) td { background: var(--zebra); }
.note .tip { background: var(--tip-bg); border-left: 4px solid var(--accent); border-radius: 6px; padding: 10px 12px 4px; margin: 0 0 14px; }
.note .tip strong { display: block; color: var(--accent); margin-bottom: 4px; }
.note .tip.warn { background: var(--warn-bg); border-left-color: var(--warn); }
.note .tip.warn strong { color: var(--warn); }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>
</head>
<body>
<main id="app"></main>

<script>
var DOMAINS = [
  { id: 1, name: "Auditing Information Systems" },
  { id: 2, name: "Governance and Management of IT" },
  { id: 3, name: "Acquisition, Development and Implementation" },
  { id: 4, name: "Operations and Business Resilience" },
  { id: 5, name: "Protection of Information Assets" }
];
var QUIZZES = {"1":{"title":"Quiz 1: 150 practice questions","desc":"Core concepts across all five domains.","raw":[[1,"What should an IS auditor do FIRST when planning an audit?",["Develop the audit program","Define the audit scope and objectives","Perform control testing","Draft the audit report"],1,"Scope and objectives drive everything else in the audit."],[1,"What is the main benefit of a risk-based audit approach?",["It removes the need for sampling","It guarantees fraud detection","It focuses audit resources on the highest-risk areas","It shortens the final report"],2,"Risk-based means audit effort goes first to the areas with the highest risk."],[1,"Which evidence is the MOST reliable?",["A management representation letter","A system report provided by the auditee","Interview notes from the process owner","Confirmation obtained directly from an independent third party"],3,"Independent, external evidence is the most reliable."],[1,"Which situation MOST impairs an auditor's independence?",["Auditing a department the auditor has never worked with","Auditing a control the auditor designed","Using an external specialist","Reporting to the audit committee"],1,"Auditing your own design is a self-review threat."],[1,"Attribute sampling is MOST appropriate for:",["Estimating the dollar value of errors","Testing whether a control is present and operating","Detecting a single critical fraud","Analyzing a full population"],1,"Attribute sampling tests compliance: the control either occurred or it did not."],[1,"Management decides to accept a significant risk the auditor reported. The auditor should:",["Remove the finding from the report","Implement a compensating control","Ensure the acceptance is made and documented by appropriate senior management","Escalate to regulators"],2,"Risk acceptance must come from the appropriate level of management, and be documented."],[1,"What is the PRIMARY advantage of computer-assisted audit techniques (CAATs)?",["They replace professional judgment","They can analyze entire populations of data","They eliminate audit risk","They need no data validation"],1,"CAATs can test whole populations instead of small samples."],[1,"During an audit, the auditor suspects fraud. What should the auditor do?",["Confront the suspected employee","Ignore it if the amount is immaterial","Expand testing until fraud is proven","Report to the appropriate level of management or the audit committee per policy"],3,"Report through the proper channels; do not investigate or confront alone."],[1,"What is the key benefit of continuous auditing?",["Fewer audit staff are needed","It reduces the time between a control failure and its detection","It replaces management monitoring","It eliminates sampling risk"],1,"It shortens the gap between a failure and its detection."],[2,"The PRIMARY role of an IT strategy committee is to:",["Approve user access requests","Manage daily operations","Select hardware vendors","Ensure IT strategy aligns with business strategy"],3,"Strategy alignment is the committee's purpose."],[2,"Which is the BEST indicator that IT is aligned with the business?",["The IT budget is below industry average","The IT strategic plan is approved and linked to the business plan","IT staff turnover is low","Uptime exceeds 99%"],1,"An approved plan linked to the business plan shows alignment."],[2,"An organization outsources payroll processing. Who retains ultimate accountability for payroll data protection?",["The service provider","The service provider's auditor","The organization's management","The regulator"],2,"You can outsource the task, not the accountability."],[2,"Which combination of duties is MOST incompatible?",["Application programmer and production data access","Help desk and network operations","Database administrator and backup operator","Business analyst and tester"],0,"Programmers should not have access to production data or systems."],[2,"The risk remaining after controls are applied is called:",["Inherent risk","Residual risk","Detection risk","Control risk"],1,"Residual risk is what is left after controls."],[2,"Policies should be approved by:",["IT staff","Internal audit","Senior management","External consultants"],2,"Senior management owns and approves policy."],[2,"The board's primary responsibility in IT governance is to:",["Set direction and oversee that IT delivers business value","Configure systems","Perform risk assessments","Write procedures"],0,"The board sets direction and oversees value delivery."],[2,"A maturity model rating of \"defined\" generally means processes are:",["Ad hoc","Optimized through automation","Documented, standardized, and communicated","Not yet identified"],2,"Defined means documented, standardized and communicated."],[2,"An IT balanced scorecard is MOST useful for:",["Measuring IT performance across multiple perspectives, not only financial","Calculating ROI only","Detecting intrusions","Testing backups"],0,"It measures performance from several perspectives, not just financial."],[3,"What is the MOST common reason projects fail?",["Insufficient hardware","Lack of senior management support and user involvement","Too many testers","Excess documentation"],1,"Management support and user involvement are the top success factors."],[3,"The feasibility study is performed during which phase?",["Project initiation","Testing","Implementation","Maintenance"],0,"Feasibility is assessed at initiation."],[3,"Which testing verifies that newly developed modules work together?",["Unit testing","Regression testing","Integration testing","Stress testing"],2,"Integration testing checks that modules work together."],[3,"Who should perform user acceptance testing (UAT)?",["Developers","End users","Auditors","Database administrators"],1,"The users who will rely on the system perform UAT."],[3,"What is the BEST way to verify data conversion completeness?",["Reconcile record counts and control totals between old and new systems","Spot-check one record","Ask the vendor to confirm","Review the conversion script only"],0,"Reconciling counts and control totals proves completeness."],[3,"A post-implementation review is MAINLY performed to:",["Fix defects","Train users","Assess whether project objectives and benefits were achieved","Approve the budget"],2,"A PIR checks whether the expected benefits were realized."],[3,"Which is a risk of a direct (big bang) changeover?",["High cost of running two systems","Duplicate data entry","Slow user adoption","No fallback if the new system fails"],3,"With a big bang cutover there is no fallback if the new system fails."],[4,"Recovery time objective (RTO) is the:",["Maximum acceptable data loss","Cost of recovery","Maximum tolerable time to restore a process after disruption","Time to detect an incident"],2,"RTO is the time-based tolerance for restoring a process."],[4,"Recovery point objective (RPO) MOST directly determines:",["Backup frequency","Hot site selection","Staffing levels","Insurance coverage"],0,"RPO is acceptable data loss, so it drives how often you back up."],[4,"What is the FIRST step in developing a business continuity plan?",["Select a recovery site","Test the plan","Perform a business impact analysis","Train staff"],2,"The BIA comes first; it tells you what matters most."],[4,"Which recovery site offers the SHORTEST recovery time?",["Cold site","Warm site","Reciprocal agreement","Hot site"],3,"A hot site is ready to run almost immediately."],[4,"How should an emergency change be handled?",["Skip documentation entirely","Implement it, then document and approve it retroactively","Delay until the next scheduled release","Let the developer approve it alone"],1,"Emergency changes still need documentation and approval, after the fact."],[4,"Malware is found on a production server. What should be done FIRST?",["Isolate the affected system to contain the spread","Wipe the server","Notify the media","Restore from backup"],0,"Contain first, then investigate and recover."],[4,"The goal of problem management is to:",["Restore service quickly","Log all calls","Identify and remove the root cause of incidents","Assign tickets"],2,"Problem management removes the root cause; incident management restores service."],[4,"A differential backup copies:",["Everything every time","Only data changed since the last incremental","Data changed since the last full backup","Only deleted files"],2,"Differential means everything changed since the last full backup."],[4,"What is the BEST evidence that a BCP is effective?",["The plan is thick and detailed","Management signed it","It was written by experts","Results of recent, successful tests"],3,"Successful test results are the best evidence."],[4,"RAID 1 provides:",["Striping without redundancy","Disk mirroring for redundancy","Encryption","Faster backups"],1,"RAID 1 is mirroring."],[4,"Capacity management is MAINLY intended to:",["Reduce licensing costs","Monitor user behavior","Ensure resources meet current and future demand","Track help desk calls"],2,"It makes sure resources meet current and future demand."],[4,"SLA monitoring is MOST effective when:",["The provider self-reports only","Measurable metrics are defined and independently reviewed","Reviewed annually","Based on verbal agreement"],1,"Measurable metrics with independent review make monitoring effective."],[4,"Which log review BEST detects unauthorized changes to production?",["Help desk tickets","Email logs","Reconciliation of change logs against approved change requests","Printer logs"],2,"Compare what actually changed against what was approved."],[5,"To ensure confidentiality in asymmetric encryption, the sender encrypts with the:",["Sender's private key","Recipient's public key","Sender's public key","Recipient's private key"],1,"Only the recipient's private key can decrypt what their public key encrypted."],[5,"A digital signature provides:",["Integrity and non-repudiation","Confidentiality only","Availability","Anonymity"],0,"Signing gives integrity and non-repudiation."],[5,"The BEST firewall rule philosophy is:",["Default allow","Allow all internal traffic","Default deny, permit only what is required","Block only known threats"],2,"Default deny, and allow only what is required."],[5,"What is the BEST control against phishing?",["Bigger mailboxes","User awareness training with technical filters","Longer passwords only","Disabling all email"],1,"Combine awareness training with technical controls."],[5,"An intrusion prevention system (IPS) differs from an IDS because it:",["Only logs events","Is cheaper","Does not inspect traffic","Can actively block malicious traffic"],3,"An IPS can block, while an IDS detects and alerts."],[5,"The principle of least privilege means users have:",["Only the access needed to do their jobs","Admin rights for convenience","Access to all non-sensitive data","Shared accounts"],0,"Access is limited to what the job requires."],[5,"Which authentication is STRONGEST?",["Long password","Security questions","Multi-factor authentication","Shared token"],2,"Multiple factors beat any single factor."],[5,"The BEST protection against SQL injection is:",["Longer database passwords","Parameterized queries with input validation","Firewall logging","Daily backups"],1,"Parameterized queries plus input validation."],[5,"Who is responsible for classifying data?",["Data owner","System administrator","Security guard","Data custodian"],0,"The data owner classifies; the custodian protects."],[5,"A certificate revocation list (CRL) is used to:",["Encrypt data","Generate keys","Identify certificates that are no longer valid","Store passwords"],2,"A CRL lists revoked certificates."],[5,"For a biometric system, which is the MOST serious concern for security?",["False rejection rate","Enrollment time","Cost","False acceptance rate"],3,"A false acceptance lets an unauthorized person in."],[5,"What is the BEST control for the risk of lost laptops exposing data?",["Full-disk encryption","Cable locks","Asset tags","Warranty"],0,"Encryption protects the data even if the device is lost."],[1,"The audit charter should be approved by:",["The IT manager","The external auditor","Process owners","The board or audit committee"],3,"The charter defines audit authority, so it is approved at the highest level."],[1,"To understand an unfamiliar business process, an auditor should FIRST:",["Test the key controls","Review documentation and perform a walkthrough","Send out a questionnaire only","Interview the CEO"],1,"Understanding the process comes before testing anything."],[1,"The risk that a material error exists before any controls are considered is:",["Control risk","Detection risk","Residual risk","Inherent risk"],3,"Inherent risk assumes no controls at all."],[1,"The risk that the auditor's procedures fail to find a material error is:",["Inherent risk","Control risk","Detection risk","Residual risk"],2,"Detection risk is the risk the auditor misses an error."],[1,"The risk that a control will not prevent or detect an error in time is:",["Control risk","Inherent risk","Detection risk","Sampling risk"],0,"That is control risk."],[1,"Stratified sampling is used to:",["Select every nth item","Select items with no grouping","Divide the population into groups to reduce variance","Test every item"],2,"Grouping similar items reduces variability in the sample."],[1,"Substantive testing is MAINLY designed to:",["Test whether controls operate","Evaluate policy wording","Check auditor independence","Gather evidence on the accuracy, completeness and validity of data"],3,"Compliance tests check controls; substantive tests check the data itself."],[1,"Compliance tests show that controls are weak. The auditor should:",["Reduce substantive testing","Rely on the controls","Increase substantive testing","Stop the audit"],2,"Weak controls mean more substantive testing is needed."],[1,"Findings are discussed with the auditee before the report is issued MAINLY to:",["Negotiate the rating","Confirm factual accuracy","Get approval of the opinion","Delay the report"],1,"The goal is to confirm the facts are correct, not to negotiate the conclusion."],[1,"When relying on the work of another expert, the auditor should:",["Accept it without review","Ignore it","Assess the expert's competence, independence and the work performed","Hand the opinion over to the expert"],2,"The auditor stays responsible for the opinion."],[1,"A critical control weakness is found during fieldwork. The auditor should:",["Wait for the final report","Fix the control","Ignore it until follow-up","Communicate it promptly to management"],3,"Significant issues are reported promptly, not held for the final report."],[1,"Which technique is BEST for detecting duplicate payments?",["CAATs run on the payment data","Interviews","Policy review","Walkthrough"],0,"Data analysis across the full population finds duplicates."],[1,"A key benefit of control self-assessment (CSA) is that it:",["Replaces the audit function","Gives an independent opinion","Increases process owners' ownership of controls and surfaces risks early","Always lowers cost"],2,"CSA builds ownership and early risk awareness; it does not replace audit."],[1,"A control that identifies an error after it has occurred is:",["Preventive","Corrective","Deterrent","Detective"],3,"Detective controls find problems after the fact."],[1,"An IS audit generally provides:",["Absolute assurance","Reasonable assurance","No assurance","A fraud-free guarantee"],1,"Audits give reasonable, not absolute, assurance."],[1,"What is the BEST way to make sure audit findings are addressed?",["Penalize the auditee","Reissue the report","Follow up on management's action plans","Wait for the next audit"],2,"Follow-up confirms that agreed actions were taken."],[1,"Information gained during an audit should be:",["Shared with other departments","Posted for peers","Published","Kept confidential and used only for audit purposes"],3,"Auditors must protect confidentiality."],[1,"If the required confidence level of a sample increases, the sample size will:",["Decrease","Stay the same","Increase","Become zero"],2,"Higher confidence needs a larger sample."],[2,"An IT steering committee should consist of:",["IT staff only","Auditors","Vendors","Senior business and IT management"],3,"It needs both business and IT leaders to set priorities."],[2,"Data entry duties should be segregated from:",["Printing reports","Authorizing transactions","Attending training","Resetting one's own password"],1,"The person who enters data should not authorize it."],[2,"COBIT is primarily a framework for:",["Network protocols","Encryption","Governance and management of enterprise IT","Project estimating"],2,"COBIT is ISACA's IT governance and management framework."],[2,"ITIL focuses on:",["Software coding","IT service management","Auditing standards","Cryptography"],1,"ITIL is a set of IT service management practices."],[2,"ISO/IEC 27001 specifies requirements for:",["An information security management system","Project management","A service desk","Software testing"],0,"It is the ISMS standard."],[2,"The FIRST step in risk management is to:",["Implement controls","Accept the risk","Monitor","Identify assets, threats and vulnerabilities"],3,"You cannot assess or treat risks you have not identified."],[2,"Buying insurance against a loss is an example of risk:",["Avoidance","Mitigation","Transfer","Acceptance"],2,"Insurance transfers the financial impact."],[2,"Annual loss expectancy (ALE) is calculated as:",["Single loss expectancy x annual rate of occurrence","Asset value x 12","Single loss expectancy / annual rate of occurrence","Threat x control"],0,"ALE = SLE x ARO."],[2,"Which clause is MOST important to an auditor in an outsourcing contract?",["Office location","Right to audit","Vendor logo use","Staff dress code"],1,"Without a right-to-audit clause, the provider cannot be independently assessed."],[2,"Before outsourcing a function, management should FIRST:",["Sign the contract","Select the cheapest vendor","Define requirements and perform due diligence","Release current staff"],2,"Requirements and due diligence come before vendor selection."],[2,"Mandatory vacations help to:",["Reduce payroll","Improve morale only","Speed up processing","Detect irregularities when someone else performs the duties"],3,"Someone else covering the role can expose fraud."],[2,"When an employee is terminated, system access should be removed:",["Within a month","Immediately upon termination","At the next audit","After the exit interview next week"],1,"Delays create an unauthorized access risk."],[2,"The main benefit of enterprise architecture is to:",["Reduce documentation","Increase hardware","Align IT assets and design with business needs","Remove standards"],2,"It aligns IT structure with the business and reduces complexity."],[2,"An IT strategic plan typically covers:",["One day","One week","One hour","Several years, typically 3 to 5"],3,"Strategic plans are long term; tactical plans are shorter."],[2,"Which document gives step-by-step instructions for a task?",["Policy","Standard","Guideline","Procedure"],3,"Procedures describe how to perform a task."],[2,"Which document is mandatory and sets specific requirements?",["Standard","Guideline","Charter","Memo"],0,"Standards are mandatory; guidelines are recommended."],[2,"IT portfolio management primarily ensures that:",["Typing is faster","Cost is always lowest","Vendors are locked in","IT investments are prioritized by business value"],3,"It prioritizes investments by value and risk."],[2,"In a maturity model, the highest level indicates processes that are:",["Ad hoc","Repeatable only","Continuously improved and optimized","Undefined"],2,"The top level is optimized and continuously improving."],[3,"Which approach delivers working software in short iterations with frequent user feedback?",["Waterfall","Big bang","Agile","Parallel run"],2,"That is the core of agile development."],[3,"Function point analysis is used to:",["Test code","Estimate software size","Encrypt data","Schedule backups"],1,"It measures software size from functionality delivered."],[3,"The critical path in a project is:",["The cheapest path","The shortest path","The riskiest tasks","The longest chain of dependent tasks, which sets the minimum duration"],3,"Any delay on the critical path delays the project."],[3,"Running the old and new systems at the same time to compare results is:",["Parallel testing","A pilot","Unit testing","Regression testing"],0,"That is parallel testing."],[3,"Regression testing is performed to:",["Test a brand-new module","Verify that changes did not break existing functions","Measure performance","Install software"],1,"It confirms existing functionality still works after a change."],[3,"Testing without knowledge of the internal code is:",["White-box testing","Unit testing","Code review","Black-box testing"],3,"Black-box tests inputs and outputs only."],[3,"What is the BEST way to make sure a system meets user needs?",["Developer judgment","Vendor assurance","User involvement with formal requirements sign-off","Longer testing only"],2,"Users must be involved in and sign off on requirements."],[3,"Source code escrow protects the customer when:",["Hardware fails","The vendor goes out of business","Passwords are lost","The network is down"],1,"The customer can still obtain the code to maintain the software."],[3,"Scope creep is BEST controlled by:",["Ignoring requests","Adding staff","Skipping testing","Formal change control"],3,"Changes must be evaluated and approved formally."],[3,"Program changes should be moved from test to production by:",["The developer","A separate librarian or release function","The tester","The end user"],1,"Developers should not move their own code into production."],[3,"Input validation (edit) checks are:",["Detective controls","Corrective controls","Preventive controls","Compensating controls"],2,"They stop bad data before it is accepted."],[4,"Which RAID level uses striping with parity?",["RAID 0","RAID 1","RAID 5","JBOD"],2,"RAID 5 stripes data and parity across disks."],[4,"An incremental backup copies:",["Everything every time","Data changed since the last backup of any type","Data changed since the last full backup","Deleted files"],1,"Incremental is since the last backup; differential is since the last full."],[4,"Offsite backup storage should be:",["In the same building","At an employee's home","Under a manager's desk","Geographically separate, with similar security"],3,"It must survive the same disaster as the primary site, and be protected equally."],[4,"A site with hardware and connectivity ready but needing data restored is a:",["Cold site","Warm site","Hot site","Reciprocal agreement"],1,"That describes a warm site."],[4,"The business continuity plan should be approved by:",["Senior management","Developers","Vendors","Auditors"],0,"Senior management owns and approves it."],[4,"The RTO should be:",["Longer than the maximum tolerable downtime","Unrelated to the maximum tolerable downtime","Shorter than the maximum tolerable downtime","Equal to the cost of recovery"],2,"Recovery must finish before the tolerable downtime is exceeded."],[4,"Recovery priorities are BEST determined by:",["IT staff preference","Vendor advice","System age","The business impact analysis"],3,"The BIA ranks processes by business impact."],[4,"The primary goal of incident management is to:",["Find the root cause","Restore normal service as quickly as possible","Approve changes","Plan capacity"],1,"Root cause is problem management's job."],[4,"Changes to production should be:",["Made by anyone","Applied immediately","Authorized, tested and approved before implementation","Documented only if large"],2,"Every change goes through authorization and testing."],[4,"Patch management should include:",["Deploying immediately everywhere","Ignoring patches until audit","Waiting a year","Testing in a non-production environment first"],3,"Test patches first to avoid breaking production."],[4,"Which control BEST ensures batch processing is complete?",["A visual check","Reconciliation of batch control totals","More RAM","Ignoring exceptions"],1,"Control totals confirm all records were processed."],[4,"Referential integrity ensures that:",["Data is encrypted","Queries are fast","Backups are taken","Foreign keys match existing primary keys"],3,"It prevents orphaned records."],[4,"Database normalization reduces:",["Security","Data redundancy","Network latency","Backup time"],1,"Normalization removes duplicated data."],[4,"Database administrator activity should be:",["Unrestricted","Unmonitored","Logged and independently reviewed","Deleted after a week"],2,"DBAs have powerful access, so their actions need independent oversight."],[4,"Routers operate mainly at which OSI layer?",["Layer 2 (data link)","Layer 4 (transport)","Layer 7 (application)","Layer 3 (network)"],3,"Routers forward packets at the network layer."],[4,"Which protocol is connection-oriented?",["UDP","TCP","ICMP","ARP"],1,"TCP sets up connections and guarantees delivery."],[4,"A VPN primarily provides:",["Faster internet","Spam filtering","A secure encrypted tunnel over a public network","Backups"],2,"It protects traffic crossing untrusted networks."],[4,"Switches operate mainly at which OSI layer?",["Layer 1","Layer 7","Layer 5","Layer 2"],3,"Switches forward frames at the data link layer."],[4,"Single points of failure are BEST mitigated by:",["Redundant components","More users","Longer cables","A bigger logo"],0,"Redundancy removes the single point."],[4,"The MOST significant risk of virtualization is that:",["Cost is lower","Power use is lower","Compromise of the hypervisor can affect all virtual machines","There are fewer servers"],2,"One weak layer exposes every guest."],[4,"In a SaaS model, the customer remains responsible for:",["The physical data center","Its data and user access management","The hypervisor","Network hardware"],1,"The provider runs the stack; the customer owns its data and access."],[4,"A SOC 2 Type II report tests:",["Control design at a single point in time","Financial statements","Nothing","Operating effectiveness of controls over a period"],3,"Type II covers operating effectiveness over time."],[4,"The help desk's primary function is to:",["Design systems","Test code","Be the single point of contact for logging incidents","Audit users"],2,"It is the first point of contact for incidents."],[4,"Which wireless security protocol is the WEAKEST?",["WPA2","WEP","WPA3","WPA2-Enterprise"],1,"WEP is easily broken."],[4,"Backup restoration should be tested:",["Never","Only after a disaster","Once per decade","Periodically, to verify backups can actually be restored"],3,"An untested backup is not proven."],[4,"A major weakness of a reciprocal agreement is that:",["The cost is high","Compatibility and availability may not be guaranteed","It is slow to sign","It needs many staff"],1,"The partner may not have capacity or compatible systems when you need it."],[5,"An advantage of symmetric encryption is that it:",["Solves key distribution","Provides non-repudiation","Is faster for large volumes of data","Uses key pairs"],2,"Symmetric is fast but has a key distribution problem."],[5,"Hashing provides:",["Confidentiality","Integrity","Availability","User authentication"],1,"A changed hash shows data was altered."],[5,"Which of these is a hashing algorithm?",["AES","RSA","3DES","SHA-256"],3,"AES, RSA and 3DES are encryption algorithms."],[5,"A certificate authority:",["Encrypts email","Issues and verifies digital certificates","Stores passwords","Blocks malware"],1,"The CA vouches for the identity bound to a public key."],[5,"A man-in-the-middle attack is BEST prevented by:",["Backups","Screen locks","TLS with proper certificate validation","Longer passwords"],2,"Validated certificates authenticate the other party."],[5,"A denial-of-service attack primarily affects:",["Availability","Confidentiality","Integrity","Non-repudiation"],0,"It makes systems unavailable."],[5,"Social engineering is BEST addressed by:",["Larger firewalls","Security awareness training","Faster CPUs","More backups"],1,"It targets people, so people need training."],[5,"Which control tracks the state of connections?",["A packet filter that ignores state","A hub","A stateful inspection firewall","A repeater"],2,"Stateful firewalls track connection state."],[5,"The purpose of a DMZ is to:",["Store backups","Encrypt data","Speed up traffic","Isolate public-facing servers from the internal network"],3,"A compromise of exposed servers should not reach the internal network."],[5,"The purpose of a honeypot is to:",["Attract and study attackers","Block email","Encrypt data","Back up files"],0,"It is a decoy used to observe attacks."],[5,"Before a penetration test begins, there must be:",["A surprise for the staff","Written authorization and a defined scope","Employee consent only","No approval"],1,"Authorization and scope protect both parties."],[5,"Vulnerability scanning identifies:",["Employee behavior","Fraud","Zero-day attacks only","Known weaknesses in systems"],3,"Scanners look for known vulnerabilities."],[5,"The equal error rate of a biometric system is:",["Its maximum cost","Its enrollment time","The point where false acceptance equals false rejection","Its speed"],2,"It is the crossover point, used to compare systems."],[5,"Role-based access control (RBAC):",["Eliminates passwords","Simplifies access administration by grouping permissions into roles","Encrypts data","Speeds up the network"],1,"Users get access through roles, which is easier to manage and review."],[5,"Periodic user access reviews MOST directly detect:",["Excessive or outdated access (privilege creep)","Malware","Hardware faults","Fraud only"],0,"They find access that no longer matches the job."],[5,"The main risk of single sign-on is that:",["Logins are slower","Users need extra passwords","One compromised credential exposes multiple systems","Cost is higher"],2,"One credential becomes the key to everything."],[5,"The purpose of data loss prevention (DLP) is to:",["Prevent unauthorized exfiltration of sensitive data","Back up data","Speed up patching","Encrypt hardware"],0,"DLP stops sensitive data leaving the organization."],[5,"The BEST control for a BYOD program is:",["Banning all phones","Mobile device management with encryption and remote wipe","Cable locks","Doing nothing"],1,"MDM lets the organization enforce controls on personal devices."],[5,"Security logs should be protected from:",["Reading by auditors","Archiving","Modification and deletion","Backup"],2,"Logs lose their value if they can be altered."],[5,"A SIEM is used to:",["Encrypt data","Patch systems","Back up files","Correlate and analyze logs to detect security events"],3,"It centralizes and correlates log data."],[5,"After an incident is detected and analyzed, the next phase is usually:",["Lessons learned","Preparation","Containment","Recovery"],2,"Contain the damage before eradicating and recovering."],[5,"Chain of custody ensures:",["Evidence integrity and admissibility","A faster investigation","Encryption","Backups"],0,"It documents who handled evidence, so it stays credible."],[5,"What is the FIRST step in preserving evidence from a computer?",["Run a virus scan on the original","Create a bit-for-bit image and work from the copy","Delete temporary files","Reboot the machine"],1,"Preserve the original and analyze a forensic copy."],[5,"A mantrap (turnstile) primarily prevents:",["Malware","SQL injection","Phishing","Piggybacking (tailgating)"],3,"It lets only one person through at a time."],[5,"Which fire suppression is generally preferred in a data center?",["Wet-pipe water only","Foam","Dry-pipe sprinklers or a clean-agent gas system","No suppression"],2,"Water in the pipes above equipment is a risk; dry-pipe or gas is safer."],[5,"The purpose of data classification is to:",["Apply controls proportionate to sensitivity","Reduce data volume","Speed up systems","Delete data"],0,"Protection should match the value and sensitivity of the data."],[5,"The principle of data minimization means:",["Collect everything","Sell the data","Collect only the data necessary for the purpose","Keep data forever"],2,"Collect and keep only what you need."]]},"2":{"title":"Quiz 2: 150 scenario questions","desc":"Harder, scenario-style questions in the exam's FIRST, BEST and MOST style.","raw":[[1,"The CFO asks the auditor to remove a finding on weak access controls from the draft report because a fix is planned for next quarter. What should the auditor do?",["Remove it, since remediation is planned","Keep the finding and include management's response and target date","Downgrade it to a verbal comment","Hold the report until the fix is done"],1,"A planned fix does not remove a finding. It goes into management's response."],[1,"A key financial application was replaced mid-year. How should the auditor test controls for the full audit period?",["Test only the new system","Test only the old system","Test both systems and the data conversion at cutover","Rely on a management representation"],2,"The audit period spans both systems, and the cutover is a risk point."],[1,"The auditee gives the auditor a system-generated report to use as the population for sampling. What should the auditor do FIRST?",["Start sampling","Validate the report's completeness and accuracy, including its parameters and source","Ask the auditee to sign it","Use a smaller sample"],1,"A sample drawn from an incomplete population gives unreliable conclusions."],[1,"The auditor must find out whether ANY unauthorized vendor exists in the vendor master file, where even one case would be significant. Which technique fits BEST?",["Variable sampling","Stratified mean estimation","Judgmental skipping","Discovery sampling"],3,"Discovery sampling is used when a single occurrence matters and the expected rate is near zero."],[1,"While auditing the infrastructure team, the auditor is offered a paid consulting role by the CIO to design that team's controls. What is the BEST response?",["Decline the role and report the offer to the audit manager","Accept and disclose later","Accept after the audit ends","Accept if the audit firm is paid"],0,"Designing controls and then auditing them is a self-review threat to independence."],[1,"Management refuses to give the auditor access to a critical server's logs, citing confidentiality. What should the auditor do?",["Finish the report without mentioning it","Obtain the logs by covert means","Escalate to senior management or the audit committee, and report a scope limitation if unresolved","Cancel the audit"],2,"Escalate through proper channels, and disclose the limitation if it stays unresolved."],[1,"The auditor wants to rely on a service provider's SOC report. What is MOST important to check?",["Whether the report covers the audit period, the relevant services, exceptions and user-entity controls","The length of the report","The provider's marketing claims","The auditor's name on the cover"],0,"Relevance depends on period, scope, noted exceptions and the controls the customer must perform."],[1,"A sample test shows an error rate above the tolerable rate. The auditor should conclude that:",["The control can be relied on","The control cannot be relied on as designed, so extend testing and report","The tolerable rate should be raised","The sample can be ignored"],1,"Exceeding the tolerable rate means the control is not reliable."],[1,"Data analytics shows many payments just below the approval limit, all to the same vendor. What should the auditor do?",["Treat it as a coincidence","Tell the accounts payable clerk","Analyze further and report the suspicion to the appropriate level per policy","Call the vendor directly"],2,"Possible fraud is reported through proper channels, not confronted directly."],[1,"A company processes millions of transactions daily, and the auditor wants anomalies flagged as they happen. Which technique fits BEST?",["Annual sampling","Embedded audit modules for continuous monitoring","A walkthrough","A questionnaire"],1,"Embedded modules monitor transactions in real time."],[1,"Three process owners describe a control differently from the written procedure. What should the auditor do NEXT?",["Accept the documented version","Use the most senior person's version","Walk through and test how the control actually operates","Stop the audit"],2,"Observed operation beats claims and documents."],[1,"Several low-rated weaknesses were found in the same area. What is the BEST reporting approach?",["Ignore all of them","Consider their combined effect and report them together if the aggregate risk is significant","Report only the largest","Wait until next year"],1,"Individually minor weaknesses can add up to a significant risk."],[1,"The auditor must assess compliance with a law in a country whose rules they do not know. What is the BEST action?",["Assume it matches home-country law","Skip the area","Ask the auditee to decide","Consult legal or compliance specialists"],3,"Get expert input on legal matters instead of assuming."],[1,"Which input BEST helps the auditor rank 100 applications for the audit plan?",["Alphabetical order","Application age","A risk ranking based on criticality, data sensitivity, change activity and past findings","Licensing cost"],2,"Audit priority follows risk."],[1,"Management says a critical finding is fixed and supplies only an email. What should the auditor do?",["Close the finding","Verify the fix independently before closing","Close it with a note","Ask for a second email"],1,"Remediation claims need independent verification."],[1,"A control is performed informally with no documentation. Which evidence is BEST?",["Observation and re-performance","The policy","Training slides","An organization chart"],0,"Direct observation and re-performance show what actually happens."],[1,"What is the MOST important quality of audit workpapers?",["They are long and detailed","They are well formatted","They are signed by the auditee","They let an independent reviewer follow the work, evidence and conclusions"],3,"Workpapers must support the conclusions and be reviewable."],[1,"Only HR can add employees through the payroll application, but a DBA can insert records directly in the database. What should the auditor conclude?",["The control is effective","The DBA is trusted, so there is no issue","The control can be bypassed, so look for compensating controls or report a weakness","Nothing needs reporting"],2,"A control that can be bypassed is not effective without compensating controls."],[1,"When judging whether a weakness is material, the auditor should consider:",["Potential business impact, including regulatory and reputational effects","Only the dollar amount","The number of users","The auditor's workload"],0,"Materiality includes qualitative as well as financial impact."],[1,"The auditor samples every 20th item from a list in which every 20th item is a month-end adjustment. What is the main concern?",["Bias from a pattern in the population","The sample is too large","The list is incomplete","None"],0,"Systematic selection can line up with a repeating pattern."],[1,"Before running CAATs against production data, the auditor should FIRST:",["Run them on the live database","Ask for administrator rights","Delete test data","Get read-only access or a copy and confirm the data's completeness and integrity"],3,"Protect production, and make sure the analyzed data is complete."],[1,"After fieldwork, management asks the auditor to pick the remediation tool to buy. What should the auditor do?",["Choose the tool","Recommend a vendor","Give general advice on control objectives but not choose or implement the solution","Refuse any discussion"],2,"Choosing the solution would impair independence."],[1,"A business unit was rated low risk, but it holds the only copy of customer data. What should the auditor do?",["Keep the low rating","Remove it from scope","Ask the unit to rate itself","Reassess the rating because the potential impact is high"],3,"Impact must be reflected in the risk rating."],[1,"Which test gives the STRONGEST evidence that an automated calculation works correctly?",["Inquiry","Re-performance with independent test data","Observing a screen","Reading the specification"],1,"Re-performance independently confirms the result."],[1,"Compared with judgmental sampling, statistical sampling MAINLY lets the auditor:",["Objectively quantify sampling risk","Avoid all judgment","Test the whole population","Skip documentation"],0,"It provides a measurable confidence level and error range."],[1,"The auditor finds that the CFO overrode a key control. Who should receive the report?",["The CFO","The audit committee or board","The press","Peers in the department"],1,"Management override must be reported above the level of the person involved."],[1,"An IT policy conflicts with a new regulation. What should the auditor do?",["Ignore it","Rewrite the policy","Enforce the regulation personally","Report the non-compliance and recommend management update the policy"],3,"Auditors report and recommend; management owns the policy."],[2,"The board wants to know whether IT investments deliver the promised benefits. What helps MOST?",["A count of completed projects","Server utilization reports","Staff hours logged","Benefits realization tracking against the business case"],3,"Benefits are tracked against the business case over the lifecycle."],[2,"The IT strategy was written by IT alone, with no business input. The GREATEST risk is:",["Higher cost","Misalignment with business objectives","Lower staff morale","Poor documentation"],1,"Without the business, IT strategy drifts from business goals."],[2,"A company stops selling a product because its risk is too high. This is risk:",["Acceptance","Transfer","Avoidance","Mitigation"],2,"Avoidance means ceasing the risky activity."],[2,"Residual risk still exceeds the risk appetite after controls. What should happen NEXT?",["Further treatment or a formal decision by senior management","Quietly lower the rating","Remove the metric","Do nothing"],0,"Risk above appetite needs more treatment or a formal decision."],[2,"Which role implements and maintains controls over data on behalf of the owner?",["Data owner","Auditor","Data custodian","Help desk"],2,"The custodian protects the data; the owner decides how it is classified and used."],[2,"To keep information security independent of IT operations, it should report to:",["The operations manager","Senior management outside IT","The DBA","The help desk lead"],1,"Independence avoids conflict with operational priorities."],[2,"A company adopts an outsourced SaaS CRM. What should compliance confirm FIRST?",["The contract allows audit and meets data protection laws where data is stored","The user interface","The price","The vendor logo"],0,"Legal and audit rights come before convenience."],[2,"A BCP has not been updated in four years despite a merger. The main risk is that the plan:",["Costs too much","Is disliked by auditors","No longer reflects the current business","Has too many pages"],2,"An outdated plan will not match what must be recovered."],[2,"Key risk indicators (KRIs) are used to:",["Measure past performance only","Replace audits","Allocate the budget","Give early warning that risk is nearing tolerance"],3,"KRIs are forward-looking warning signals."],[2,"How should IT prioritize competing projects?",["First come, first served","By the most senior requester","By business value and risk","By IT preference"],2,"Portfolio decisions follow value and risk."],[2,"An organization plans to move its help desk offshore. Which risk needs the MOST attention?",["Data protection and cross-border legal exposure","Time zones","Office design","Language training"],0,"Legal and privacy exposure carry the greatest consequences."],[2,"A payroll clerk can create employees and approve payments, and the duties cannot be separated. What is the BEST compensating control?",["A longer password","More training","A bigger team","Independent management review of exception reports"],3,"Independent review compensates when segregation is not possible."],[2,"Which tool BEST clarifies who is responsible and accountable for IT decisions?",["A network diagram","A RACI matrix","A backup log","A test plan"],1,"RACI assigns responsible, accountable, consulted and informed roles."],[2,"Management says IT is at maturity level 3 and targets level 4. The auditor should FIRST:",["Accept the claim","Check only the target","Verify the current level with evidence","Review the budget"],2,"Claimed maturity needs supporting evidence."],[2,"For a cloud-first move, the auditor should FIRST look for:",["An approved cloud strategy backed by a risk assessment and clear owners","A tool list","A contract template","A dashboard"],0,"Governance starts with strategy, risk assessment and ownership."],[2,"IT has overrun its budget three years in a row. The MOST likely governance gap is:",["Staff salaries","Weak cost estimating and portfolio oversight","Weather","Office rent"],1,"Repeated overruns point to estimating and oversight weaknesses."],[2,"What BEST helps the board oversee IT risk?",["Daily system logs","Source code reviews","Help desk tickets","Regular reporting with KRIs aligned to the risk appetite"],3,"Boards need summarized, risk-based reporting."],[2,"A new privacy regulation applies. Who is responsible for deciding its impact on IT?",["The help desk","The external auditor","Management, with legal and compliance","The vendor"],2,"Management owns compliance decisions; the auditor reviews them."],[2,"Management keeps granting exceptions to the password policy. What should the auditor recommend?",["A formal exception process with risk acceptance, expiry dates and a policy review","Delete the policy","Ignore the exceptions","Stop auditing the area"],0,"Repeated exceptions suggest the policy or the process needs attention."],[2,"A company outsources software development. Which provision BEST protects its intellectual property?",["A lower price","Regular meetings","Ownership of deliverables and source code escrow","Vendor logo use"],2,"Contract terms must secure ownership and access to the code."],[2,"In the three lines model, which function gives independent assurance?",["Operations","Risk management","Compliance","Internal audit"],3,"Internal audit is the independent third line."],[2,"Which hiring control BEST reduces insider risk?",["Shorter interviews","Role-appropriate background checks","Free equipment","Faster offers"],1,"Screening should match the sensitivity of the role."],[2,"IT has no inventory of information assets. What is the GREATEST impact?",["Assets cannot be properly classified, protected or assigned owners","Lower costs","A slower help desk","No impact"],0,"You cannot protect what you have not identified."],[2,"Risk appetite is BEST described as:",["Risk left after controls","The total exposure","The cost of controls","The amount and type of risk the organization will accept to meet its objectives"],3,"Appetite is a strategic statement of acceptable risk."],[2,"The CIO reports to the CFO and IT is treated only as a cost center. The concern is:",["Compensation levels","IT may not be treated as a strategic enabler, weakening alignment","Hardware age","Nothing"],1,"Cost-center thinking can weaken strategic alignment."],[2,"What BEST shows staff understand security responsibilities?",["A memo","Posters","Role-based training with tested comprehension and records","A group email"],2,"Tested, recorded, role-based training gives evidence."],[2,"A merchant outsources payment processing but stores some cardholder data itself. Who is responsible for protecting the data it stores?",["Only the processor","The merchant remains responsible","Only the bank","No one"],1,"Outsourcing does not transfer accountability for data you hold."],[3,"A project has spent 80% of its budget but is only 50% complete. What should the steering committee do?",["Add features","Re-baseline, reassess the business case, and decide to continue, rescope or stop","Cut testing","Ignore it"],1,"Reassess the business case before spending more."],[3,"Users say they were never consulted on requirements. The main risk is that the system:",["May not meet business needs and be rejected","Will cost less","Will run faster","Needs less testing"],0,"Missing user input is a leading cause of project failure."],[3,"A developer can both change code and deploy it to production. What is the BEST control?",["A longer password","More backups","More training","Deployment by an independent release function with approval"],3,"Developers should not move their own code to production."],[3,"UAT found serious defects, but management wants to go live on schedule. What should the auditor recommend?",["Go live as planned","Skip UAT","Fix critical defects or obtain formal risk acceptance with a rollback plan","Blame the testers"],2,"Go-live with known critical defects needs a fix or a formal, informed decision."],[3,"Which BEST shows migrated data was transformed accurately?",["Validating transformed fields against source data, with business sign-off","A vendor assurance","Counting tables","Reviewing the schedule"],0,"Field-level validation by the business confirms accuracy."],[3,"An agile project has little formal documentation. What should the auditor do?",["Insist on waterfall-style documents","Fail the project","Ignore controls","Check whether approvals, testing and change tracking are evidenced in the team's tools"],3,"Agile still needs control evidence, often held in tooling."],[3,"A package is heavily customized. The main risk is:",["Lower cost","Faster upgrades","Difficult upgrades and loss of vendor support","Better security"],2,"Heavy customization makes patches and upgrades hard."],[3,"Which is MOST important when evaluating software RFP responses?",["Fit to requirements, vendor viability, security, support and total cost","Interface color","Brochure quality","Vendor size alone"],0,"Evaluate against requirements and total cost of ownership."],[3,"What BEST ensures a new system meets security requirements before release?",["A management memo","Security testing built into the development lifecycle","Daily meetings","Testing after release"],1,"Security testing belongs inside the lifecycle."],[3,"Why should test environments avoid live personal data?",["It is slower","It is smaller","It costs more","It exposes private data, so masked data should be used"],3,"Test systems usually have weaker protection."],[3,"A project has no phase-end reviews. The main risk is that:",["Costs fall","Problems are not found early and compound","Speed drops","Nothing changes"],1,"Stage gates catch issues before they grow."],[3,"Which control BEST prevents a transaction from being processed twice?",["Encryption","A password","A duplicate check or sequence control","A firewall"],2,"Duplicate and sequence checks detect repeats."],[3,"Which ERP cutover approach has the lowest risk but the highest cost?",["Parallel run","Big bang","Direct cutover","Abrupt change"],0,"Running both systems costs more but allows comparison and fallback."],[3,"A post-implementation review was done only by the project team. The concern is:",["Cost","Length","Timing","Objectivity"],3,"Reviewers of their own work lack objectivity."],[3,"Final approval to move a new application to production should come from:",["The developer","The DBA","The business owner, based on test results","The auditor"],2,"The business owner accepts the system."],[3,"Which technique assesses the effect of a requirements change on cost and schedule?",["Penetration testing","Change impact analysis","Backup review","Patching"],1,"Impact analysis quantifies the effect of a change."],[3,"Version control over source code BEST prevents:",["Untracked or unauthorized changes, and enables rollback","Slow builds","Hardware failure","Network outages"],0,"It records who changed what and allows recovery."],[3,"A user-approved prototype is moved straight into production. The main risk is:",["Too much documentation","Better testing","Excess cost","Weak controls, testing and documentation"],3,"Prototypes often lack production-grade controls."],[4,"The RTO is 4 hours but a restore from backup takes 8 hours. What should be done?",["Accept the gap","Quietly change the RTO","Redesign recovery, for example with replication or an alternate site, to meet the RTO","Delete old data"],2,"The recovery method must meet the stated objective."],[4,"A hot site contract guarantees room for 5 systems but 20 are critical. The concern is:",["Capacity may not cover all critical systems in a regional disaster","The color of the equipment","Contract length","Nothing"],0,"Shared recovery capacity can be exhausted."],[4,"A BCP was tested only with a tabletop exercise. This provides:",["Full proof of recovery","Complete assurance","No value","Limited assurance, since it checks plan logic and not actual recovery ability"],3,"Tabletops do not prove technical recovery."],[4,"A DR plan's contact list was last updated two years ago. The auditor should recommend:",["Leaving it as is","Reviewing and updating contacts regularly","Removing the list","Printing it larger"],1,"Stale contacts delay response."],[4,"Backup tapes are sent offsite by courier. The auditor's MAIN concern is:",["Courier uniforms","Speed","Encryption and chain of custody","Tape color"],2,"Tapes can be lost or stolen in transit."],[4,"Ransomware encrypted file servers and the network-attached backups. Which control would have helped MOST?",["Offline or immutable backups","Longer passwords","More RAM","Larger monitors"],0,"Backups attackers cannot reach survive the attack."],[4,"Users report slow performance repeatedly and tickets are closed without root cause. Which process is missing?",["Release management","Incident management","Problem management","Asset management"],2,"Problem management finds and fixes root causes."],[4,"Peak CPU use is 85% and demand grows 30% a year. What should the auditor recommend?",["Wait for a failure","Reduce users","Do nothing","Plan capacity upgrades before thresholds are breached"],3,"Capacity management is proactive."],[4,"The provider's SLA report shows 99.9% uptime but users see outages. What should the auditor do?",["Accept the report","Cancel the contract","Verify uptime independently using monitoring data and logs","Ignore users"],2,"Self-reported SLA data needs independent verification."],[4,"A change skipped CAB approval but worked. The auditor should report it as:",["A control weakness despite the good outcome","Acceptable","Excellent practice","Not worth noting"],0,"A good outcome does not excuse bypassing the process."],[4,"Which control BEST detects unauthorized changes to critical system files?",["Backups","Antivirus","Firewall","File integrity monitoring"],3,"It alerts when monitored files change."],[4,"A DBA needs emergency access to production data. What is the BEST control?",["Privileged access management with approval, session logging and review","A shared admin account","Standing admin rights","No control needed"],0,"Emergency access should be approved, monitored and reviewed."],[4,"An operator reruns a failed overnight batch job without logging it. The risk is:",["No risk","Duplicate or missing processing with no audit trail","Faster jobs","Lower cost"],1,"Unlogged reruns can duplicate or skip data."],[4,"Which log weakness hurts forensic work MOST?",["Large file size","Color coding","Inconsistent time stamps across systems","Verbose messages"],2,"Events cannot be sequenced without consistent time."],[4,"Management says RAID 5 removes the need for backups. The auditor should reply that RAID:",["Replaces backups","Is not a storage method","Is only for tapes","Protects against disk failure, not deletion, corruption, ransomware or disaster"],3,"RAID is redundancy, not backup."],[4,"A critical server fails and replacement hardware takes six weeks to arrive. What is the BEST advance measure?",["Hope it never fails","Keep spares or a contracted replacement SLA that fits the RTO","Order after a failure","Shorten the RTO on paper"],1,"Replacement lead time must fit within the RTO."],[4,"Which control BEST limits lateral movement after one workstation is compromised?",["Network segmentation with least-privilege rules","Larger disks","Screen savers","Antivirus alone"],0,"Segmentation contains the spread."],[4,"A cloud region outage took down a single-region application. Which design helps MOST?",["More tapes","Bigger laptops","Faster typing","Deployment across multiple regions or availability zones"],3,"Geographic redundancy limits single-region failure."],[4,"A rogue wireless access point is found. What is the BEST preventive control?",["Regular wireless scans plus network access control","Hiding the logo","Longer cables","Fewer users"],0,"Scanning finds rogues; NAC blocks them."],[4,"A team wants to bypass change control for 'minor' changes. What should the auditor recommend?",["Allow the bypass","Cancel the process","Define change categories with proportionate approvals","Approve changes at random"],2,"Standard and low-risk categories can use lighter approval, not none."],[4,"Retired disks are discarded after files are deleted through the operating system. The risk is that:",["Nothing remains","Data can be recovered, so secure wiping or destruction is needed","Disks are heavy","Disks cost more"],1,"Normal deletion does not remove the data."],[4,"A critical vendor goes bankrupt. Which existing control helps MOST?",["More vendors only","A bigger budget","Insurance only","Source code escrow and an exit plan in the contract"],3,"Escrow and exit terms keep you operational."],[4,"A monitoring tool raises 5,000 alerts daily and staff ignore them. The problem is:",["Alert fatigue; thresholds should be tuned and alerts prioritized","Good coverage","Too few staff","No problem"],0,"Excess noise hides real incidents."],[4,"Which metric BEST shows service desk effectiveness?",["Number of calls","Staff count","First-contact resolution rate and time to resolve","Phone brand"],2,"Resolution outcomes matter more than volume."],[4,"A DR test restores data that is 2 days old, but the RPO is 4 hours. The conclusion is:",["RPO met","Raise the RPO silently","No issue","RPO not met; backup or replication frequency must increase"],3,"Data loss exceeded the tolerance."],[4,"During a BCP test, critical staff cannot access systems remotely. This reveals:",["No gap","A gap in remote work capability","Excess capacity","A hardware fault"],1,"The plan did not provide for remote access."],[4,"A company keeps all email indefinitely. The GREATEST concern is:",["Disk cost","Faster search","Legal discovery and privacy exposure, so a retention policy is needed","Easier backup"],2,"Unlimited retention increases legal and privacy risk."],[4,"Who should be able to change the production job schedule?",["Authorized scheduling staff, with approved and logged changes","Developers","Any user","Vendors"],0,"Production scheduling needs restricted, logged access."],[4,"Two data centers are 5 km apart in the same flood zone. The concern is that:",["They are too close to staff","One regional event could affect both","They cost less","They share a logo"],1,"Sites should be far enough apart to avoid a shared disaster."],[4,"An active-passive failover cluster MAINLY protects against:",["Data deletion","Phishing","Policy violations","Server or hardware failure, with minimal downtime"],3,"Failover keeps service running when a node fails."],[4,"An operating system in production has reached end of life with no vendor support. What is BEST?",["Ignore it","Plan migration, or isolate it and add compensating controls","Hide it","Extend its life indefinitely"],1,"Unsupported systems no longer receive security fixes."],[4,"Servers drift from their approved configuration baseline. What is BEST?",["Automated configuration compliance scanning with remediation","Guessing","Yearly manual checks","Ignoring drift"],0,"Automation detects and corrects drift continuously."],[4,"Which BEST indicates a mature incident response process?",["Reliance on one expert","No documentation","Ad hoc phone calls","Tested playbooks with defined roles, escalation and post-incident reviews"],3,"Maturity shows in tested, repeatable, reviewed processes."],[4,"Production and test systems share the same network and database. What is the main risk?",["Test activity can corrupt or expose production data","Faster testing","Lower cost","No risk"],0,"Test and production environments should be separated."],[4,"DR depends on one person's undocumented knowledge. The risk is:",["Key-person dependency, so documentation and cross-training are needed","None","Lower cost","Faster recovery"],0,"Recovery fails if that person is unavailable."],[4,"Mean time to repair (MTTR) measures:",["Average time between failures","Cost of repair","Number of users","Average time to restore a failed service"],3,"MTTR is the average time to restore."],[4,"Which design BEST protects against a single fiber cut isolating a site?",["One thick cable","A bigger router","Diverse physical routes from separate providers","More Wi-Fi"],2,"Physically diverse paths remove the single point of failure."],[4,"Which BCP test BEST reveals weaknesses when key staff are unavailable?",["The same test yearly","A scenario test where key personnel are unavailable","A read-through","A meeting"],1,"Realistic scenarios expose dependencies on people."],[4,"A business needs almost no data loss and recovery within minutes. Which strategy fits BEST?",["Cold site with weekly tapes","Reciprocal agreement","Warm site with daily backups","Hot site with real-time data replication"],3,"Tight RTO and RPO need a hot site with continuous replication."],[5,"A company encrypts files with a symmetric key and emails the key to the recipient along with the encrypted file. What is the MAIN weakness?",["Symmetric encryption is too slow","The key travels with the data, so anyone who intercepts both can decrypt it","The file is too large","The algorithm is public"],1,"Keys must be distributed separately and securely from the data."],[5,"Two parties who have never met must exchange confidential data over the internet. Which approach is BEST?",["Use public key encryption to exchange a symmetric session key","Email a shared password","Use a long file name","Send the data unencrypted over a private link"],0,"Hybrid encryption combines secure key exchange with fast symmetric encryption."],[5,"In a public key infrastructure, the registration authority:",["Issues the private keys","Stores all passwords","Verifies the identity of certificate requesters before the CA issues certificates","Revokes all certificates automatically"],2,"The RA vets identities on behalf of the CA."],[5,"Which gives the BEST assurance that a website is operated by the organization it claims to be?",["It loads quickly","It has a long address","It shows a padlock icon only","A valid certificate from a trusted CA that matches the domain"],3,"A trusted CA-issued certificate matching the domain authenticates the site."],[5,"An employee reports a lost smartphone that holds corporate email. What should be done FIRST?",["Remotely lock or wipe the device per policy","Wait a week","Issue a new phone only","Change the email signature"],0,"Limit exposure immediately."],[5,"Which approach BEST secures a corporate wireless network?",["A hidden network name","MAC address filtering alone","WPA2 or WPA3 Enterprise with individual user authentication","A shared password posted on the wall"],2,"Individual authentication gives accountability and strong encryption."],[5,"An auditor finds an 'allow any any' rule at the end of a firewall rule set. What is the concern?",["It speeds up the firewall","It reduces logging","It blocks all traffic","It defeats the default-deny posture and permits traffic that was never explicitly approved"],3,"A final allow-all rule negates default deny."],[5,"Which type of firewall can inspect the content of application-layer traffic?",["A basic packet filter","An application-level gateway (proxy)","A hub","A repeater"],1,"Application gateways examine application data, not just addresses and ports."],[5,"An IDS is placed outside the firewall, facing the internet. What is the main drawback?",["It cannot see traffic","It breaks encryption","It generates many alerts for attacks the firewall would have blocked","It blocks all email"],2,"It produces noise from attacks that never reach the internal network."],[5,"Antimalware software is MOST effective when:",["Its signatures and engine are updated automatically and frequently","It is installed once and left alone","It is turned off for speed","It runs only on servers"],0,"Outdated signatures miss new threats."],[5,"An employee moves from accounting to sales and keeps the old access rights. Which principle is violated, and what is the BEST control?",["Availability; add backups","Least privilege; re-evaluate and adjust access when roles change","Integrity; add hashing","Confidentiality; add posters"],1,"Access should be reviewed and adjusted on job changes."],[5,"Which control BEST protects against password guessing attacks?",["Longer screen savers","Larger monitors","Account lockout after a limited number of failed attempts","More frequent backups"],2,"Lockout limits repeated guessing."],[5,"A biometric system has a high false rejection rate. The main impact is that:",["Unauthorized users gain access","Authorized users are denied access, hurting availability and productivity","Data is deleted","Passwords are exposed"],1,"A high FRR locks out legitimate users; a high FAR admits the wrong ones."],[5,"Data classified as restricted is found on a shared drive open to all staff. What should the auditor recommend?",["Delete the data","Rename the folder","Restrict access according to the classification and the data owner's decisions","Add a larger drive"],2,"Access must match the classification."],[5,"A company collected customer data for billing and now wants to use it for marketing. Which principle is MOST relevant?",["Purpose limitation: use data only for the purpose it was collected for, unless consent is obtained","Availability","Normalization","Redundancy"],0,"New uses need a legal basis or consent."],[5,"A cloud provider will store the company's data in another country. What is the PRIMARY concern?",["Network speed","Jurisdiction and the data protection laws that apply to the data","Screen resolution","Logo color"],1,"Data location determines which laws apply."],[5,"Which control BEST reduces data leakage through USB drives?",["Disabling the monitor","Larger drives","Longer cables","Restricting removable media and requiring encryption on approved devices"],3,"Control the media and protect what is written to it."],[5,"After a data breach, who should authorize disclosure to regulators and the public?",["Any employee","Help desk staff","The auditor","Senior management with legal and communications, following the incident plan"],3,"External disclosure follows a defined, authorized process."],[5,"During a forensic investigation of a running machine, which evidence should be collected FIRST?",["The hard disk image","Printed reports","Volatile data such as memory contents","Backup tapes"],2,"Volatile data disappears first, so it is collected first."],[5,"An auditor sees the data center door propped open for cooling. What is the main concern?",["Physical access control is bypassed","Energy use","Door wear","Noise"],0,"An open door defeats physical access controls."],[5,"The main purpose of an uninterruptible power supply (UPS) is to:",["Increase network speed","Provide short-term power so systems can keep running or shut down gracefully","Replace backups","Cool the data center"],1,"A UPS bridges power loss until a generator starts or systems shut down."],[5,"Where is the BEST place for a data center?",["Next to the street with visible signs","In a basement prone to flooding","Beside the kitchen","In an interior area without windows, away from flood and fire risks"],3,"Avoid flood, fire and external exposure, and avoid advertising the location."],[5,"Which protocol suite provides authentication and encryption for IP traffic in a VPN?",["IPsec","FTP","SNMP","DHCP"],0,"IPsec secures IP packets."],[5,"A caller claims to be from IT and asks a user for their password. What should the user do?",["Give it, because it is IT","Give half of it","Refuse and report it, since IT does not ask for passwords","Ask them to email a request"],2,"This is a social engineering attempt."],[5,"A white-box penetration test differs from a black-box test because the testers:",["Have no information","Are given knowledge of the system, such as design details","Cannot use tools","Test only passwords"],1,"White-box testers start with system knowledge."],[5,"Which activity BEST finds security flaws in code before release?",["Static code analysis and secure code review","Waiting for users to report bugs","Running antivirus","Adding more RAM"],0,"Finding flaws before release is cheaper and safer."],[5,"The information security administrator should NOT be allowed to:",["Review logs","Update antivirus","Approve their own access changes or process business transactions","Run awareness training"],2,"This would break segregation of duties."],[5,"A smart card combined with a PIN is an example of:",["Single-factor authentication","Two-factor authentication","Biometric authentication","Anonymous authentication"],1,"Something you have plus something you know."],[5,"What is MOST important in a cloud contract regarding security incidents?",["Incident notification timeframes and the right to audit","The provider's logo","The brochure design","The number of staff"],0,"You need timely notice and the ability to verify."],[5,"In an IaaS cloud service, who is typically responsible for patching the guest operating system?",["The customer","The cloud provider","The auditor","The regulator"],0,"In IaaS the customer manages everything above the infrastructure."],[5,"Compared with a signature-based IDS, an anomaly-based IDS can:",["Detect new, unknown attacks, but may produce more false positives","Only detect known attacks","Block all traffic","Never generate alerts"],0,"It flags deviations from normal behavior."],[5,"Staff use unapproved cloud storage to share company files. What is the BEST response?",["Ignore it","Dismiss everyone involved","Discover the usage, set policy and provide an approved alternative","Buy more laptops"],2,"Address the need with an approved option and a clear policy."],[5,"Remote employees connect to the VPN from personal home PCs. What is the GREATEST risk?",["Unmanaged endpoints may infect the corporate network, so endpoint compliance should be checked","The VPN is too fast","Home PCs are too slow","No risk"],0,"Unmanaged devices can carry malware onto the network."],[5,"A targeted phishing email aimed at senior executives is called:",["Spam","Whaling","Pharming","Smishing"],1,"Whaling targets senior executives."],[5,"A worm differs from a virus because it:",["Needs a host file","Spreads by itself across networks without attaching to a host program","Is harmless","Only affects printers"],1,"Worms are self-replicating and self-propagating."],[5,"Sensitive printouts are found in recycling bins. What is the BEST control?",["More bins","Secure disposal such as shredding, under a disposal policy","Colored paper","Faster printers"],1,"Paper must be destroyed before disposal."],[5,"In mandatory access control (MAC), access decisions are based on:",["The owner's choice","Security labels and classifications enforced by the system","Password length"

td>Transport<\/td><td>TCP (connection-oriented), UDP (connectionless)<\/td><\/tr><tr><td>3<\/td><td>Network<\/td><td>IP, routers, IPsec<\/td><\/tr><tr><td>2<\/td><td>Data link<\/td><td>Switches, MAC addresses<\/td><\/tr><tr><td>1<\/td><td>Physical<\/td><td>Cables, hubs, repeaters<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tw\"><table><thead><tr><th>Device<\/th><th>Role<\/th><\/tr><\/thead><tbody><tr><td>Hub / repeater<\/td><td>Physical layer, repeats signals to all ports.<\/td><\/tr><tr><td>Switch<\/td><td>Data link layer, forwards frames by MAC address.<\/td><\/tr><tr><td>Router<\/td><td>Network layer, forwards packets between networks.<\/td><\/tr><tr><td>Gateway<\/td><td>Connects networks that use different protocols.<\/td><\/tr><tr><td>Firewall<\/td><td>Filters traffic by rules (see Domain 5).<\/td><\/tr><\/tbody><\/table><\/div><ul><li><b>TCP<\/b> is reliable and connection-oriented. <b>UDP<\/b> is faster and connectionless.<\/li><li>A <b>VPN<\/b> gives an encrypted tunnel over a public network.<\/li><li><b>Network segmentation<\/b> and separate test and production environments limit the spread of problems.<\/li><li>Remove <b>single points of failure<\/b> with redundant components and diverse physical routes for critical links.<\/li><li>Network management uses monitoring, logs and baselines to detect outages and abnormal traffic.<\/li><\/ul><h3>3. IT service management<\/h3><div class=\"tw\"><table><thead><tr><th>Process<\/th><th>Goal<\/th><\/tr><\/thead><tbody><tr><td>Service desk<\/td><td>Single point of contact for logging and tracking incidents.<\/td><\/tr><tr><td>Incident management<\/td><td>Restore normal service as quickly as possible.<\/td><\/tr><tr><td>Problem management<\/td><td>Find and remove the root cause of repeated incidents.<\/td><\/tr><tr><td>Change management<\/td><td>Make changes in a controlled, authorized and tested way.<\/td><\/tr><tr><td>Release management<\/td><td>Plan and move approved changes into production.<\/td><\/tr><tr><td>Configuration management<\/td><td>Keep an accurate record of assets and their relationships.<\/td><\/tr><tr><td>Capacity management<\/td><td>Ensure resources meet current and future demand.<\/td><\/tr><tr><td>Availability management<\/td><td>Ensure services are available as agreed.<\/td><\/tr><tr><td>SLA management<\/td><td>Set measurable service levels and verify them independently.<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Repeated tickets closed without root cause mean <b>problem management<\/b> is missing.<\/li><li><b>First-contact resolution rate<\/b> and time to resolve show service desk effectiveness better than call volume.<\/li><li><b>Change management<\/b>: all changes are authorized, tested and documented. A change that skipped approval is a control weakness even if it worked.<\/li><li><b>Emergency changes<\/b> are implemented fast, then documented and approved after the fact.<\/li><li><b>Patch management<\/b>: assess, test in non-production, deploy in a controlled way. Unsupported (end-of-life) systems need migration or compensating controls.<\/li><li><b>Capacity planning<\/b> acts before thresholds are breached, not after a failure.<\/li><li><b>SLA reports<\/b> from a provider need independent verification.<\/li><\/ul><h3>4. Data storage, RAID and backups<\/h3><div class=\"tw\"><table><thead><tr><th>RAID<\/th><th>Description<\/th><\/tr><\/thead><tbody><tr><td>RAID 0<\/td><td>Striping, no redundancy. Faster but fails if one disk fails.<\/td><\/tr><tr><td>RAID 1<\/td><td>Mirroring. Full copy on a second disk.<\/td><\/tr><tr><td>RAID 5<\/td><td>Striping with parity. Survives one disk failure.<\/td><\/tr><tr><td>RAID 6<\/td><td>Double parity. Survives two disk failures.<\/td><\/tr><tr><td>RAID 10<\/td><td>Mirrored stripes. Performance and redundancy.<\/td><\/tr><\/tbody><\/table><\/div><p class=\"small\">RAID protects against disk failure only. It does not replace backups (it cannot protect against deletion, corruption, ransomware or disaster).<\/p><div class=\"tw\"><table><thead><tr><th>Backup type<\/th><th>What it copies<\/th><th>Restore<\/th><\/tr><\/thead><tbody><tr><td>Full<\/td><td>Everything.<\/td><td>Fastest restore, longest backup.<\/td><\/tr><tr><td>Incremental<\/td><td>Changes since the last backup of any type.<\/td><td>Fastest backup, slowest restore (full plus every increment).<\/td><\/tr><tr><td>Differential<\/td><td>Changes since the last full backup.<\/td><td>Medium. Full plus the latest differential.<\/td><\/tr><\/tbody><\/table><\/div><ul><li><b>Offsite storage<\/b> should be geographically separate, with similar or better security, and backups should be <b>encrypted<\/b> with keys stored safely.<\/li><li><b>Test restores regularly<\/b> to prove backups work. Keep offline or immutable copies to survive ransomware.<\/li><li>Backup frequency should match the <b>RPO<\/b>.<\/li><li><b>Media disposal<\/b> needs secure wiping or destruction, since normal deletion leaves recoverable data.<\/li><\/ul><h3>5. Business continuity and disaster recovery<\/h3><ul><li><b>Business continuity plan (BCP)<\/b> keeps the business running. <b>Disaster recovery plan (DRP)<\/b> restores IT services. DRP supports the BCP.<\/li><li>Senior management owns the policy and approves the plan. The plan must be <b>current<\/b>, especially after mergers or major change.<\/li><li>The <b>business impact analysis (BIA)<\/b> is the first step. It identifies critical processes, dependencies, and the impact of downtime. It sets recovery priorities.<\/li><li><b>Life safety<\/b> is the top priority in any emergency response.<\/li><\/ul><div class=\"tw\"><table><thead><tr><th>Term<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>MTD / MTPD<\/td><td>Maximum tolerable downtime before the business suffers unacceptable harm.<\/td><\/tr><tr><td>RTO<\/td><td>Target time to restore a process or system. Must be shorter than the MTD.<\/td><\/tr><tr><td>RPO<\/td><td>Maximum acceptable data loss, measured in time. Drives backup or replication frequency.<\/td><\/tr><tr><td>WRT<\/td><td>Work recovery time. Time to catch up and verify data after systems return.<\/td><\/tr><\/tbody><\/table><\/div><ul><li>If recovery takes longer than the RTO, <b>redesign recovery<\/b> (replication, faster restore, alternate site). Do not quietly change the RTO.<\/li><li>If restored data is older than the RPO allows, increase backup or replication frequency.<\/li><li>Near-zero data loss and minutes of downtime need a <b>hot site with real-time replication<\/b>.<\/li><li>Replacement hardware lead time must fit inside the RTO. Keep spares or a contracted replacement SLA.<\/li><\/ul><div class=\"tw\"><table><thead><tr><th>Recovery site<\/th><th>Readiness<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td>Hot site<\/td><td>Fully equipped and current. Recovery in minutes or hours.<\/td><td>Highest cost. Check capacity guarantees.<\/td><\/tr><tr><td>Warm site<\/td><td>Hardware and connectivity ready, data must be restored.<\/td><td>Medium cost and time.<\/td><\/tr><tr><td>Cold site<\/td><td>Space and utilities only.<\/td><td>Cheapest, slowest.<\/td><\/tr><tr><td>Mobile site<\/td><td>Self-contained trailer or unit.<\/td><td>Moves to the location needed.<\/td><\/tr><tr><td>Reciprocal agreement<\/td><td>Agreement with another organization to share facilities.<\/td><td>Weak: compatibility and availability may not be guaranteed.<\/td><\/tr><\/tbody><\/table><\/div><ul><li><b>Two sites in the same flood zone or region<\/b> can both be hit by one event. Sites should be far enough apart.<\/li><li><b>Alternate telecom routes<\/b> from separate providers protect against a single cable cut.<\/li><li><b>Key-person dependency<\/b> weakens recovery. Document and cross-train.<\/li><li>Keep contact lists and call trees current.<\/li><\/ul><div class=\"tw\"><table><thead><tr><th>BCP test<\/th><th>What it proves<\/th><\/tr><\/thead><tbody><tr><td>Checklist / desk review<\/td><td>Plan content is complete. Weakest.<\/td><\/tr><tr><td>Walkthrough / tabletop<\/td><td>Plan logic works on paper. Limited assurance, not real recovery.<\/td><\/tr><tr><td>Simulation<\/td><td>Teams respond to a realistic scenario.<\/td><\/tr><tr><td>Parallel test<\/td><td>Recovery site runs alongside production without interrupting it.<\/td><\/tr><tr><td>Full interruption<\/td><td>Production moves to the recovery site. Most realistic, most risky.<\/td><\/tr><\/tbody><\/table><\/div><ul><li>The <b>best evidence a BCP is effective<\/b> is recent, successful test results.<\/li><li><b>Scenario tests<\/b> where key people or remote access are unavailable find hidden weaknesses.<\/li><li>Plan maintenance: update after changes, review regularly, retest, and train staff.<\/li><\/ul><h3>6. Incident handling in operations<\/h3><ul><li><b>Contain first<\/b> (isolate the affected system), then investigate, eradicate and recover.<\/li><li>Keep logs with <b>consistent time stamps<\/b> and protect them from alteration.<\/li><li><b>Alert tuning<\/b>: thousands of ignored alerts mean alert fatigue. Tune thresholds and prioritize.<\/li><li>Detect unauthorized production changes by <b>reconciling change logs to approved change requests<\/b>, and by file integrity monitoring.<\/li><li>Keep <b>test and production separate<\/b>, otherwise test activity can corrupt or expose live data.<\/li><\/ul><div class=\"tip warn\"><strong>Common exam traps in Domain 4<\/strong><ul><li>Starting a BCP with <b>site selection or testing<\/b> instead of a BIA.<\/li><li>Mixing up <b>RTO (time)<\/b> and <b>RPO (data)<\/b>.<\/li><li>Mixing up <b>incident<\/b> management (restore) with <b>problem<\/b> management (root cause).<\/li><li>Treating <b>RAID as a backup<\/b>.<\/li><li>Treating a <b>tabletop<\/b> as proof that recovery works.<\/li><li>Mixing up <b>incremental<\/b> (since last backup) and <b>differential<\/b> (since last full).<\/li><li>Picking <b>wipe or restore<\/b> before containing a malware infection.<\/li><li>Accepting <b>provider-reported SLA<\/b> figures without independent verification.<\/li><\/ul><\/div>"},{"n":5,"name":"Protection of Information Assets","weight":"26%","html":"<p class=\"lead\">This is the other heavy domain. It covers how information is classified and protected: logical access, network security, encryption, malware and attacks, data and mobile security, physical and environmental controls, security monitoring, incident response and forensics. Expect many scenario questions where the BEST control is preventive, layered and matched to risk.<\/p><div class=\"tip\"><strong>Must-know points<\/strong><ul><li><b>CIA<\/b>: confidentiality, integrity, availability. Add authentication, authorization, accountability and non-repudiation.<\/li><li><b>Least privilege<\/b> and <b>default deny<\/b> are the standard answers for access and firewalls.<\/li><li>Encrypt for confidentiality with the <b>recipient's public key<\/b>. Sign with the <b>sender's private key<\/b>.<\/li><li><b>Data owner<\/b> classifies data. <b>Custodian<\/b> protects it.<\/li><li><b>People<\/b> are often the weakest link: awareness training plus technical controls.<\/li><li><b>Contain first<\/b> in an incident, and preserve evidence with a <b>chain of custody<\/b>.<\/li><\/ul><\/div><h3>1. Security governance basics<\/h3><ul><li>Security policy is approved by senior management. Standards and procedures implement it.<\/li><li><b>Data classification<\/b> drives protection. Apply controls proportionate to sensitivity, and enforce them (for example restricted data must not sit on an open shared drive).<\/li><li><b>Information assets<\/b> need an inventory and an owner.<\/li><li><b>Security awareness<\/b> training should be ongoing and role-based, with measurable results.<\/li><li>Security administrators should not process business transactions or approve their own access.<\/li><\/ul><h3>2. Logical access controls<\/h3><ul><li>Three authentication factors: <b>something you know<\/b> (password), <b>something you have<\/b> (token, smart card), <b>something you are<\/b> (biometric). <b>Multi-factor<\/b> uses two or more different types. A smart card plus PIN is two-factor.<\/li><li><b>Password controls<\/b>: adequate length, no reuse of weak or breached passwords, <b>account lockout<\/b> after limited failures, and storage as <b>salted hashes<\/b>, never in plain text.<\/li><li><b>Single sign-on (SSO)<\/b> is convenient but one compromised credential exposes many systems.<\/li><li><b>Shared accounts<\/b> destroy accountability. Privileged access needs approval, logging and independent review.<\/li><li><b>Access reviews<\/b> find excess or outdated access (privilege creep). Re-evaluate access when people change roles. Remove access <b>immediately<\/b> on termination.<\/li><\/ul><div class=\"tw\"><table><thead><tr><th>Model<\/th><th>How access is decided<\/th><\/tr><\/thead><tbody><tr><td>DAC (discretionary)<\/td><td>The owner of the resource decides who may access it.<\/td><\/tr><tr><td>MAC (mandatory)<\/td><td>The system enforces access based on classification labels and clearances.<\/td><\/tr><tr><td>RBAC (role-based)<\/td><td>Access is grouped into roles tied to job functions. Simplifies administration.<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tw\"><table><thead><tr><th>Biometric measure<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>FAR (false acceptance rate)<\/td><td>Wrong person accepted. The most serious for security.<\/td><\/tr><tr><td>FRR (false rejection rate)<\/td><td>Right person rejected. Hurts availability and productivity.<\/td><\/tr><tr><td>EER (equal error rate)<\/td><td>Point where FAR equals FRR. Used to compare systems.<\/td><\/tr><\/tbody><\/table><\/div><p class=\"small\">Store biometric templates encrypted, not as raw images, because biometrics cannot be reset.<\/p><h3>3. Network security<\/h3><div class=\"tw\"><table><thead><tr><th>Control<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td>Packet-filter firewall<\/td><td>Filters by address and port. Simple, limited.<\/td><\/tr><tr><td>Stateful inspection firewall<\/td><td>Tracks connection state. Stronger than packet filtering.<\/td><\/tr><tr><td>Application-level gateway (proxy)<\/td><td>Inspects application content. Strongest, slower.<\/td><\/tr><tr><td>DMZ / screened subnet<\/td><td>Isolates public-facing servers from the internal network.<\/td><\/tr><tr><td>IDS<\/td><td>Detects and alerts. Signature-based finds known attacks. Anomaly-based can find unknown attacks but gives more false positives.<\/td><\/tr><tr><td>IPS<\/td><td>Detects and blocks.<\/td><\/tr><tr><td>VPN (IPsec, TLS)<\/td><td>Encrypted tunnel over an untrusted network.<\/td><\/tr><tr><td>Network segmentation / VLAN<\/td><td>Limits lateral movement.<\/td><\/tr><tr><td>Honeypot<\/td><td>Decoy system to attract and study attackers.<\/td><\/tr><\/tbody><\/table><\/div><ul><li><b>Default deny<\/b>: block everything except what is needed. An <b>allow any any<\/b> rule at the end of a rule set defeats this.<\/li><li>An IDS placed <b>outside<\/b> the firewall produces many alerts for attacks the firewall would have blocked.<\/li><li><b>Wireless<\/b>: use WPA2 or WPA3 Enterprise with individual authentication. WEP is weak. Scan for rogue access points.<\/li><li><b>Remote access<\/b> from unmanaged personal devices is a risk. Check endpoint compliance, and give least-privilege, time-limited, monitored access to vendors.<\/li><\/ul><h3>4. Encryption and PKI<\/h3><div class=\"tw\"><table><thead><tr><th>Type<\/th><th>Key points<\/th><\/tr><\/thead><tbody><tr><td>Symmetric<\/td><td>One shared key. Fast, good for large data. Problem: secure key distribution. Examples: AES, 3DES.<\/td><\/tr><tr><td>Asymmetric<\/td><td>Key pair (public and private). Slower. Solves key distribution, enables signatures. Example: RSA.<\/td><\/tr><tr><td>Hybrid<\/td><td>Asymmetric exchange of a symmetric session key, then fast symmetric encryption. Standard approach.<\/td><\/tr><tr><td>Hashing<\/td><td>One-way fingerprint that proves integrity. Example: SHA-256.<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tw\"><table><thead><tr><th>Goal<\/th><th>Use this key<\/th><\/tr><\/thead><tbody><tr><td>Confidentiality of a message<\/td><td>Encrypt with the recipient's public key. Only the recipient's private key decrypts.<\/td><\/tr><tr><td>Authentication and non-repudiation (digital signature)<\/td><td>Sign with the sender's private key. Verify with the sender's public key.<\/td><\/tr><tr><td>Integrity<\/td><td>Hash of the message, protected by a digital signature.<\/td><\/tr><\/tbody><\/table><\/div><ul><li><b>Digital signature<\/b> gives integrity and non-repudiation.<\/li><li><b>PKI<\/b>: the <b>CA<\/b> issues and signs certificates. The <b>RA<\/b> verifies the requester's identity. A <b>CRL<\/b> lists revoked certificates.<\/li><li>A valid certificate from a trusted CA that matches the domain authenticates a website. <b>TLS<\/b> protects web sessions and defeats man-in-the-middle attacks when certificates are validated.<\/li><li><b>Key management<\/b>: protect keys, never store them beside the data, back them up or escrow them (lost keys mean unrecoverable data), and rotate them.<\/li><li><b>IPsec<\/b> provides authentication and encryption for IP traffic in a VPN.<\/li><\/ul><h3>5. Malware and attacks<\/h3><div class=\"tw\"><table><thead><tr><th>Threat<\/th><th>Description<\/th><\/tr><\/thead><tbody><tr><td>Virus<\/td><td>Attaches to a host file and spreads when it is run.<\/td><\/tr><tr><td>Worm<\/td><td>Spreads by itself over networks without a host program.<\/td><\/tr><tr><td>Trojan<\/td><td>Looks legitimate but does something harmful.<\/td><\/tr><tr><td>Ransomware<\/td><td>Encrypts data and demands payment.<\/td><\/tr><tr><td>Rootkit<\/td><td>Hides malicious activity at a deep system level.<\/td><\/tr><tr><td>Logic bomb<\/td><td>Malicious code that triggers on a condition or date.<\/td><\/tr><tr><td>Denial of service<\/td><td>Attacks availability by overloading a system.<\/td><\/tr><tr><td>Man-in-the-middle<\/td><td>Intercepts and may alter communication.<\/td><\/tr><tr><td>Phishing<\/td><td>Fraudulent messages to steal credentials or money. Spear phishing targets a person or group. Whaling targets executives.<\/td><\/tr><tr><td>SQL injection<\/td><td>Malicious input changes database queries. Prevent with parameterized queries and input validation.<\/td><\/tr><\/tbody><\/table><\/div><ul><li><b>Antimalware<\/b> works best when signatures and engines update automatically and frequently. Signature-based tools miss unknown malware.<\/li><li><b>Social engineering<\/b> is defeated mainly by <b>awareness training<\/b> combined with technical filters, and by verifying requests (for example payment requests) through a separate channel.<\/li><li>A caller claiming to be IT and asking for a password: refuse and report.<\/li><li><b>Offline or immutable backups<\/b> are the best protection against ransomware encrypting backups.<\/li><\/ul><h3>6. Data protection and privacy<\/h3><ul><li>Protect data <b>at rest<\/b> (disk, database and backup encryption), <b>in transit<\/b> (TLS, VPN) and in use.<\/li><li><b>Data loss prevention (DLP)<\/b> stops sensitive data leaving the organization through email, web or removable media.<\/li><li><b>Removable media<\/b>: restrict use and require encryption on approved devices.<\/li><li><b>Mobile and BYOD<\/b>: mobile device management with encryption, remote lock or wipe, and approved apps. For a lost phone, lock or wipe first.<\/li><li><b>Shadow IT<\/b>: discover it, set policy and provide an approved alternative.<\/li><li><b>Privacy<\/b>: purpose limitation, data minimization and storage limitation. Do not reuse data for a new purpose without a legal basis or consent.<\/li><li><b>Cloud<\/b>: confirm where data is stored (jurisdiction), who is responsible for patching and access, how incidents are notified, and audit rights. In multi-tenant clouds, isolation between customers is a key risk. In IaaS the customer patches the guest operating system.<\/li><li><b>Disposal<\/b>: shred paper, and wipe or physically destroy media. Never rely on ordinary deletion.<\/li><li><b>Clean desk<\/b> policy reduces disclosure of sensitive information.<\/li><\/ul><h3>7. Physical and environmental security<\/h3><div class=\"tw\"><table><thead><tr><th>Area<\/th><th>Controls<\/th><\/tr><\/thead><tbody><tr><td>Access<\/td><td>Badges, biometrics, mantraps or turnstiles (stop tailgating), visitor logs and escorts, guards, CCTV. Collect visitor badges.<\/td><\/tr><tr><td>Location<\/td><td>Interior, no external signs, away from flood, fire and external walls. Avoid basements prone to flooding.<\/td><\/tr><tr><td>Fire<\/td><td>Smoke and heat detectors. Dry-pipe sprinklers or clean-agent gas systems preferred in data centers.<\/td><\/tr><tr><td>Power<\/td><td>UPS for short-term power and graceful shutdown. Generators for long outages.<\/td><\/tr><tr><td>Climate<\/td><td>Controlled temperature and humidity, water detection, raised floors.<\/td><\/tr><\/tbody><\/table><\/div><ul><li>A data center door propped open defeats physical access control.<\/li><li>Fire suppression systems must be tested and staff trained.<\/li><\/ul><h3>8. Security monitoring, incident response and forensics<\/h3><ul><li><b>Logging<\/b>: collect, protect from modification, synchronize time stamps and review. <b>SIEM<\/b> correlates logs to detect security events.<\/li><li><b>Vulnerability scanning<\/b> finds known weaknesses. <b>Penetration testing<\/b> tries to exploit them and needs <b>written authorization and a defined scope<\/b>. White-box testers are given system knowledge, black-box testers are not.<\/li><li>Fix findings in order of <b>risk<\/b> (exploitable and affecting critical assets).<\/li><li><b>Static code analysis<\/b> and secure code review find flaws before release.<\/li><\/ul><div class=\"tw\"><table><thead><tr><th>Incident phase<\/th><th>What happens<\/th><\/tr><\/thead><tbody><tr><td>Preparation<\/td><td>Plan, roles, tools, training, contacts.<\/td><\/tr><tr><td>Detection and analysis<\/td><td>Identify and confirm the incident.<\/td><\/tr><tr><td>Containment<\/td><td>Isolate affected systems to stop the spread.<\/td><\/tr><tr><td>Eradication and recovery<\/td><td>Remove the cause, restore systems.<\/td><\/tr><tr><td>Lessons learned<\/td><td>Review and improve.<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Disclosure to regulators and the public is authorized by <b>senior management with legal and communications<\/b>, following the plan.<\/li><li><b>Forensics<\/b>: preserve evidence, document a <b>chain of custody<\/b>, make a <b>bit-for-bit image<\/b> and work from the copy.<\/li><li><b>Order of volatility<\/b>: collect volatile data (memory) first, then disk.<\/li><li>Stolen laptop with unencrypted data: follow the incident plan, assess the data, notify as required and remote wipe if possible. Full-disk encryption would have prevented exposure.<\/li><\/ul><div class=\"tip warn\"><strong>Common exam traps in Domain 5<\/strong><ul><li>Mixing up the keys: <b>encrypt for confidentiality with the recipient's public key<\/b>, sign with your own private key.<\/li><li>Choosing <b>detective<\/b> over <b>preventive<\/b> when the question asks for the BEST control.<\/li><li>Choosing <b>technology alone<\/b> for phishing or social engineering. The best answer includes training.<\/li><li>Confusing <b>FAR<\/b> (security risk) with <b>FRR<\/b> (availability and usability problem).<\/li><li>Wiping or restoring a compromised system <b>before containing and preserving evidence<\/b>.<\/li><li>Mixing up <b>IDS<\/b> (detects) with <b>IPS<\/b> (blocks).<\/li><li>Picking <b>default allow<\/b> or shared accounts. The answer is least privilege and default deny.<\/li><li>Forgetting that the <b>data owner<\/b> classifies and <b>custodian<\/b> protects.<\/li><\/ul><\/div>"}];
var LETTERS = ["A", "B", "C", "D"];

var app = document.getElementById("app");
var curQuiz = "1", set = [], pos = 0, picks = [], answered = false;

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}
function nav(h) {
  if (location.hash === "#" + h || (h === "" && !location.hash)) route();
  else location.hash = h;
}
function questions(id) {
  return QUIZZES[id].raw.map(function (r, i) {
    return { n: i + 1, d: r[0], q: r[1], o: r[2], a: r[3], e: r[4] };
  });
}

function route() {
  var h = location.hash.replace("#", "");
  if (/^q[123]$/.test(h)) return quizMenu(h.charAt(1));
  if (/^n[1-5]$/.test(h)) return showNote(+h.charAt(1));
  return home();
}

function home() {
  var h = '<h1>CISA Practice</h1>' +
    '<p class="muted">Three practice quizzes and short study notes for each CISA domain. Everything here is original practice material, not real exam questions.</p>' +
    '<h2>Practice quizzes</h2><div class="list">';
  Object.keys(QUIZZES).forEach(function (id) {
    h += '<button class="dom col" data-q="' + id + '"><strong>' + esc(QUIZZES[id].title) + '</strong><small>' + esc(QUIZZES[id].desc) + '</small></button>';
  });
  h += '</div><h2>Study notes</h2><div class="list">';
  NOTES.forEach(function (n) {
    h += '<button class="dom" data-n="' + n.n + '"><span><strong>Domain ' + n.n + '</strong>' + esc(n.name) + '</span><small class="r">' + esc(n.weight) + '</small></button>';
  });
  h += '</div>';
  app.innerHTML = h;
  app.querySelectorAll("[data-q]").forEach(function (b) {
    b.onclick = function () { nav("q" + b.getAttribute("data-q")); };
  });
  app.querySelectorAll("[data-n]").forEach(function (b) {
    b.onclick = function () { nav("n" + b.getAttribute("data-n")); };
  });
  window.scrollTo(0, 0);
}

function quizMenu(id) {
  curQuiz = id;
  var all = questions(id);
  var h = '<button class="back" id="back">&larr; All quizzes</button>' +
    '<h1>' + esc(QUIZZES[id].title.replace(/^Quiz \d: /, "Quiz " + id + ": ")) + '</h1>' +
    '<p class="muted">' + esc(QUIZZES[id].desc) + ' Each answer comes with a short explanation.</p>' +
    '<div class="list">' +
    '<button class="dom" data-d="0"><span><strong>All domains</strong></span><small class="r">' + all.length + ' questions</small></button>';
  DOMAINS.forEach(function (d) {
    var c = all.filter(function (q) { return q.d === d.id; }).length;
    h += '<button class="dom" data-d="' + d.id + '"><span>Domain ' + d.id + ': ' + esc(d.name) + '</span><small class="r">' + c + '</small></button>';
  });
  h += '</div>';
  app.innerHTML = h;
  document.getElementById("back").onclick = function () { nav(""); };
  app.querySelectorAll("[data-d]").forEach(function (b) {
    b.onclick = function () {
      var d = +b.getAttribute("data-d");
      start(d === 0 ? all : all.filter(function (q) { return q.d === d; }));
    };
  });
  window.scrollTo(0, 0);
}

function showNote(n) {
  var note = NOTES.filter(function (x) { return x.n === n; })[0];
  app.innerHTML = '<button class="back" id="back">&larr; Back</button>' +
    '<h1>Domain ' + note.n + ': ' + esc(note.name) + '</h1>' +
    '<p class="muted">Exam weight: about ' + esc(note.weight) + '</p>' +
    '<div class="note">' + note.html + '</div>' +
    '<button class="btn ghost" id="b2" style="margin-top:20px">Back to start</button>';
  document.getElementById("back").onclick = function () { nav(""); };
  document.getElementById("b2").onclick = function () { nav(""); };
  window.scrollTo(0, 0);
}

function start(list) {
  set = list; pos = 0; picks = []; answered = false;
  renderQ();
}

function renderQ() {
  var q = set[pos];
  answered = picks[pos] !== undefined;
  var pct = (pos / set.length) * 100;
  var h = '<div class="top"><span>Question ' + (pos + 1) + ' of ' + set.length + '</span><span>Domain ' + q.d + '</span></div>' +
    '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
    '<div class="q">' + esc(q.q) + '</div><div class="opts">';
  q.o.forEach(function (t, i) {
    h += '<button class="opt" data-i="' + i + '"><span class="l">' + LETTERS[i] + '</span><span>' + esc(t) + '</span></button>';
  });
  h += '</div><div id="fb"></div><div class="nav" id="nav"></div>' +
    '<div class="tools"><button id="quit">Quit to menu</button></div>';
  app.innerHTML = h;
  app.querySelectorAll(".opt").forEach(function (b) {
    b.onclick = function () { choose(+b.getAttribute("data-i")); };
  });
  document.getElementById("quit").onclick = function () { quizMenu(curQuiz); };
  if (answered) showFeedback();
  window.scrollTo(0, 0);
}

function choose(i) {
  if (answered) return;
  picks[pos] = i; answered = true;
  showFeedback();
}

function showFeedback() {
  var q = set[pos], p = picks[pos], right = p === q.a;
  app.querySelectorAll(".opt").forEach(function (b, i) {
    b.disabled = true;
    if (i === q.a) b.classList.add("ok");
    else if (i === p) b.classList.add("bad");
  });
  document.getElementById("fb").innerHTML =
    '<div class="fb" role="status"><strong class="' + (right ? "ok" : "bad") + '">' +
    (right ? "Correct." : "Not quite. The answer is " + LETTERS[q.a] + ".") + '</strong> ' + esc(q.e) + '</div>';
  var last = pos === set.length - 1;
  var nv = document.getElementById("nav");
  nv.innerHTML = '<button class="btn" id="next">' + (last ? "See results" : "Next question") + '</button>';
  document.getElementById("next").onclick = function () {
    if (last) results(); else { pos++; renderQ(); }
  };
  document.getElementById("next").focus({ preventScroll: true });
  nv.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

function results() {
  var correct = 0, byD = {}, wrong = [];
  set.forEach(function (q, i) {
    byD[q.d] = byD[q.d] || { c: 0, t: 0 };
    byD[q.d].t++;
    if (picks[i] === q.a) { correct++; byD[q.d].c++; } else wrong.push({ q: q, p: picks[i] });
  });
  var pct = Math.round((correct / set.length) * 100);
  var h = '<h2 style="margin-top:0">Your result</h2><div class="score">' + pct + '%</div>' +
    '<p class="muted">' + correct + ' correct out of ' + set.length + '. On the real exam you need a scaled score of 450 out of 800, so use this as a rough guide, not a prediction.</p>';
  DOMAINS.forEach(function (d) {
    var s = byD[d.id];
    if (!s) return;
    var dp = Math.round((s.c / s.t) * 100);
    h += '<div class="row"><span>Domain ' + d.id + ': ' + esc(d.name) + '</span><span>' + s.c + '/' + s.t + '</span>' +
      '<div class="bar"><i style="width:' + dp + '%"></i></div></div>';
  });
  h += '<div style="margin-top:20px">';
  if (wrong.length) h += '<button class="btn" id="retry">Retry the ' + wrong.length + ' you missed</button>';
  h += '<button class="btn ghost" id="again">Back to quiz menu</button></div>';
  if (wrong.length) {
    h += '<h2 style="margin-top:32px">Review your mistakes</h2>';
    wrong.forEach(function (w) {
      h += '<div class="miss"><div class="q">' + w.q.n + '. ' + esc(w.q.q) + '</div>' +
        '<div class="yours">Your answer: ' + LETTERS[w.p] + '. ' + esc(w.q.o[w.p]) + '</div>' +
        '<div class="right">Correct: ' + LETTERS[w.q.a] + '. ' + esc(w.q.o[w.q.a]) + '</div>' +
        '<div class="muted" style="margin-top:6px">' + esc(w.q.e) + '</div></div>';
    });
  }
  app.innerHTML = h;
  var r = document.getElementById("retry");
  if (r) r.onclick = function () { start(wrong.map(function (w) { return w.q; })); };
  document.getElementById("again").onclick = function () { quizMenu(curQuiz); };
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>

,"User preference"],1,"MAC is enforced centrally by labels; DAC lets owners decide."],[5,"How should passwords be stored in a system?",["In plain text","Encrypted with a key stored beside them","As salted hashes","In a spreadsheet"],2,"Salted hashes resist recovery and rainbow tables."],[5,"In a public cloud where customers share infrastructure, which risk is MOST specific to this setup?",["Higher hardware cost","Slower typing","Easier backups","Data exposure between tenants through weak isolation"],3,"Multi-tenancy depends on strong isolation."]]},"3":{"title":"Quiz 3: 150 focus questions","desc":"New questions weighted toward the most tested domains, Operations and Protection of Information Assets.","raw":[[1,"A high-risk system goes live midyear. How should the audit function respond to its annual plan?",["Ignore the plan until next year","Update the plan based on a fresh risk assessment","Cancel all other audits","Wait for a management request"],1,"Audit plans must flex as risk changes."],[1,"An audit engagement letter or terms of reference should MAINLY document:",["The auditor's personal opinions","Technical test results","The agreed scope, objectives, responsibilities and timing","The final recommendations"],2,"It sets expectations before work starts."],[1,"A preliminary survey at the start of an audit is MAINLY used to:",["Issue the final report","Test every control","Gain an understanding of the area in order to plan the audit","Decide disciplinary action"],2,"Understanding the area comes before detailed planning."],[1,"Which of these is a control OBJECTIVE rather than a control?",["Only authorized transactions are processed","Purchase orders require manager approval","A daily exception report is reviewed","Passwords expire every 90 days"],0,"An objective states the goal; controls are the means."],[1,"Audit evidence contradicts what management told the auditor. What should the auditor do?",["Obtain additional evidence to resolve the contradiction","Accept management's version","Drop the issue","Report it immediately as fraud"],0,"Resolve conflicting evidence before concluding."],[1,"The auditor wants to estimate the total dollar amount of errors in an account balance. Which method fits BEST?",["Attribute sampling","Discovery sampling","Variable sampling","A walkthrough"],2,"Variable sampling estimates monetary values."],[1,"An audit report should be addressed to:",["The staff who did the work","Those with authority to act, such as senior management or the audit committee","The vendor","The public"],1,"Reports go to people who can act on them."],[1,"The auditor finds a minor issue that does not warrant a formal finding. What is the BEST handling?",["Ignore it","Escalate it to the board","Tell management informally and document it in the workpapers","Present it as a critical finding"],2,"Minor items are communicated and recorded, not ignored."],[1,"Follow-up of audit findings should be scheduled based on:",["The auditor's convenience","Alphabetical order","The risk and severity of the findings","The auditee's preference"],2,"Higher-risk items get earlier follow-up."],[1,"Professional skepticism means the auditor:",["Distrusts everyone","Accepts management's statements","Avoids documentation","Keeps a questioning mind and critically assesses evidence"],3,"It is a critical attitude, not hostility."],[1,"An auditor signs off a conclusion with little evidence behind it. Which principle was MOST clearly breached?",["Segregation of duties","Business continuity","Due professional care","Data classification"],2,"Conclusions must rest on sufficient evidence."],[1,"An audit that checks adherence to laws, regulations and contract terms is a:",["Compliance audit","Forensic audit","Operational audit","Financial audit"],0,"Compliance audits test adherence to requirements."],[1,"Which technique BEST tests whether all authorized payroll inputs were processed?",["Review the vendor brochure","Reconcile source documents to processed output totals","Interview staff only","Check screen colors"],1,"Reconciliation shows completeness."],[1,"An integrated test facility (ITF) lets the auditor:",["Replace all controls","Test live processing using dummy entities without disrupting operations","Delete production data","Review only paper files"],1,"Test transactions must be reversed so production data stays clean."],[1,"Which CAAT use is MOST helpful for finding missing check numbers in a series?",["Screen capture","Gap or sequence analysis","Color coding","Spell check"],1,"Gap analysis finds breaks in sequences."],[1,"The snapshot technique helps an auditor by:",["Encrypting data","Deleting logs","Capturing a transaction's state at points along its processing path","Raising the budget"],2,"It shows how a transaction was processed."],[1,"The auditor reviews a key financial model built in a spreadsheet. The GREATEST concern is:",["Font choice","Lack of version control, access control and formula validation","Sheet color","File size"],1,"Spreadsheets drive decisions but are often uncontrolled."],[1,"The auditor wants to rely on last year's control testing. This is MOST acceptable when:",["Always","Never","The control is unchanged and low risk, and procedures confirm it still works","The auditee asks"],2,"Reliance needs evidence the control is unchanged."],[1,"An external auditor wants to rely on the internal audit department's work. What should be assessed FIRST?",["Its budget","Its office","Its size","Its competence and objectivity"],3,"Reliance depends on competence and objectivity."],[1,"A qualitative risk assessment is MOST appropriate when:",["Precise financial data is not available and judgment is needed","Exact probabilities are known","No judgment is needed","Only dollars matter"],0,"Qualitative methods use ratings and judgment."],[1,"Compared with low-risk areas, higher-risk areas should be audited:",["Less often","Never","More often","At the same rate"],2,"Audit frequency follows risk."],[1,"Results of a judgmental sample:",["Can be statistically projected to the population","Cannot be statistically projected because selection was not random","Are always invalid","Are always more accurate"],1,"Only statistical samples support projection."],[1,"During business process reengineering, the auditor should MOST focus on whether:",["Logos are updated","Controls are kept or replaced as the process changes","Staff are cut","Costs are hidden"],1,"Redesign can remove controls without anyone noticing."],[1,"Audit workpapers should be retained:",["Indefinitely by the auditee","Only until the report is issued","For a period set by policy and law, and kept confidential","Shared publicly"],2,"Retention follows policy and regulation."],[2,"Several IT projects are late and over budget. What should the board expect FIRST?",["Steering committee oversight with regular reporting on status and value","Detailed code reviews","More hardware","Fewer meetings"],0,"The board oversees through committees and reporting."],[2,"In COBIT, which group of objectives covers evaluating, directing and monitoring, that is governance?",["BAI","EDM","DSS","APO"],1,"EDM is Evaluate, Direct and Monitor; the others are management objectives."],[2,"An operational level agreement (OLA) is an agreement:",["Between internal teams that support delivery of a service","Between IT and a regulator","Between auditors","With a software vendor only"],0,"OLAs support SLAs inside the organization."],[2,"Which activity BEST supports continual improvement of an information security management system?",["Skipping audits","Fixed budgets","Periodic management review of performance and results","Longer passwords"],2,"Management review drives improvement."],[2,"Risk assessments should be repeated:",["Never","Only after incidents","Periodically and whenever significant change occurs","Every decade"],2,"Risk changes with the business and threats."],[2,"A risk has low likelihood but very high impact, such as a major fire. Which treatment is MOST suitable?",["Transfer part of it through insurance and prepare continuity plans","Accept it with no action","Ignore it","Increase its likelihood"],0,"Rare, severe events suit insurance plus continuity planning."],[2,"An asset is worth 100,000. An event would destroy 40% of it and is expected once every two years. What is the annual loss expectancy?",["40,000","80,000","100,000","20,000"],3,"SLE is 40,000. ARO is 0.5. ALE = 40,000 x 0.5 = 20,000."],[2,"A control costs 80,000 a year and reduces expected annual loss by 30,000. What should management conclude?",["The control is cost-justified","The control costs more than the loss it prevents, so reconsider the treatment","Always implement it","Double the control"],1,"Controls should be cost-effective relative to the risk reduction."],[2,"A vendor subcontracts part of its service without telling the customer. Which contract term would have BEST prevented this?",["A requirement for customer approval of subcontractors, with the same security obligations","A longer contract","A bigger logo","Free training"],0,"Flow-down and approval terms control fourth parties."],[2,"An SLA says the service will be 'fast and reliable.' What should the auditor recommend?",["Accept it","Cancel the SLA","Remove monitoring","Define measurable metrics and targets"],3,"SLAs need measurable, verifiable terms."],[2,"In a small team where duties cannot be separated, the BEST compensating control is:",["No control","More meetings","More management supervision and review of transactions","More desks"],2,"Review compensates for missing segregation."],[2,"A security policy has not been reviewed in years and no longer matches practice. What should the auditor recommend?",["Delete it","Ignore it","Let each user decide","Review and update it regularly, with senior management approval"],3,"Policies need periodic review and approval."],[2,"An information security steering committee should include:",["Only IT staff","Only auditors","Only vendors","Representatives from key business functions as well as IT"],3,"Security is a business issue, not only an IT one."],[2,"Which task belongs to the information security manager rather than the data owner?",["Deciding who may access business data","Classifying business data","Approving access requests","Developing the security strategy and monitoring compliance"],3,"Owners decide access and classification."],[2,"A key goal indicator (KGI) differs from a key performance indicator (KPI) because it:",["Shows whether the goal or outcome was achieved","Measures how well a process performs","Replaces all metrics","Measures cost only"],0,"KGIs measure results; KPIs measure how well the process is performing."],[2,"A business case was approved, but nobody measures benefits after go-live. This is a gap in:",["Data entry","Backups","Printing","Benefits realization"],3,"Benefits must be tracked after delivery."],[2,"The main governance benefit of an IT chargeback model is that it:",["Makes business units accountable for the IT services they consume","Hides IT costs","Reduces staff","Removes budgets"],0,"Chargeback links usage to cost."],[2,"Which situation BEST suggests IT is treated as a strategic partner?",["IT reports to a clerk","IT is not consulted on plans","The CIO sits on the executive committee","IT has no plan"],2,"Executive representation signals a strategic role."],[2,"An organization has no target enterprise architecture. The likely result is:",["Standardized systems","Siloed, inconsistent systems and higher cost","Lower risk","Faster integration"],1,"Architecture guides consistent design."],[2,"A cloud contract is governed by foreign law. What should the organization do?",["Sign without review","Ignore it","Ban all cloud use","Obtain legal review of jurisdiction, data protection and dispute terms"],3,"Legal review addresses jurisdiction risks."],[2,"Who should be informed of business continuity test results and gaps?",["Only the help desk","Only the vendor","Senior management and, where appropriate, the board","Nobody"],2,"Management owns continuity and must know the gaps."],[2,"An anonymous ethics hotline MAINLY helps by:",["Replacing audits","Reducing hardware","Speeding backups","Letting staff report suspected fraud or misconduct without fear"],3,"Reports from staff are a major way fraud is found."],[2,"Succession planning for key IT staff reduces:",["Cable length","Key-person dependency","Disk usage","Patch volume"],1,"It protects continuity of critical skills."],[2,"Training for IT staff should be planned from:",["Random selection","A training needs analysis based on roles and skill gaps","Vendor brochures","Seniority only"],1,"Training follows identified needs."],[3,"At which SDLC stage is it MOST cost-effective for the auditor to recommend control improvements?",["After go-live","During retirement","During design, before the system is built","After the first incident"],2,"Controls are cheapest to add early."],[3,"A requirements traceability matrix helps ensure that:",["Code is shorter","Staff are happier","Every requirement is carried through design and testing","Hardware is cheaper"],2,"It links requirements to design and test cases."],[3,"Program changes should be tested by:",["The same developer only","Someone independent of the developer, with user involvement","No one","The vendor's marketing team"],1,"Independent testing reduces bias."],[3,"Data conversion testing shows unexplained discrepancies a week before go-live. What should the project do?",["Investigate and resolve them, or formally accept the risk, before go-live","Go live anyway","Delete the old data","Skip reconciliation"],0,"Unexplained differences must be resolved or formally accepted."],[3,"User training before go-live MAINLY reduces the risk that:",["Users make errors or misuse the system","Hardware fails","Networks slow","Licenses expire"],0,"Untrained users cause errors."],[3,"The purpose of a rollback plan is to:",["Return to the previous state if the implementation fails","Speed up coding","Remove testing","Reduce users"],0,"Rollback limits the damage of a failed release."],[3,"Which test checks that a system performs acceptably under its expected user volume?",["Unit testing","Code review","Regression testing","Load testing"],3,"Load testing applies expected volume."],[3,"A check digit is MOST effective at detecting:",["Network failures","Malware","Transposition and keying errors in identifiers","Fraud by management"],2,"It validates identifiers such as account numbers."],[3,"Which control BEST ensures EDI transactions come only from authorized trading partners?",["Larger disks","Faster printers","Authentication of partners, with acknowledgments and audit trails","Fewer users"],2,"EDI relies on authenticated, logged exchanges."],[3,"Requirements are likely to change often during the project. Which approach copes BEST?",["Waterfall","Agile with short iterations and user feedback","Big bang","Parallel run"],1,"Agile accommodates change."],[3,"Which is MOST relevant when assessing a software vendor's long-term viability?",["Financial stability, references and support capability","Office decoration","Logo","Staff photos"],0,"Viability depends on stability and support."],[3,"Which combination BEST detects if records were dropped from a batch?",["Color coding","Record counts and hash totals","Longer passwords","Cable checks"],1,"Counts and totals confirm completeness."],[4,"Which database property ensures that a transaction is either fully completed or not applied at all?",["Isolation","Atomicity","Normalization","Replication"],1,"Atomicity means all or nothing."],[4,"Which tool describes the definitions, structure and relationships of data in a database?",["Data dictionary","Firewall","Backup log","Router table"],0,"The data dictionary holds metadata about the data."],[4,"Users with SQL tools can query database tables directly, bypassing the application. What is the BEST control?",["Allow it for convenience","Restrict direct access to those with a business need and log it","Remove logging","Share the database password"],1,"Direct access bypasses application controls, so limit and log it."],[4,"Privileged system utilities that can bypass normal access rules should be:",["Available to all users","Hidden from the menu only","Used without logging","Restricted to authorized staff and monitored"],3,"They are powerful and must be controlled and monitored."],[4,"The MAIN purpose of preventive hardware maintenance is to:",["Increase licenses","Reduce the likelihood of unplanned downtime","Hide faults","Raise the budget"],1,"Planned maintenance prevents failures."],[4,"An audit finds more software installations than licenses purchased. What is the main risk?",["Legal and financial penalties for non-compliance","Faster performance","Lower cost","Better security"],0,"License overuse breaches contracts and law."],[4,"In a star network topology, which failure has the GREATEST impact?",["One user's cable","One PC","One printer","The central hub or switch"],3,"A star depends on its central device."],[4,"Which service automatically assigns IP addresses to devices on a network?",["DNS","DHCP","SMTP","FTP"],1,"DHCP hands out addresses dynamically."],[4,"A protocol analyzer is MOST useful to:",["Encrypt files","Back up data","Capture and examine network packets for troubleshooting or analysis","Schedule jobs"],2,"It inspects traffic at packet level."],[4,"Which approach BEST detects unauthorized devices connected to the network?",["Longer cables","Larger switches","Annual surveys only","Regular network scans compared with the asset inventory"],3,"Comparing scans to the inventory exposes unknown devices."],[4,"Voice over IP (VoIP) introduces which risk that traditional phones largely do not?",["Paper jams","Power failure only","Slower typing","Eavesdropping and denial of service over the data network"],3,"VoIP shares the data network and its threats."],[4,"Hiding the wireless network name (SSID) is:",["A strong security control","Required by law","A replacement for encryption","Only a minor obstacle, not real security"],3,"The name is easy to discover; use strong authentication and encryption."],[4,"Computer operators should NOT have:",["Access to run jobs","Access to console messages","Access to modify application programs and source code","Access to the job schedule"],2,"Operators and programmers must be separated."],[4,"Console logs of operator activity should be:",["Reviewed regularly by an independent supervisor","Deleted daily","Never kept","Reviewed by the operators themselves"],0,"Independent review detects unauthorized actions."],[4,"Which control BEST protects backup media in a media library?",["Open shelves","No records","Shared keys","Inventory, labeling and controlled check-out"],3,"Track and control every item."],[4,"A service desk ticket cannot be resolved at first level. What should happen?",["Close it","Delete it","Ask the user to retry later","Escalate it through defined procedures to higher support"],3,"Escalation procedures keep incidents moving."],[4,"Incident priority should be based mainly on:",["The caller's seniority","Business impact and urgency","Alphabetical order","Time of day"],1,"Priority reflects impact and urgency."],[4,"A known error database helps the service desk by:",["Deleting tickets","Encrypting data","Recording known problems and workarounds for faster resolution","Scheduling backups"],2,"Known errors speed up repeat resolutions."],[4,"A configuration management database (CMDB) is used to:",["Record IT assets and their relationships","Store passwords","Encrypt mail","Print reports"],0,"The CMDB tracks configuration items and how they connect."],[4,"Each production change should have a back-out plan because it:",["Allows recovery to the previous state if the change fails","Speeds approval","Removes the need for testing","Lowers licensing cost"],0,"A back-out plan limits damage from a failed change."],[4,"Which body typically reviews and approves significant changes?",["Help desk","Vendor","Change advisory board (CAB)","End users alone"],2,"The CAB assesses risk and approves changes."],[4,"To confirm that ALL production changes were authorized, the auditor should start from:",["Change requests, then trace forward","A manager's statement","The system-generated list of changes found in production, then trace back to approvals","The vendor invoice"],2,"Starting from what actually changed tests completeness; starting from approvals only shows approved changes."],[4,"A business continuity plan should cover:",["Only IT systems","Only the data center","Only one department","All critical business processes, not just IT"],3,"Continuity is a business matter, not just an IT one."],[4,"Who should decide to activate the business continuity plan?",["Any employee","Designated management or the crisis team, as set out in the plan","The vendor","A customer"],1,"Activation authority is defined in advance."],[4,"Copies of the business continuity plan should be:",["Kept only in the data center","Kept by one person","Stored offsite and available to key personnel","Kept secret from staff"],2,"A plan locked in the affected site is useless."],[4,"The business impact analysis should involve:",["Business process owners","Only IT","Only auditors","Only vendors"],0,"Owners know the impact of downtime."],[4,"When choosing a recovery strategy, management should balance:",["Logo against color","The cost of downtime against the cost of the recovery option","Staff age","Printer cost"],1,"The right strategy balances loss from downtime against recovery cost."],[4,"In a disaster recovery plan, systems should be restored:",["Alphabetically","Smallest first","Newest first","In order of business criticality set by the BIA"],3,"Recovery order follows business priority."],[4,"Which replication method gives near-zero data loss but needs sites close enough to avoid latency?",["Synchronous replication","Weekly tape backup","Asynchronous batch","Monthly archive"],0,"Synchronous replication writes to both sites before confirming."],[4,"Remote journaling MAINLY improves recovery by:",["Deleting logs","Stopping backups","Encrypting passwords","Sending transaction logs to the recovery site frequently"],3,"Frequent log transfer reduces data loss."],[4,"The MOST important output of a business continuity test is:",["A thicker plan","Documented lessons learned and plan updates","A longer meeting","A new logo"],1,"Tests exist to find and fix gaps."],[4,"Insurance is:",["Part of risk treatment but not a replacement for continuity planning","A substitute for a continuity plan","Required for every risk","Useless"],0,"Insurance pays losses; it does not restore operations."],[4,"A hot site will not help if its equipment is:",["Incompatible with the production environment","Newer","Faster","Cleaner"],0,"Compatibility must be verified and tested."],[4,"A load balancer MAINLY improves:",["Password strength","Backup speed","Availability and performance by distributing traffic","Policy approval"],2,"It spreads load across servers."],[4,"Backup retention periods should be set according to:",["Legal, regulatory and business requirements","Disk color","Vendor preference","Random choice"],0,"Retention follows requirements."],[4,"The grandfather-father-son backup rotation:",["Deletes all backups","Keeps multiple generations of backups in a rotating cycle","Uses one tape forever","Is an encryption method"],1,"It rotates daily, weekly and monthly sets."],[4,"Before moving to a cloud provider, an exit strategy should address:",["Logo","Data portability and return or deletion of data at contract end","Office lease","Parking"],1,"Exit planning prevents lock-in and data loss."],[4,"Users report response times getting worse as user numbers grow. Which process should respond?",["Printing","Capacity management","Training","Furniture procurement"],1,"Capacity management plans for growth."],[4,"Automated monitoring with thresholds MAINLY helps operations by:",["Replacing staff","Eliminating backups","Alerting staff to problems before they become outages","Hiding errors"],2,"Early warning prevents outages."],[4,"A service with 99.9% availability allows roughly how much downtime in a year?",["About 8.8 hours","About 9 minutes","About 3.6 days","About 36 days"],0,"0.1% of 8,760 hours is about 8.8 hours."],[4,"Mean time between failures (MTBF) measures:",["Repair time","Backup size","Reliability, as the average time a system runs before failing","User count"],2,"MTBF is a reliability measure; MTTR is repair time."],[4,"Reviewing logs of failed login attempts is what type of control?",["Detective","Preventive","Corrective","Compensating"],0,"It finds events after they happen."],[4,"End-user spreadsheets that drive key decisions need:",["No control","Colors","Inventory, access control, version control and validation","Passwords on every cell only"],2,"End-user computing carries real risk."],[4,"Which control BEST ensures sensitive printed reports reach only authorized recipients?",["Controlled distribution with logs and sign-off","Leaving them on a table","Emailing to everyone","Printing in bold"],0,"Output distribution must be controlled and recorded."],[4,"Fault-tolerant systems differ from merely highly available systems because they:",["Need no maintenance","Cost less","Never use redundancy","Continue operating without interruption when a component fails"],3,"Fault tolerance means no interruption on failure."],[5,"A message is encrypted with the sender's private key. What does this provide?",["Confidentiality only","Availability","Faster delivery","Authentication of the sender, but not confidentiality"],3,"Anyone with the sender's public key can decrypt it."],[5,"Which method gives a message BOTH confidentiality and sender authentication?",["Encrypt with only the recipient's public key","Encrypt with only a shared password","Encrypt with the sender's private key, then with the recipient's public key","Send it unencrypted with a signature line"],2,"The private key authenticates; the recipient's public key protects confidentiality."],[5,"A digital envelope is:",["A paper form","A firewall rule","A symmetric session key that is itself encrypted with the recipient's public key","A backup tape"],2,"It combines fast symmetric encryption with secure key delivery."],[5,"Steganography is the technique of:",["Hiding data inside another file such as an image","Encrypting a hard drive","Blocking spam","Scanning ports"],0,"It conceals the very existence of a message."],[5,"A longer encryption key generally:",["Increases resistance to brute force attacks but needs more processing","Weakens security","Removes the need for key management","Has no effect"],0,"Longer keys are harder to break."],[5,"A supplier denies having sent a purchase order. Which control BEST prevents such denial?",["Longer file names","Larger mailboxes","Faster networks","Digital signatures backed by a PKI"],3,"Signatures provide non-repudiation."],[5,"In a firewall rule set, rules should be ordered so that:",["General allow rules come first","Specific rules come before general ones, ending with a default deny","Order does not matter","Deny rules are removed"],1,"Rules are processed in order, so order matters."],[5,"A weakness of simple packet-filtering firewalls is that they:",["Are too secure","Do not inspect packet contents and can be fooled by spoofed addresses","Inspect application data","Need no rules"],1,"They look only at headers."],[5,"A proxy server can help security by:",["Encrypting backups","Hiding internal addresses and filtering content on behalf of users","Replacing antivirus","Removing passwords"],1,"Proxies act as an intermediary."],[5,"Network address translation (NAT) helps security mainly by:",["Encrypting traffic","Blocking all malware","Hiding internal IP addresses from external networks","Removing the need for firewalls"],2,"NAT conceals the internal addressing scheme."],[5,"An inline IPS that is poorly tuned can:",["Never block anything","Block legitimate traffic through false positives","Improve all performance","Remove the need for logging"],1,"Inline prevention can disrupt normal traffic."],[5,"A host-based IDS is BEST suited to detect:",["Traffic across the whole network","Power failures","Printer faults","Changes and suspicious activity on a specific server"],3,"HIDS watches a single host."],[5,"An attacker sends packets with a forged source address to appear trusted. This is:",["Backup","Patching","Normalization","Spoofing"],3,"Spoofing falsifies identity or address."],[5,"Which control BEST reduces the risk of network sniffing capturing sensitive data?",["Encrypting the traffic","Longer cables","Bigger monitors","More switches"],0,"Encrypted data is useless to a sniffer."],[5,"A dictionary attack tries to:",["Overload a server","Guess passwords using lists of common words","Steal hardware","Copy a database file"],1,"Complex passwords and lockout counter it."],[5,"A botnet is:",["A backup network","A firewall type","A cloud service","A network of infected computers controlled remotely by an attacker"],3,"Botnets are used for attacks such as DoS and spam."],[5,"A keylogger is a threat because it:",["Deletes files","Slows the network","Overheats servers","Records what users type, including passwords"],3,"It captures credentials and other input."],[5,"A zero-day vulnerability is one that:",["Has been patched for years","Is exploited before the vendor has issued a fix","Is harmless","Only affects printers"],1,"No patch exists yet."],[5,"Privacy screens on laptops mainly reduce the risk of:",["Shoulder surfing","Malware","Power loss","SQL injection"],0,"They limit viewing angles."],[5,"Reviewing access control lists (ACLs) helps the auditor confirm that:",["Servers are fast","Backups are encrypted","Permissions match job needs and approvals","Fans work"],2,"ACLs define who can do what."],[5,"Access to a business application should be approved by:",["The data or system owner","Any colleague","The vendor","The help desk alone"],0,"Owners decide who needs access."],[5,"New network devices are found still using vendor default accounts. The BEST action is to:",["Leave them","Share them","Print them","Change or disable default credentials before use"],3,"Default credentials are publicly known."],[5,"Automatic session logoff after inactivity MAINLY reduces the risk of:",["Disk failure","Unauthorized use of an unattended session","Malware","Backups failing"],1,"Unattended sessions can be misused."],[5,"Dormant user accounts should be:",["Left active forever","Shared","Given more rights","Disabled after a defined period of inactivity"],3,"Unused accounts are an easy target."],[5,"Administrators should use separate accounts for administration and everyday work because it:",["Limits exposure of privileged rights and improves accountability","Saves licenses","Speeds up logins","Is required by every vendor"],0,"Daily use of a privileged account increases risk."],[5,"Kerberos is MAINLY used to:",["Encrypt backups","Scan for malware","Route packets","Provide ticket-based authentication, supporting single sign-on"],3,"Kerberos issues tickets after a single authentication."],[5,"A central directory service helps security by:",["Managing identities and authentication in one place","Replacing firewalls","Encrypting every file","Removing audits"],0,"Central management simplifies control and review."],[5,"For a web application, input validation should be enforced:",["Only in the browser","Nowhere","On the server side, because client-side checks can be bypassed","By the user"],2,"Never trust the client."],[5,"Encrypting sensitive columns in a database helps protect data from:",["Disk failure","Users or administrators who can read the tables but should not see the values","Network congestion","Power surges"],1,"Column encryption limits who can see sensitive values."],[5,"Data masking is used in test environments to:",["Slow testing","Delete data","Protect real personal data while keeping the data realistic","Increase storage"],2,"Masked data supports testing without exposing real data."],[5,"Labeling information as public, internal, confidential or restricted supports:",["Faster typing","Cheaper hardware","Fewer users","Applying controls that match each level of sensitivity"],3,"Classification drives protection."],[5,"A legal hold requires an organization to:",["Preserve relevant records even if the normal retention period has ended","Delete records early","Encrypt everything","Archive nothing"],0,"Legal holds override routine deletion."],[5,"A jailbroken or rooted mobile device is a risk because it:",["Runs faster","Bypasses built-in security controls","Uses less power","Is cheaper"],1,"Built-in protections are removed."],[5,"In cloud encryption, keeping the keys under the customer's control (bring your own key) helps:",["Remove all risk","Speed up access","Limit the provider's ability to read the data","Cancel audits"],2,"Customer-held keys reduce provider access."],[5,"Virtual machine sprawl is a risk because unmanaged VMs:",["May stay unpatched and unmonitored","Use no resources","Are always secure","Cannot be copied"],0,"Forgotten VMs become weak points."],[5,"In a data center, very low humidity mainly increases the risk of:",["Static electricity damaging equipment","Condensation","Flooding","Overheating only"],0,"Dry air raises static discharge; high humidity causes condensation."],[5,"Halon fire suppression has largely been replaced mainly because:",["It is too cheap","It harms the ozone layer","It is too slow","It is too quiet"],1,"Environmental rules phased it out."],[5,"CCTV in a facility mainly acts as a:",["Corrective control","Preventive firewall","Backup tool","Detective and deterrent control"],3,"Cameras discourage and record."],[5,"Which sequence reflects the usual phases of a penetration test?",["Reporting, attack, discovery, planning","Attack, planning, reporting, discovery","Discovery, reporting, planning, attack","Planning, discovery, attack, reporting"],3,"Plan and authorize first, report last."],[5,"A computer security incident response team (CSIRT) should include:",["Members from IT, security, legal, communications and management as needed","Only developers","Only auditors","Only vendors"],0,"Incidents need cross-functional response."],[5,"Incident classification and escalation criteria are defined so that:",["All incidents are ignored","Only IT sees incidents","Serious incidents reach the right decision makers quickly","Reports are shorter"],2,"Severity drives escalation."],[5,"For digital evidence to be admissible it should be:",["Edited for clarity","Relevant, authentic and with its integrity preserved","Copied by anyone","Stored on a personal phone"],1,"Courts need reliable, unaltered evidence."],[5,"Which is a useful key risk indicator for vulnerability management?",["The number of printers","Office temperature","Parking spaces","The number of critical vulnerabilities left unpatched past the target time"],3,"It shows exposure that is not being fixed in time."],[5,"Periodic review of the firewall rule base is important because:",["Rules never change","Firewalls fix themselves","Reviews slow the network","Rules become outdated, redundant or too permissive over time"],3,"Rule sets drift without review."],[5,"S/MIME is used to:",["Scan ports","Route traffic","Back up mailboxes","Sign and encrypt email messages"],3,"S/MIME gives email confidentiality and authentication."]]}};
var NOTES = [{"n":1,"name":"Auditing Information Systems","weight":"18%","html":"<p class=\"lead\">This domain tests how an IS auditor plans, performs and reports an audit. Expect questions on independence, risk-based planning, evidence, sampling, CAATs, reporting and follow-up. Almost every question here rewards the same habit: think like an auditor who assesses and recommends, and never like the manager who fixes things.<\/p><div class=\"tip\"><strong>Must-know points<\/strong><ul><li>The auditor <b>assesses and recommends<\/b>. Management <b>decides, accepts risk and implements<\/b>.<\/li><li>Audit work is <b>risk-based<\/b>: focus effort where the risk is highest.<\/li><li><b>Independence<\/b> comes first. Never audit your own work or design the controls you will audit.<\/li><li>Evidence must be <b>sufficient, reliable and relevant<\/b>. Independent external evidence is the strongest.<\/li><li>Weak controls mean <b>more substantive testing<\/b>. Strong controls allow lighter testing.<\/li><li>Suspected fraud goes to <b>appropriate management or the audit committee<\/b>. Never confront or investigate alone.<\/li><\/ul><\/div><h3>1. The ISACA mindset<\/h3><ul><li>Answer as an <b>auditor<\/b>, not as an engineer or a manager. Auditors evaluate controls and report; they do not implement them.<\/li><li>Keywords: <b>FIRST<\/b> usually means plan, understand or assess risk before acting. <b>BEST<\/b> means the most effective, preventive or reliable choice. <b>MOST<\/b> means highest risk or impact.<\/li><li>Business objectives and risk drive every audit decision. A technically perfect answer that ignores risk is usually wrong.<\/li><li>Always report findings through the proper reporting line, even when management is uncomfortable.<\/li><\/ul><h3>2. Types of audits and engagements<\/h3><div class=\"tw\"><table><thead><tr><th>Type<\/th><th>Purpose<\/th><\/tr><\/thead><tbody><tr><td>Financial audit<\/td><td>Assess accuracy of financial statements and the controls behind them.<\/td><\/tr><tr><td>Operational audit<\/td><td>Assess efficiency and effectiveness of operations and processes.<\/td><\/tr><tr><td>Compliance audit<\/td><td>Check adherence to laws, regulations, policies and contracts.<\/td><\/tr><tr><td>Integrated audit<\/td><td>Combines financial, operational and IT audit work in one engagement.<\/td><\/tr><tr><td>IS (IT) audit<\/td><td>Evaluate IT systems, processes and controls for security, integrity and availability.<\/td><\/tr><tr><td>Forensic audit<\/td><td>Investigate fraud or crime and preserve evidence for legal use.<\/td><\/tr><tr><td>Third-party assurance<\/td><td>Reports such as SOC 1, SOC 2 and SOC 3 on a service provider's controls.<\/td><\/tr><\/tbody><\/table><\/div><h3>3. Audit charter and the audit function<\/h3><ul><li>The <b>audit charter<\/b> defines the audit function's purpose, authority, responsibility and accountability. It is approved by the <b>board or audit committee<\/b>, not by the auditee.<\/li><li>The <b>annual audit plan<\/b> is built from a <b>risk assessment<\/b> of the audit universe (all auditable areas), with resources and timing matched to risk.<\/li><li>The audit function should report <b>functionally to the board or audit committee<\/b> to protect independence.<\/li><li>Quality assurance covers supervision, workpaper review and periodic internal and external assessments of the audit function.<\/li><\/ul><h3>4. Standards, ethics and independence<\/h3><ul><li>Auditors follow the <b>ISACA Code of Professional Ethics<\/b> and audit standards: integrity, objectivity, confidentiality, competence, due professional care and truthful reporting.<\/li><li><b>Organizational independence<\/b>: reporting line to the board or audit committee. <b>Professional independence<\/b>: unbiased attitude and conduct.<\/li><li><b>Threats to independence<\/b>: self-review (auditing what you designed), familiarity, advocacy, intimidation, and financial or personal interests.<\/li><li>If independence is impaired, disclose it to the audit manager or committee. Do not accept roles that conflict with audit work.<\/li><li>Auditors must keep audit information <b>confidential<\/b> and use it only for audit purposes.<\/li><li>Competence: if the auditor lacks skills (for example a new technology), get a qualified specialist and review their work, but the auditor stays responsible for the opinion.<\/li><\/ul><h3>4a. Audit process at a glance<\/h3><div class=\"tw\"><table><thead><tr><th>Step<\/th><th>What happens<\/th><\/tr><\/thead><tbody><tr><td>1. Planning<\/td><td>Define scope and objectives, understand the business and process, assess risk, set the audit program.<\/td><\/tr><tr><td>2. Fieldwork<\/td><td>Gather evidence through inquiry, observation, inspection, re-performance and testing.<\/td><\/tr><tr><td>3. Analysis<\/td><td>Evaluate evidence against criteria, form conclusions, rate findings.<\/td><\/tr><tr><td>4. Reporting<\/td><td>Discuss findings with the auditee, issue the report with management responses.<\/td><\/tr><tr><td>5. Follow-up<\/td><td>Verify that agreed actions were actually completed.<\/td><\/tr><\/tbody><\/table><\/div><p class=\"small\">Scope and objectives come first. Understanding the process (for example by walkthrough) comes before testing.<\/p><h3>5. Risk-based auditing<\/h3><ul><li><b>Audit risk<\/b> is the risk of giving a wrong opinion. Audit risk = Inherent risk x Control risk x Detection risk.<\/li><li>Higher inherent or control risk means the auditor must lower <b>detection risk<\/b> by doing <b>more or stronger testing<\/b>.<\/li><li>Use a <b>risk assessment<\/b> to rank areas for the audit plan, considering impact, likelihood, past findings, change and regulatory exposure.<\/li><li><b>Materiality<\/b> has a financial and a qualitative side. A small amount can still be material if it hides fraud, a legal breach or a control failure.<\/li><li>Several small weaknesses in one area can be material <b>in aggregate<\/b>. Consider their combined effect.<\/li><\/ul><div class=\"tw\"><table><thead><tr><th>Risk<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Inherent risk<\/td><td>Risk of a material error before considering any controls.<\/td><\/tr><tr><td>Control risk<\/td><td>Risk that controls will not prevent or detect a material error in time.<\/td><\/tr><tr><td>Detection risk<\/td><td>Risk that the auditor's procedures fail to detect a material error.<\/td><\/tr><tr><td>Sampling risk<\/td><td>Risk the sample does not represent the population.<\/td><\/tr><tr><td>Non-sampling risk<\/td><td>Risk from wrong methods, misreading evidence or poor judgment.<\/td><\/tr><tr><td>Residual risk<\/td><td>Risk remaining after controls are applied.<\/td><\/tr><\/tbody><\/table><\/div><h3>6. Controls<\/h3><div class=\"tw\"><table><thead><tr><th>Control type<\/th><th>Role<\/th><th>Examples<\/th><\/tr><\/thead><tbody><tr><td>Preventive<\/td><td>Stop problems before they occur.<\/td><td>Access restrictions, edit checks, segregation of duties, approvals.<\/td><\/tr><tr><td>Detective<\/td><td>Find problems after they occur.<\/td><td>Exception reports, reconciliations, log reviews, audit trails.<\/td><\/tr><tr><td>Corrective<\/td><td>Fix problems and reduce impact.<\/td><td>Backup restore, incident response, patching.<\/td><\/tr><tr><td>Deterrent<\/td><td>Discourage violations.<\/td><td>Warning banners, policies, visible cameras.<\/td><\/tr><tr><td>Compensating<\/td><td>Offset a missing or weak control.<\/td><td>Management review where duties cannot be separated.<\/td><\/tr><\/tbody><\/table><\/div><ul><li><b>General controls<\/b> cover the IT environment (access, change, operations, backup). <b>Application controls<\/b> sit inside a process (input, processing, output).<\/li><li>Test <b>design<\/b> (is the control suitable?) and <b>operating effectiveness<\/b> (did it work consistently over the period?).<\/li><li>A control that can be <b>bypassed<\/b> is not effective unless a compensating control exists.<\/li><li>When duties cannot be separated, rely on compensating controls such as independent review of exception reports.<\/li><\/ul><h3>7. Audit evidence<\/h3><ul><li>Evidence must be <b>sufficient<\/b> (enough), <b>reliable<\/b> (trustworthy), <b>relevant<\/b> (related to the objective) and <b>useful<\/b>.<\/li><li><b>Reliability ranking<\/b> (strongest to weakest): independent external confirmation, then evidence from strong internal controls, then evidence the auditor obtains directly, then documents, then management representations and interview answers alone.<\/li><li>System-generated reports used as evidence need a check of <b>completeness and accuracy<\/b> (source, parameters, logic).<\/li><li>If people describe a control differently from the written procedure, perform a <b>walkthrough or test<\/b> to see how it truly works.<\/li><li>Management claims that a finding is fixed need <b>independent verification<\/b> before closing.<\/li><\/ul><div class=\"tw\"><table><thead><tr><th>Technique<\/th><th>What it is<\/th><\/tr><\/thead><tbody><tr><td>Inquiry<\/td><td>Asking questions. Useful but the weakest evidence on its own.<\/td><\/tr><tr><td>Observation<\/td><td>Watching a process being performed.<\/td><\/tr><tr><td>Inspection<\/td><td>Examining records, documents or systems.<\/td><\/tr><tr><td>Re-performance<\/td><td>The auditor repeats the control or calculation independently.<\/td><\/tr><tr><td>Recalculation<\/td><td>Checking arithmetic accuracy.<\/td><\/tr><tr><td>Confirmation<\/td><td>Obtaining direct written answers from independent third parties.<\/td><\/tr><tr><td>Analytical procedures<\/td><td>Comparing trends and ratios to find unusual items.<\/td><\/tr><\/tbody><\/table><\/div><h3>8. Sampling<\/h3><ul><li><b>Compliance tests<\/b> check whether controls exist and work. <b>Substantive tests<\/b> check the accuracy, completeness and validity of the data itself.<\/li><li>If compliance tests show weak controls, <b>increase substantive testing<\/b>.<\/li><li><b>Statistical sampling<\/b> lets the auditor measure sampling risk objectively. <b>Judgmental sampling<\/b> relies on the auditor's choice.<\/li><\/ul><div class=\"tw\"><table><thead><tr><th>Method<\/th><th>Use<\/th><\/tr><\/thead><tbody><tr><td>Attribute sampling<\/td><td>Compliance testing. Estimates how often a control or condition occurs (yes or no).<\/td><\/tr><tr><td>Variable sampling<\/td><td>Substantive testing. Estimates monetary amounts or numeric values.<\/td><\/tr><tr><td>Stratified sampling<\/td><td>Splits the population into groups to reduce variability and sample size.<\/td><\/tr><tr><td>Discovery sampling<\/td><td>Looks for at least one critical item (fraud, unauthorized vendor) when expected errors are near zero.<\/td><\/tr><tr><td>Systematic sampling<\/td><td>Every nth item. Watch for patterns in the population that bias results.<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tip\"><strong>Sample size rules<\/strong><ul><li>Higher required <b>confidence<\/b> means a larger sample.<\/li><li>Higher <b>tolerable error<\/b> means a smaller sample.<\/li><li>Higher <b>expected error<\/b> means a larger sample.<\/li><li>Population size has little effect on sample size once the population is large.<\/li><li>If the sample error rate exceeds the tolerable rate, the control cannot be relied on.<\/li><\/ul><\/div><h3>9. CAATs, data analytics and continuous auditing<\/h3><ul><li><b>CAATs<\/b> let the auditor test whole populations, find duplicates or gaps, and re-perform calculations. Typical tools: generalized audit software, test data, integrated test facility, parallel simulation, embedded audit modules, snapshots.<\/li><li>Before using CAATs on production data, get <b>read-only access or a copy<\/b> and confirm the data's <b>completeness and integrity<\/b>.<\/li><li><b>Embedded audit modules<\/b> monitor transactions in real time and flag exceptions for continuous auditing.<\/li><li><b>Continuous auditing<\/b> (done by the auditor) shortens the time between a control failure and its detection. <b>Continuous monitoring<\/b> is done by management.<\/li><li><b>Control self-assessment (CSA)<\/b> raises process-owner ownership of controls and surfaces risks early. It does not replace independent audit.<\/li><\/ul><h3>10. Fieldwork and documentation<\/h3><ul><li>Workpapers must let an <b>independent reviewer<\/b> follow the work, the evidence and the conclusions.<\/li><li>Supervisors review workpapers. Workpapers belong to the audit function and stay confidential.<\/li><li>Document scope, procedures, evidence, findings and conclusions. Retain according to policy and law.<\/li><\/ul><h3>11. Reporting and follow-up<\/h3><ul><li>A finding has five parts: <b>condition<\/b> (what was found), <b>criteria<\/b> (the standard), <b>cause<\/b>, <b>effect<\/b> (the risk) and <b>recommendation<\/b>.<\/li><li>A report states scope, objectives, period, findings, conclusions, recommendations and any <b>limitations<\/b>.<\/li><li>Discuss findings with the auditee <b>before issuing<\/b> to confirm facts, not to negotiate the conclusion.<\/li><li>Include <b>management's response<\/b> and target dates. Planned remediation does not remove a finding.<\/li><li>If management disagrees but the evidence supports the finding, keep it and report both views.<\/li><li>If management accepts a risk the auditor thinks is too high, <b>escalate<\/b> to senior management or the audit committee. Risk acceptance must be made and documented at the right level.<\/li><li>A <b>scope limitation<\/b> (for example denied access) is escalated, and disclosed in the report if unresolved.<\/li><li>Report significant weaknesses promptly. Do not wait for the final report.<\/li><li><b>Follow-up<\/b> verifies independently that agreed corrective actions were completed.<\/li><\/ul><h3>12. Fraud and illegal acts<\/h3><ul><li>Management is responsible for preventing and detecting fraud. The auditor evaluates fraud risk and stays alert to red flags.<\/li><li>Fraud triangle: <b>pressure, opportunity, rationalization<\/b>.<\/li><li>If fraud is suspected, <b>do not confront<\/b> anyone. Preserve evidence and report to the appropriate level or the audit committee per policy.<\/li><li>If senior management is involved (for example a control override by the CFO), report to the <b>audit committee or board<\/b>.<\/li><li>An audit gives <b>reasonable, not absolute<\/b> assurance. It cannot guarantee that no fraud exists.<\/li><\/ul><h3>13. Third-party and service organization assurance<\/h3><div class=\"tw\"><table><thead><tr><th>Report<\/th><th>Focus<\/th><\/tr><\/thead><tbody><tr><td>SOC 1<\/td><td>Controls relevant to the customer's financial reporting.<\/td><\/tr><tr><td>SOC 2<\/td><td>Security, availability, processing integrity, confidentiality and privacy controls.<\/td><\/tr><tr><td>SOC 3<\/td><td>Public, summarized version of a SOC 2.<\/td><\/tr><tr><td>Type I<\/td><td>Design of controls at a point in time.<\/td><\/tr><tr><td>Type II<\/td><td>Design and operating effectiveness over a period.<\/td><\/tr><\/tbody><\/table><\/div><ul><li>When relying on a SOC report, check the <b>period covered<\/b>, the <b>scope<\/b>, <b>exceptions<\/b> noted, and the <b>complementary user-entity controls<\/b> the customer must perform.<\/li><li>Outsourcing does not transfer accountability. A <b>right-to-audit<\/b> clause is a key contract term.<\/li><li>When relying on other auditors or experts, assess their competence and independence and review their work.<\/li><\/ul><div class=\"tip warn\"><strong>Common exam traps in Domain 1<\/strong><ul><li>Choosing to <b>test or fix<\/b> before planning or understanding the process.<\/li><li>Letting the auditee or management <b>remove or soften<\/b> a valid finding.<\/li><li>Accepting <b>management representations<\/b> or interviews as enough evidence.<\/li><li>Picking an answer where the auditor <b>implements<\/b> a control, selects a tool or designs the solution.<\/li><li>Confronting a suspect instead of <b>reporting through the proper channel<\/b>.<\/li><li>Confusing <b>attribute sampling<\/b> (controls, yes or no) with <b>variable sampling<\/b> (amounts).<\/li><li>Forgetting that <b>independent external<\/b> evidence beats internal or verbal evidence.<\/li><\/ul><\/div>"},{"n":2,"name":"Governance and Management of IT","weight":"18%","html":"<p class=\"lead\">This domain tests whether IT is directed and managed so that it supports the business. Expect questions on strategy alignment, committees and roles, frameworks, policies, segregation of duties, risk management, outsourcing and performance measurement. The recurring theme is that senior management and the board own IT governance, and the auditor checks that it works.<\/p><div class=\"tip\"><strong>Must-know points<\/strong><ul><li><b>Governance<\/b> evaluates, directs and monitors (board). <b>Management<\/b> plans, builds, runs and monitors (executives).<\/li><li>IT strategy must <b>align with business strategy<\/b>, and the business must be involved.<\/li><li><b>Senior management owns risk acceptance and policy approval.<\/b> You can outsource a task, never accountability.<\/li><li>Treat risk in four ways: <b>mitigate, avoid, transfer, accept<\/b>. Residual risk must fit the risk appetite.<\/li><li><b>Segregation of duties<\/b> and compensating controls are heavily tested.<\/li><li>Before outsourcing: business case and due diligence. In the contract: <b>right to audit<\/b>, SLAs, security, escrow, exit plan.<\/li><\/ul><\/div><h3>1. Governance versus management<\/h3><ul><li><b>Governance<\/b> is the board's job: set direction, evaluate performance and monitor results.<\/li><li><b>Management<\/b> turns that direction into plans, projects and daily operations.<\/li><li>Governance goals: <b>strategic alignment, value delivery, risk management, resource management and performance measurement<\/b>.<\/li><li>Value comes from <b>benefits realization<\/b>: tracking whether IT investments deliver what the business case promised.<\/li><li>The board's key IT responsibility is to <b>set direction and oversee that IT delivers business value<\/b>.<\/li><\/ul><h3>2. Roles and committees<\/h3><div class=\"tw\"><table><thead><tr><th>Role or body<\/th><th>Main responsibility<\/th><\/tr><\/thead><tbody><tr><td>Board of directors<\/td><td>Sets direction, oversees IT value and risk, approves strategy at the top level.<\/td><\/tr><tr><td>Executive management<\/td><td>Implements the strategy, owns policy approval and risk acceptance.<\/td><\/tr><tr><td>IT strategy committee<\/td><td>Advises the board on IT strategy and alignment with the business.<\/td><\/tr><tr><td>IT steering committee<\/td><td>Senior business and IT leaders who prioritize projects, approve major spending and monitor delivery.<\/td><\/tr><tr><td>CIO<\/td><td>Leads IT delivery and operations.<\/td><\/tr><tr><td>CISO / security officer<\/td><td>Leads security governance. Should be independent of IT operations where possible.<\/td><\/tr><tr><td>Data owner<\/td><td>Decides classification and who may access the data.<\/td><\/tr><tr><td>Data custodian<\/td><td>Implements and maintains controls protecting the data for the owner.<\/td><\/tr><tr><td>Process owner<\/td><td>Responsible for a business process and its controls.<\/td><\/tr><tr><td>IS auditor<\/td><td>Gives independent assurance. Does not own or implement controls.<\/td><\/tr><\/tbody><\/table><\/div><p class=\"small\">The three lines model: operations and management (first), risk and compliance (second), internal audit (third, independent).<\/p><h3>3. Frameworks and standards<\/h3><div class=\"tw\"><table><thead><tr><th>Framework<\/th><th>What it is for<\/th><\/tr><\/thead><tbody><tr><td>COBIT<\/td><td>ISACA framework for governance and management of enterprise IT.<\/td><\/tr><tr><td>ITIL<\/td><td>Best practice for IT service management.<\/td><\/tr><tr><td>ISO/IEC 27001 and 27002<\/td><td>Information security management system (requirements) and control guidance.<\/td><\/tr><tr><td>ISO 31000<\/td><td>Risk management principles and process.<\/td><\/tr><tr><td>COSO<\/td><td>Internal control and enterprise risk management.<\/td><\/tr><tr><td>ISO/IEC 38500<\/td><td>Corporate governance of IT.<\/td><\/tr><tr><td>NIST CSF<\/td><td>Cybersecurity risk management framework.<\/td><\/tr><tr><td>CMMI<\/td><td>Process maturity and improvement.<\/td><\/tr><tr><td>TOGAF, Zachman<\/td><td>Enterprise architecture.<\/td><\/tr><tr><td>PMBOK, PRINCE2<\/td><td>Project management.<\/td><\/tr><tr><td>ISO 22301<\/td><td>Business continuity management.<\/td><\/tr><\/tbody><\/table><\/div><h3>4. Strategy, planning and performance<\/h3><ul><li>The <b>IT strategic plan<\/b> is long term (typically 3 to 5 years) and linked to the approved business plan. Tactical and operational plans follow from it.<\/li><li>An approved IT plan that is <b>linked to the business plan<\/b> is the best sign of alignment.<\/li><li><b>Portfolio management<\/b> prioritizes projects by business value and risk, not by who asks loudest.<\/li><li><b>Business cases<\/b> justify investment and are the baseline for benefits tracking.<\/li><li><b>Enterprise architecture<\/b> describes current and target IT structure so IT assets fit business needs and complexity is reduced.<\/li><\/ul><div class=\"tw\"><table><thead><tr><th>Tool<\/th><th>Purpose<\/th><\/tr><\/thead><tbody><tr><td>Balanced scorecard<\/td><td>Measures performance from several perspectives: financial, customer, internal process, learning and growth.<\/td><\/tr><tr><td>KPI / KGI / CSF<\/td><td>Key performance indicators, key goal indicators and critical success factors.<\/td><\/tr><tr><td>Maturity model<\/td><td>Rates process maturity. Levels run from ad hoc, to repeatable, defined, managed and optimized.<\/td><\/tr><tr><td>Benchmarking<\/td><td>Compares performance with peers or standards.<\/td><\/tr><tr><td>RACI matrix<\/td><td>Clarifies who is responsible, accountable, consulted and informed.<\/td><\/tr><\/tbody><\/table><\/div><ul><li>A maturity rating of <b>defined<\/b> means processes are documented, standardized and communicated. <b>Optimized<\/b> means continuous improvement.<\/li><li>A claimed maturity level needs <b>evidence<\/b> from the auditor.<\/li><\/ul><h3>5. Policies, standards, procedures, guidelines<\/h3><div class=\"tw\"><table><thead><tr><th>Document<\/th><th>Nature<\/th><\/tr><\/thead><tbody><tr><td>Policy<\/td><td>High-level, mandatory statement of management intent. Approved by senior management and reviewed periodically.<\/td><\/tr><tr><td>Standard<\/td><td>Mandatory, specific requirements that support a policy.<\/td><\/tr><tr><td>Procedure<\/td><td>Step-by-step instructions for a task.<\/td><\/tr><tr><td>Guideline<\/td><td>Recommended, optional advice.<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Policies must be <b>communicated<\/b>, understood and enforced. Repeated exceptions suggest the policy or process needs review.<\/li><li>Use a <b>formal exception process<\/b> with risk acceptance, an expiry date and review.<\/li><\/ul><h3>6. Organization, segregation of duties and HR<\/h3><ul><li><b>Segregation of duties (SoD)<\/b> separates incompatible functions so one person cannot commit and hide an error or fraud.<\/li><li>Typical incompatible combinations: programmer and production access, programmer and operator, data entry and transaction authorization, security administrator and business transactions, creating an employee and approving payments.<\/li><li>When SoD is impossible, use <b>compensating controls<\/b>: independent review of exception reports, supervision, reconciliations, audit trails.<\/li><li><b>Mandatory vacations and job rotation<\/b> help detect irregularities because someone else performs the duties.<\/li><li><b>Hiring<\/b>: role-appropriate background checks, signed confidentiality terms, clear job descriptions.<\/li><li><b>Termination<\/b>: remove access <b>immediately<\/b>, recover assets, and review activity.<\/li><li>Watch for <b>key-person dependency<\/b>. Use documentation, cross-training and succession planning.<\/li><li><b>Training<\/b> should be role-based, tested and recorded.<\/li><\/ul><h3>7. Risk management<\/h3><ul><li>Steps: identify assets, threats and vulnerabilities, assess likelihood and impact, evaluate against appetite, treat, then monitor and report.<\/li><li><b>Risk = likelihood x impact.<\/b> Assessment can be qualitative (ratings) or quantitative (money).<\/li><li><b>Quantitative formulas<\/b>: Single loss expectancy (SLE) = asset value x exposure factor. Annual loss expectancy (ALE) = SLE x annual rate of occurrence (ARO).<\/li><li><b>Risk appetite<\/b> is the amount and type of risk the organization will accept to reach its goals. <b>Tolerance<\/b> is the acceptable deviation around it.<\/li><li><b>Residual risk<\/b> is what remains after controls. If it exceeds appetite, apply further treatment or get a formal decision from senior management.<\/li><li><b>Key risk indicators (KRIs)<\/b> give early warning that risk is nearing tolerance. A <b>risk register<\/b> records risks, owners and treatments.<\/li><\/ul><div class=\"tw\"><table><thead><tr><th>Treatment<\/th><th>Meaning<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td>Mitigate<\/td><td>Reduce likelihood or impact.<\/td><td>Add a control, patch, add redundancy.<\/td><\/tr><tr><td>Avoid<\/td><td>Stop the risky activity.<\/td><td>Discontinue a product line.<\/td><\/tr><tr><td>Transfer or share<\/td><td>Pass the financial impact to another party.<\/td><td>Insurance, outsourcing, contractual terms.<\/td><\/tr><tr><td>Accept<\/td><td>Knowingly keep the risk.<\/td><td>Formal decision by senior management, documented.<\/td><\/tr><\/tbody><\/table><\/div><h3>8. Outsourcing and third parties<\/h3><ul><li><b>Before<\/b> outsourcing: build the business case, define requirements, perform due diligence and assess risk.<\/li><li><b>Contract<\/b> should include: SLAs with measurable metrics, <b>right to audit<\/b>, security and privacy requirements, ownership of deliverables and IP, source code escrow, incident notification times, data location, subcontracting rules, business continuity, and an exit or transition plan.<\/li><li><b>Ongoing<\/b>: monitor SLAs through independently verified data, review SOC reports, and perform audits.<\/li><li><b>Accountability stays with the organization<\/b> even when a provider processes the data.<\/li><li><b>Offshoring<\/b> adds legal, privacy, cross-border and geopolitical risk.<\/li><li><b>Cloud<\/b>: responsibilities are shared. In IaaS the customer manages the operating system and above. In SaaS the customer remains responsible for its data and access management.<\/li><li>A merchant that stores cardholder data stays responsible for protecting it, even if payments are processed by a third party.<\/li><\/ul><h3>9. IT management practices<\/h3><ul><li><b>Quality management<\/b>: quality assurance checks processes comply with standards; quality control checks the output.<\/li><li><b>Financial management<\/b>: budgets, chargeback, total cost of ownership and return on investment. Repeated budget overruns point to weak estimating and oversight.<\/li><li><b>Capacity and performance management<\/b> ensure resources meet current and future demand.<\/li><li><b>Asset management<\/b>: keep an inventory of information assets so they can be classified, owned and protected.<\/li><\/ul><h3>10. Legal, regulatory and privacy<\/h3><ul><li>Management is responsible for <b>identifying applicable laws<\/b> and ensuring compliance. The auditor reviews that process.<\/li><li>Common privacy principles: lawful basis or consent, <b>purpose limitation<\/b>, data minimization, accuracy, storage limitation, security, accountability, individual rights, breach notification and controls on cross-border transfer.<\/li><li>Using personal data for a new purpose needs a legal basis or fresh consent.<\/li><\/ul><h3>11. Business continuity governance<\/h3><ul><li>Senior management owns the business continuity policy and approves the plan. Details are in Domain 4.<\/li><li>A plan that is not updated after major change (for example a merger) no longer reflects the business.<\/li><\/ul><h3>12. What the auditor checks in IT governance<\/h3><ul><li>A documented, approved IT strategy linked to the business plan.<\/li><li>Committee minutes showing real decisions, priorities and follow-up.<\/li><li>Defined roles, decision rights and reporting lines (organization chart, RACI).<\/li><li>Current policies, an exception process and evidence of communication.<\/li><li>A risk register, KRIs and clear risk acceptance records.<\/li><li>Performance metrics and benefits tracking against business cases.<\/li><li>Outsourcing contracts, SLA reports and right-to-audit clauses.<\/li><\/ul><div class=\"tip warn\"><strong>Common exam traps in Domain 2<\/strong><ul><li>Letting <b>IT alone<\/b> set strategy, or letting IT staff approve policy.<\/li><li>Believing that <b>outsourcing transfers accountability<\/b>.<\/li><li>Treating the <b>auditor<\/b> as the one who accepts risk or approves policy.<\/li><li>Confusing <b>data owner<\/b> (classifies, approves access) with <b>custodian<\/b> (protects).<\/li><li>Ignoring <b>compensating controls<\/b> when duties cannot be separated.<\/li><li>Mixing up <b>risk avoidance<\/b> (stop the activity) with <b>transfer<\/b> (insurance).<\/li><li>Choosing a technical answer when the question is about <b>governance or alignment<\/b>.<\/li><\/ul><\/div>"},{"n":3,"name":"Information Systems Acquisition, Development and Implementation","weight":"12%","html":"<p class=\"lead\">This domain tests how systems are justified, acquired, built, tested and put into production, and how the auditor evaluates those steps. Expect questions on project governance, the SDLC, testing types, data conversion, cutover methods, change control and application controls. The auditor's role is to confirm that business needs, controls and approvals are built in from the start.<\/p><div class=\"tip\"><strong>Must-know points<\/strong><ul><li>Projects fail mostly from <b>weak senior management support and poor user involvement<\/b>.<\/li><li>The <b>business owner and users<\/b> sign off requirements and accept the system (UAT). Developers do not.<\/li><li><b>Developers must not move their own code to production.<\/b> A separate release function does.<\/li><li>A <b>post-implementation review<\/b> checks whether objectives and benefits were achieved.<\/li><li><b>Parallel<\/b> cutover is lowest risk but costly. <b>Big bang<\/b> has no fallback.<\/li><li>Build <b>controls and security into the SDLC<\/b>, not after release.<\/li><\/ul><\/div><h3>1. Project governance and management<\/h3><ul><li>A <b>business case<\/b> justifies the investment and is the baseline for benefits realization.<\/li><li>A <b>feasibility study<\/b> (technical, economic, operational) is done at <b>project initiation<\/b>.<\/li><li>The <b>steering committee<\/b> (senior business and IT) approves scope, priorities and funding, and decides continue, rescope or stop when problems appear.<\/li><li>The <b>project manager<\/b> plans and controls schedule, cost and scope. The <b>sponsor<\/b> is accountable for business outcomes. A <b>PMO<\/b> sets standards across projects.<\/li><li>If a project has consumed most of its budget but is far behind, <b>re-baseline and reassess the business case<\/b> before more spending.<\/li><li><b>Stage gates<\/b> (phase-end reviews) catch problems early. Without them, issues compound.<\/li><li><b>Scope creep<\/b> is controlled by <b>formal change control<\/b> and impact analysis of every requested change.<\/li><\/ul><div class=\"tw\"><table><thead><tr><th>Tool<\/th><th>Purpose<\/th><\/tr><\/thead><tbody><tr><td>Critical path (CPM)<\/td><td>Longest chain of dependent tasks. Sets the minimum project duration. Delays on it delay the project.<\/td><\/tr><tr><td>Gantt chart<\/td><td>Shows tasks, durations and dependencies over time.<\/td><\/tr><tr><td>PERT<\/td><td>Time estimates using optimistic, most likely and pessimistic values.<\/td><\/tr><tr><td>Function point analysis<\/td><td>Estimates software size from delivered functionality.<\/td><\/tr><tr><td>Earned value<\/td><td>Compares work done with plan and cost to show progress and cost control.<\/td><\/tr><\/tbody><\/table><\/div><h3>2. System development life cycle (SDLC)<\/h3><div class=\"tw\"><table><thead><tr><th>Phase<\/th><th>Key activities and audit focus<\/th><\/tr><\/thead><tbody><tr><td>1. Feasibility<\/td><td>Business case, alternatives, cost-benefit. Confirm management approval.<\/td><\/tr><tr><td>2. Requirements<\/td><td>Gather and document business and security requirements. Users sign off.<\/td><\/tr><tr><td>3. Design<\/td><td>Architecture, data and interface design. Controls and audit trails designed in.<\/td><\/tr><tr><td>4. Development<\/td><td>Coding or configuration. Version control, coding standards, code review.<\/td><\/tr><tr><td>5. Testing<\/td><td>Unit, integration, system and user acceptance testing. Defects tracked and resolved.<\/td><\/tr><tr><td>6. Implementation<\/td><td>Data conversion, training, cutover, go-live approval.<\/td><\/tr><tr><td>7. Post-implementation<\/td><td>Review benefits, lessons learned, ongoing support.<\/td><\/tr><tr><td>8. Disposal<\/td><td>Retire the system, archive or destroy data securely.<\/td><\/tr><\/tbody><\/table><\/div><ul><li><b>Users must be involved in requirements<\/b>. If they were not, the system may not meet needs and may be rejected.<\/li><li><b>Security and control requirements<\/b> are defined early, because retrofitting is expensive and weak.<\/li><li>Auditors may review during development (a preimplementation review) but should not take on design responsibility, which would impair independence.<\/li><\/ul><h3>3. Development approaches<\/h3><div class=\"tw\"><table><thead><tr><th>Approach<\/th><th>Key idea<\/th><th>Audit concern<\/th><\/tr><\/thead><tbody><tr><td>Waterfall<\/td><td>Sequential phases with sign-offs.<\/td><td>Late discovery of requirement errors.<\/td><\/tr><tr><td>Iterative / spiral<\/td><td>Repeated cycles with risk review.<\/td><td>Scope drift, control of versions.<\/td><\/tr><tr><td>Agile (Scrum)<\/td><td>Short iterations, frequent user feedback, working software.<\/td><td>Little formal documentation, so check that approvals, testing and change tracking are evidenced in tools.<\/td><\/tr><tr><td>DevOps / DevSecOps<\/td><td>Automated build, test and release with security built in.<\/td><td>Segregation of duties in pipelines, approvals for releases.<\/td><\/tr><tr><td>Prototyping<\/td><td>Build a rough model to refine requirements.<\/td><td>Prototype pushed into production with weak controls and documentation.<\/td><\/tr><tr><td>RAD<\/td><td>Fast development with prototypes and reusable parts.<\/td><td>Reduced documentation and testing.<\/td><\/tr><tr><td>BPR<\/td><td>Redesign business processes, then supporting systems.<\/td><td>Controls lost during redesign.<\/td><\/tr><\/tbody><\/table><\/div><h3>4. Acquisition and vendor management<\/h3><ul><li>Decide build versus buy using requirements, cost, risk and vendor capability.<\/li><li><b>RFP evaluation<\/b>: fit to requirements, vendor viability, security, support and <b>total cost of ownership<\/b>.<\/li><li><b>Contract<\/b>: SLAs, support, warranties, IP, security terms and <b>source code escrow<\/b>, which protects the customer if the vendor fails.<\/li><li><b>Heavy customization<\/b> of a package makes upgrades and patches difficult and may end vendor support.<\/li><li>Legal review and software licensing compliance are part of acquisition.<\/li><\/ul><h3>5. Testing<\/h3><div class=\"tw\"><table><thead><tr><th>Test<\/th><th>Purpose<\/th><\/tr><\/thead><tbody><tr><td>Unit testing<\/td><td>Individual programs or modules, usually by developers (white-box).<\/td><\/tr><tr><td>Integration testing<\/td><td>Modules work together and exchange data correctly.<\/td><\/tr><tr><td>System testing<\/td><td>Whole system meets requirements, including performance and security.<\/td><\/tr><tr><td>Interface testing<\/td><td>Data passes correctly between systems.<\/td><\/tr><tr><td>User acceptance testing (UAT)<\/td><td>Users confirm the system meets business needs. Final test before approval.<\/td><\/tr><tr><td>Regression testing<\/td><td>Changes did not break existing functions.<\/td><\/tr><tr><td>Stress / load testing<\/td><td>Behavior under heavy volume or beyond limits.<\/td><\/tr><tr><td>Sociability testing<\/td><td>System works in the target environment alongside other software.<\/td><\/tr><tr><td>Parallel testing<\/td><td>Old and new systems run the same data to compare results.<\/td><\/tr><tr><td>Pilot<\/td><td>Rolled out to a small group first.<\/td><\/tr><tr><td>White-box / black-box<\/td><td>White-box uses knowledge of internal code. Black-box tests inputs and outputs only.<\/td><\/tr><\/tbody><\/table><\/div><ul><li><b>Test data<\/b> should not contain live personal data unless masked. Test and production environments should be <b>separate<\/b>.<\/li><li><b>Defects<\/b> are logged, prioritized and retested. Go-live with known critical defects needs a fix or a <b>formal risk acceptance with a rollback plan<\/b>.<\/li><li><b>Security testing<\/b>, such as secure code review and vulnerability testing, belongs inside the lifecycle.<\/li><li><b>Final approval to move to production<\/b> comes from the business owner, based on test results.<\/li><\/ul><h3>6. Data conversion and migration<\/h3><ul><li>Cleanse and map source data, then convert, then reconcile.<\/li><li><b>Completeness<\/b>: reconcile record counts and control totals between old and new systems.<\/li><li><b>Accuracy<\/b>: validate transformed fields against source data, with business sign-off.<\/li><li>Keep source data and a <b>rollback path<\/b> until the new system is accepted.<\/li><li>Handle conversion errors through logged exception reports with follow-up.<\/li><\/ul><h3>7. Cutover (changeover) strategies<\/h3><div class=\"tw\"><table><thead><tr><th>Strategy<\/th><th>Description<\/th><th>Risk or trade-off<\/th><\/tr><\/thead><tbody><tr><td>Big bang (direct)<\/td><td>Switch all at once.<\/td><td>No fallback if the new system fails.<\/td><\/tr><tr><td>Parallel<\/td><td>Run old and new together.<\/td><td>Lowest risk, highest cost and duplicate effort.<\/td><\/tr><tr><td>Phased<\/td><td>Switch in stages or modules.<\/td><td>Longer timeline, interface complexity.<\/td><\/tr><tr><td>Pilot<\/td><td>Small group goes first.<\/td><td>Limited exposure, but may not reveal scale issues.<\/td><\/tr><\/tbody><\/table><\/div><h3>8. Change, configuration and release management<\/h3><ul><li>Every change is <b>requested, assessed, approved, tested and documented<\/b> before release.<\/li><li><b>Separate duties<\/b>: developers build, an independent function releases to production. Developers should not have write access to production.<\/li><li><b>Version control<\/b> and a program library prevent untracked changes and allow rollback.<\/li><li><b>Emergency changes<\/b> follow a fast path, but are documented and approved after the fact.<\/li><li>A <b>source code comparison<\/b> or change log reconciliation detects unauthorized changes.<\/li><li><b>Post-implementation review<\/b> should be objective. A review done only by the project team lacks objectivity.<\/li><\/ul><h3>9. Application controls<\/h3><div class=\"tw\"><table><thead><tr><th>Area<\/th><th>Controls<\/th><\/tr><\/thead><tbody><tr><td>Input<\/td><td>Edit and validation checks (range, reasonableness, format, check digit, completeness), duplicate checks, sequence checks, authorization, error handling.<\/td><\/tr><tr><td>Processing<\/td><td>Run-to-run totals, limit checks, reconciliations, exception reports, audit trails.<\/td><\/tr><tr><td>Output<\/td><td>Reconciliation to input, controlled distribution, review of exceptions, retention.<\/td><\/tr><tr><td>Data integrity<\/td><td>Referential integrity (foreign keys match primary keys), ACID properties: atomicity, consistency, isolation, durability.<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Input validation is a <b>preventive<\/b> control. Reconciliations and exception reports are <b>detective<\/b>.<\/li><li>A duplicate or sequence check best prevents a transaction being processed twice.<\/li><li><b>EDI, web and API processes<\/b> need authentication, integrity checks and audit trails for transactions in transit.<\/li><\/ul><h3>10. Post-implementation and retirement<\/h3><ul><li>A <b>post-implementation review<\/b> measures whether objectives and benefits were achieved and captures lessons learned.<\/li><li><b>System retirement<\/b>: archive required data, destroy the rest securely, remove access and update inventories.<\/li><\/ul><div class=\"tip warn\"><strong>Common exam traps in Domain 3<\/strong><ul><li>Choosing <b>developers<\/b> to perform UAT or to promote code to production.<\/li><li>Picking <b>big bang<\/b> when a safe fallback is required.<\/li><li>Confusing <b>integration<\/b> testing (modules together) with <b>regression<\/b> testing (nothing else broke).<\/li><li>Accepting go-live with <b>known critical defects<\/b> and no risk decision.<\/li><li>Treating a <b>prototype<\/b> as production-ready.<\/li><li>Forgetting that <b>users and the business owner<\/b> own requirements and acceptance.<\/li><li>Letting the <b>auditor<\/b> design the solution during development.<\/li><\/ul><\/div>"},{"n":4,"name":"Information Systems Operations and Business Resilience","weight":"26%","html":"<p class=\"lead\">This is one of the two heaviest domains. It covers how IT runs day to day (hardware, software, databases, networks, service management) and how the organization survives disruption (business continuity, disaster recovery, backups). Expect many questions on RTO and RPO, recovery sites, backup types, incident and problem management, change control and network basics.<\/p><div class=\"tip\"><strong>Must-know points<\/strong><ul><li><b>BIA comes first<\/b> in business continuity planning. It sets priorities, RTO and RPO.<\/li><li><b>RTO<\/b> is how fast to recover. <b>RPO<\/b> is how much data loss is acceptable and drives backup frequency.<\/li><li>Recovery sites from fastest to slowest: <b>hot, warm, cold<\/b>. Hot is fastest and costs the most.<\/li><li><b>Incident management<\/b> restores service. <b>Problem management<\/b> finds the root cause.<\/li><li>Backups are proven only by <b>restore tests<\/b>. Plans are proven by <b>real tests<\/b>, not just reading them.<\/li><li><b>Life safety<\/b> comes first in any disaster.<\/li><\/ul><\/div><h3>1. IT infrastructure basics<\/h3><ul><li><b>Hardware<\/b>: CPU, memory, storage, peripherals. Capacity and maintenance planning prevent outages.<\/li><li><b>Operating systems<\/b> manage resources and security. Controls cover access to system utilities, patching and hardening.<\/li><li><b>Databases<\/b> use a DBMS. In relational databases, <b>normalization<\/b> reduces redundancy, and <b>referential integrity<\/b> keeps foreign keys valid. DBA activity must be <b>logged and independently reviewed<\/b>.<\/li><li><b>Virtualization<\/b> consolidates servers, but a compromise of the hypervisor can affect every guest.<\/li><li><b>Cloud<\/b>: IaaS, PaaS and SaaS. Deployment models are public, private, hybrid and community. Responsibility is shared.<\/li><li><b>Job scheduling<\/b> controls should restrict who can change production schedules and require logging of reruns.<\/li><li><b>End-user computing<\/b> (spreadsheets, local tools) needs inventory, access, version and validation controls.<\/li><\/ul><h3>2. Networks<\/h3><div class=\"tw\"><table><thead><tr><th>OSI layer<\/th><th>Name<\/th><th>Examples<\/th><\/tr><\/thead><tbody><tr><td>7<\/td><td>Application<\/td><td>HTTP, SMTP, DNS, application gateways<\/td><\/tr><tr><td>6<\/td><td>Presentation<\/td><td>Encryption, data formats<\/td><\/tr><tr><td>5<\/td><td>Session<\/td><td>Session setup and control<\/td><\/tr><tr><td>4<\/td><
